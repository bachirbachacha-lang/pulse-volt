<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Potwise mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap">
<style>
body{margin:0;padding:28px 20px 48px;background:#F4F5F7;color:#16181D;font-family:'DM Sans',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{margin:0 0 6px}p{margin:0 0 24px;color:#5E6470;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:28px}
figure{margin:0}figcaption{font-weight:700;margin-bottom:8px}

<p>Static design mockups of the four main screens. Sample content only, not connected to data. Each one is a plain HTML file you can also open on its own.</p>
<div class="row">
<figure><figcaption>1. Home</figcaption><iframe src="home.html" title="Home mockup"></iframe></figure>
<figure><figcaption>2. Recipe</figcaption><iframe src="recipe.html" title="Recipe mockup"></iframe></figure>
<figure><figcaption>3. Chef</figcaption><iframe src="chef.html" title="Chef mockup"></iframe></figure>
<figure><figcaption>4. Pantry</figcaption><iframe src="pantry.html" title="Pantry mockup"></iframe></figure>
