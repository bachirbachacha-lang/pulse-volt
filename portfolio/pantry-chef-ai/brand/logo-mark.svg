<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Potwise logo mark">
  <title>Potwise logo mark</title>
  <rect width="96" height="96" rx="24" fill="#FFC629"/>
  <!-- spark: the "wise" idea rising from the pot -->
  <path d="M48 12c1.6 7.4 4.6 10.4 12 12-7.4 1.6-10.4 4.6-12 12-1.6-7.4-4.6-10.4-12-12 7.400-1.600 10.400-4.600 12-12z" fill="#FFFFFF"/>
  <!-- lid -->
  <rect x="22" y="43" width="52" height="7" rx="3.500" fill="#16181D"/>
  <!-- pot body with side handles -->
  <path d="M26 55h44v11c0 8.800-7.200 16-16 16H42c-8.800 0-16-7.200-16-16V55z" fill="#16181D"/>
  <rect x="14" y="57" width="12" height="7" rx="3.500" fill="#16181D"/>
  <rect x="70" y="57" width="12" height="7" rx="3.500" fill="#16181D"/>
  <!-- smile: friendly, not a face mascot -->
  <path d="M40 67c2 3.200 5 4.800 8 4.800s6-1.600 8-4.800" fill="none" stroke="#FFC629" stroke-width="3.500" stroke-linecap="round"/>
</svg>
