<title>VÉLOUR Hood Hoodie</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;600&display=swap">
<style>
/* layout: one dark column on phone, three columns on desktop, each version a photo with name and note */
:root{--bg:#0e0d0c;--fg:#ece3d2;--muted:#9a9282;--gold:#c9a86a;--line:#2a2622;--display:'Cormorant Garamond',Georgia,serif;--body:Manrope,system-ui,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);padding:0 16px}
main{max-width:1200px;margin:0 auto;padding-block:36px 56px;display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);padding-bottom:24px}
h1{font:500 clamp(34px,6vw,56px)/1.05 var(--display);margin:0;text-wrap:balance}
.k{font:600 11px var(--body);letter-spacing:.35em;text-transform:uppercase;color:var(--gold)}
p{margin:0;color:var(--muted);line-height:1.6;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
figure{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
figure img{width:100%;height:auto;display:block;border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.n{font:500 26px var(--display)}
</style>
<main>
<header><div class="k">VÉLOUR · Drop 01</div><h1>The Hood Hoodie, 6 versions</h1><p>Previews made from your hoodie photo. Pinch to zoom.</p></header>
<div class="grid">
<figure><img src="crest.jpg" alt="Crème hood hoodie with charcoal V crest and VELOUR on the hood"><div class="row"><span class="n">01 · Crest</span><span class="k">Crème</span></div><p>Your design cleaned up. Our V instead of the random crest, charcoal thread.</p></figure>
<figure><img src="tonal.jpg" alt="Crème hood hoodie with tonal hood text and small red rose on chest"><div class="row"><span class="n">02 · Tonal</span><span class="k">Crème</span></div><p>Hood text one shade darker. Small red rose and Feel The Weight on the chest.</p></figure>
<figure><img src="gold.jpg" alt="Crème hood hoodie with gold thread"><div class="row"><span class="n">03 · Gold</span><span class="k">Crème</span></div><p>Gold thread on crème. The most luxury one.</p></figure>
<figure><img src="noir.jpg" alt="Black hood hoodie with cream thread and red rose"><div class="row"><span class="n">04 · Noir</span><span class="k">Black</span></div><p>Cream thread on black. The red rose pops the most.</p></figure>
<figure><img src="ciel.jpg" alt="Baby blue hood hoodie with white thread"><div class="row"><span class="n">05 · Ciel</span><span class="k">Baby blue</span></div><p>White thread. Matches the blue zip-up.</p></figure>
<figure><img src="rose.jpg" alt="Pink hood hoodie with deep red thread"><div class="row"><span class="n">06 · Rose</span><span class="k">Pink</span></div><p>Deep red thread, matching the rose.</p></figure>
</div>
</main>
