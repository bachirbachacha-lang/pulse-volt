<title>Dream Builders</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D job site; stats card top-left, menu buttons top-right, job HUD docked bottom; panels slide up as sheets. One bright daytime look by choice (it is a game world). */
:root{
  --sky:#8fd3ff;
  --ink:#1d2433;
  --paper:#ffffff;
  --muted:#5b6578;
  --hat:#ffb320;
  --hat-dark:#d98a00;
  --cash:#18a957;
  --blue:#2f7bff;
  --line:rgba(29,36,51,.12);
  --shade:rgba(10,18,40,.55);
  --f-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font:700 15px/1.4 var(--f-body);overflow:hidden;user-select:none;-webkit-user-select:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.top{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none;z-index:5}
.top > *{pointer-events:auto}
.stats{background:var(--paper);border-radius:16px;padding:10px 14px 12px;box-shadow:0 4px 0 rgba(0,0,0,.12);min-width:210px}
.cash{font:400 30px/1 var(--f-display);color:var(--cash);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:8px}
.cash .coin{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3a6,#ffcc1f 55%,#d69a00);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.rank{margin-top:6px;display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.rank b{color:var(--ink);font-weight:900}
.xp{margin-top:6px;height:8px;border-radius:99px;background:#e9edf3;overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hat),#ffd25e);border-radius:99px;transition:width .4s ease}
.menu{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mbtn{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border:0;border-radius:14px;background:var(--paper);box-shadow:0 4px 0 rgba(0,0,0,.14);font:400 18px/1 var(--f-display);letter-spacing:.02em;transition:transform .12s ease}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.mbtn.primary{background:var(--hat);box-shadow:0 4px 0 var(--hat-dark)}
.mbtn svg{width:20px;height:20px;flex:none}

/* job hud */
.hud{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));z-index:5;display:grid;gap:10px}
.jobcard{background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 5px 0 rgba(0,0,0,.14);display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ava{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:400 20px/1 var(--f-display);color:#fff}
.jobcard h3{margin:0;font:400 18px/1.1 var(--f-display);letter-spacing:.01em}
.jobcard p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.prog{margin-top:8px;height:12px;border-radius:99px;background:#e9edf3;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#33c46c,var(--cash));border-radius:99px;transition:width .2s ease}
.pay{text-align:right;font:400 22px/1 var(--f-display);color:var(--cash);font-variant-numeric:tabular-nums}
.pay small{display:block;margin-top:4px;font:800 12px/1.2 var(--f-body);color:var(--muted)}
.pay small.hot{color:#e2552b}
.palette{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.swatch{width:46px;height:46px;border-radius:12px;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.swatch.on{outline:4px solid var(--ink);outline-offset:1px}
.swatch.want::after{content:"";display:block;width:100%;height:100%;border-radius:8px;background:radial-gradient(circle,rgba(255,255,255,.9) 18%,transparent 20%)}
.idle{background:rgba(255,255,255,.92);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 rgba(0,0,0,.14);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.idle p{margin:0;max-width:34ch}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:20;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{width:min(640px,100%);max-height:min(82vh,760px);overflow:auto;background:var(--paper);border-radius:22px;padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);animation:up .22s ease}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet h2{margin:0;font:400 28px/1 var(--f-display);letter-spacing:.01em}
.x{width:44px;height:44px;border:0;border-radius:12px;background:#eef1f6;font:900 20px/1 var(--f-body)}
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#f5f7fb;border:2px solid transparent}
.row .meta{min-width:0}
.row h4{margin:0;font:400 19px/1.1 var(--f-display);letter-spacing:.01em}
.row p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.tag{display:inline-block;margin-right:6px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;color:#fff}
.t-build{background:#2f7bff}.t-fix{background:#e2552b}.t-paint{background:#a24bff}
.go{min-width:96px;min-height:48px;border:0;border-radius:14px;background:var(--cash);color:#fff;box-shadow:0 4px 0 #0d7b3e;font:400 18px/1 var(--f-display)}
.go:disabled{background:#c5ccd8;box-shadow:0 4px 0 #a9b1bf;cursor:not-allowed}
.go.buy{background:var(--hat);color:var(--ink);box-shadow:0 4px 0 var(--hat-dark)}
.lock{font-size:12px;color:var(--muted);text-align:right}
.ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.ico svg{width:26px;height:26px}
.lvl{display:flex;gap:4px;margin-top:6px}
.lvl i{width:16px;height:6px;border-radius:3px;background:#dfe4ec}
.lvl i.on{background:var(--hat)}
.note{margin:12px 2px 0;font-size:13px;color:var(--muted)}
.ghostbtn{min-height:44px;padding:0 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font:800 14px/1 var(--f-body)}

.toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;transition:opacity .25s ease,transform .25s ease;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:block!important;opacity:0;transform:translate(-50%,-8px)}

.done{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(10,18,40,.35);padding:16px}
.done .card{background:var(--paper);border-radius:24px;padding:22px 22px 18px;text-align:center;width:min(380px,100%);box-shadow:0 12px 40px rgba(0,0,0,.3);animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.done h2{margin:0;font:400 32px/1 var(--f-display)}
.stars{font:400 40px/1 var(--f-display);color:#ffc21a;letter-spacing:6px;margin:10px 0 4px;text-shadow:0 3px 0 #d89a00}
.stars .off{color:#dde2ea;text-shadow:0 3px 0 #c3c9d4}
.earn{font:400 40px/1 var(--f-display);color:var(--cash);font-variant-numeric:tabular-nums}
.done p{margin:6px 0 16px;color:var(--muted)}
.hint{position:fixed;left:50%;transform:translateX(-50%);top:calc(110px + env(safe-area-inset-top,0px));z-index:4;background:rgba(255,255,255,.9);padding:8px 14px;border-radius:12px;font-size:13px;color:var(--muted);pointer-events:none;text-align:center;max-width:calc(100% - 32px)}

.keys{margin-top:8px;display:inline-flex;flex-wrap:wrap;gap:4px 10px;background:rgba(255,255,255,.9);border-radius:12px;padding:6px 10px;font-size:12px;color:var(--muted);max-width:260px}
.keys kbd{display:inline-block;min-width:20px;padding:1px 5px;margin-right:2px;border-radius:5px;background:#fff;border:1px solid #cfd5df;border-bottom-width:3px;font:800 11px/1.4 var(--f-body);color:var(--ink);text-align:center}
.prompt{position:fixed;left:50%;top:62%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;background:rgba(29,36,51,.86);color:#fff;padding:8px 14px 8px 8px;border-radius:14px;font:400 18px/1 var(--f-display);letter-spacing:.02em;pointer-events:none;white-space:nowrap}
.prompt kbd{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:#fff;color:var(--ink);font:400 18px/1 var(--f-display);box-shadow:0 3px 0 #b9c0cc}
.touch{display:none}
@media (pointer:coarse){
  .touch{display:block}
  .keys{display:none}
  .joy{position:fixed;left:max(18px,env(safe-area-inset-left,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid rgba(255,255,255,.7);z-index:6;touch-action:none}
  .knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
  .tbtns{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:6;display:grid;gap:12px;justify-items:end}
  .tbtn{width:74px;height:74px;border-radius:50%;border:0;background:rgba(255,255,255,.85);box-shadow:0 4px 0 rgba(0,0,0,.18);font:400 18px/1 var(--f-display);touch-action:none}
  .tbtn.act{width:86px;height:86px;background:var(--hat);box-shadow:0 4px 0 var(--hat-dark);font-size:24px}
  .prompt{top:54%}
}
@media (max-width:560px){
  .stats{min-width:0;padding:8px 12px 10px}
  .cash{font-size:24px}
  .mbtn{padding:0 12px;font-size:16px}
  .mbtn span{display:none}
  .row{grid-template-columns:1fr auto}
  .row .ico{display:none}
  .hint{top:calc(150px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){.sheet,.done .card{animation:none}.xp i,.prog i{transition:none}}
</style>

<canvas id="c" aria-label="3D job site"></canvas>

<div class="top">
  <div class="stats" aria-live="polite">
    <div class="cash"><span class="coin" aria-hidden="true"></span><span id="cash">$0</span></div>
    <div class="rank"><span>Rank <b id="rank">Worker</b></span><span id="xpTxt">0 / 150 XP</span></div>
    <div class="xp"><i id="xpBar"></i></div>
    <div class="keys" aria-label="Controls"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move</span><span><kbd>Space</kbd> jump</span><span><kbd>Shift</kbd> run</span><span><kbd>E</kbd> use</span><span>drag to look</span></div>
  </div>
  <div class="menu">
    <button class="mbtn primary" id="bJobs" type="button" aria-label="Job board"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9 3h6a2 2 0 0 1 2 2v1h3a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a1 1 0 0 1 1-1h3V5a2 2 0 0 1 2-2zm0 3h6V5H9zm-4 3v3h14V9zm0 5v5h14v-5h-6v1h-2v-1z"/></svg><span>Jobs</span></button>
    <button class="mbtn" id="bShop" type="button" aria-label="Tool shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14.7 3.3a5 5 0 0 0-6 6.4L3.3 15.1a2.4 2.4 0 0 0 3.4 3.4l5.4-5.4a5 5 0 0 0 6.4-6l-3 3-2.6-.6-.6-2.6z"/></svg><span>Shop</span></button>
    <button class="mbtn" id="bHome" type="button" aria-label="My mansion"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3 2 11h3v9h5v-6h4v6h5v-9h3z"/></svg><span>Mansion</span></button>
  </div>
</div>

<div class="hint" id="hint" hidden></div>
<div class="prompt" id="prompt" hidden><kbd>E</kbd><span id="promptTxt">Build</span></div>
<div class="touch"><div class="joy" id="joy" aria-hidden="true"><div class="knob" id="knob"></div></div>
<div class="tbtns"><button class="tbtn" id="tJump" type="button" aria-label="Jump">Jump</button><button class="tbtn act" id="tAct" type="button" aria-label="Use">E</button></div></div>
<div class="hud" id="hud"></div>
<div class="toast" id="toast" hidden></div>
<div id="layer"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const T=THREE;
const $=s=>document.querySelector(s);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const money=n=>'$'+Math.round(n).toLocaleString('en-US');

/* =================== SAVE =================== */
const SAVE_KEY='dream-builders-v1';
const fresh={cash:150,xp:0,hammer:0,roller:0,belt:0,golden:false,mansion:false,jobs:0,best:0,seenIntro:false};
let S=Object.assign({},fresh);
try{const raw=localStorage.getItem(SAVE_KEY); if(raw) S=Object.assign({},fresh,JSON.parse(raw));}catch(e){}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}

/* =================== GAME DATA =================== */
const RANKS=[{n:'Worker',xp:0},{n:'Builder',xp:150},{n:'Foreman',xp:550},{n:'Architect',xp:1400},{n:'Construction Boss',xp:3000}];
const rankIdx=()=>{let r=0;RANKS.forEach((k,i)=>{if(S.xp>=k.xp)r=i});return r;};
const TOOLS={
  hammer:{label:'Building tool',names:['Hammer','Nail Gun','Power Drill','Mini Crane','Tower Crane'],power:[1,2,4,8,14],price:[0,250,900,2600,6500],desc:p=>`Places ${p} block${p>1?'s':''} per tap`,
    icon:'<path fill="#5b6578" d="M3 19.5 13 9.5l1.5 1.5-10 10z"/><path fill="#ffb320" d="M11 4h7l3 3-2 2-2-1-4 4-4-4 2-2z"/>'},
  roller:{label:'Paint tool',names:['Brush','Roller','Spray Gun','Paint Cannon'],power:[0,1.05,1.5,2.3],price:[0,200,800,2200],desc:p=>p?`Paints a ${p<1.2?'small':p<2?'medium':'huge'} area per tap`:'Paints 1 block per tap',
    icon:'<rect x="4" y="3" width="14" height="6" rx="2" fill="#a24bff"/><path fill="#5b6578" d="M18 6h2v6h-8v3h-2v-5h8z"/><rect x="9.5" y="15" width="3" height="7" rx="1" fill="#5b6578"/>'},
  belt:{label:'Repair kit',names:['Duct Tape','Toolbelt','Pro Toolbox','Robot Helper'],power:[1,2,3,6],price:[0,180,750,2000],desc:p=>`Fixes ${p} damage per tap`,
    icon:'<rect x="3" y="8" width="18" height="12" rx="2" fill="#e2552b"/><path fill="#5b6578" d="M9 5h6v3h-2V7h-2v1H9z"/><rect x="3" y="12" width="18" height="2" fill="#b33d17"/>'}
};
const GOLDEN_PRICE=8000, MANSION_PRICE=25000;
const CLIENTS=[
  {n:'Mr. Diamond',c:'#2f7bff'},{n:'Lady Goldleaf',c:'#e0a100'},{n:'Baron Von Bucks',c:'#18a957'},
  {n:'Captain Yachtley',c:'#0ea5b7'},{n:'Lil Drip',c:'#a24bff'},{n:'Ms. Penthouse',c:'#e2552b'},
  {n:'Duke Moneybags',c:'#6b4bff'},{n:'Auntie Platinum',c:'#7b8794'}
];
const JOBS=[
  {t:'build',bp:'shed',name:'Garden shed',rank:0,pay:120,par:40},
  {t:'paint',bp:'house',name:'Repaint the house',rank:0,pay:150,par:45},
  {t:'fix',bp:'house',name:'Storm damage repair',rank:0,pay:140,par:35},
  {t:'build',bp:'garage',name:'Two-car garage',rank:1,pay:330,par:60},
  {t:'build',bp:'pool',name:'Infinity pool deck',rank:1,pay:380,par:60},
  {t:'paint',bp:'villa',name:'Villa makeover',rank:2,pay:560,par:60},
  {t:'fix',bp:'villa',name:'Fix up the villa',rank:2,pay:520,par:45},
  {t:'build',bp:'villa',name:'Modern villa',rank:3,pay:1450,par:120},
  {t:'build',bp:'mansion',name:'Mega mansion',rank:4,pay:3400,par:180}
];
const PAINTS=[{n:'Cloud white',c:'#f4f1ea'},{n:'Sky blue',c:'#7ec4ff'},{n:'Mint',c:'#8fe3b8'},{n:'Sunset',c:'#ffb27a'},{n:'Royal purple',c:'#9b7bff'},{n:'Hot pink',c:'#ff7ab8'}];

/* =================== BLUEPRINTS =================== */
function walls(out,x0,z0,w,d,y0,h,t,o){
  o=o||{};
  for(let y=y0;y<y0+h;y++){
    for(let i=0;i<w;i++)for(let j=0;j<d;j++){
      const edge=i===0||j===0||i===w-1||j===d-1; if(!edge) continue;
      const x=x0+i,z=z0+j,ly=y-y0;
      if(o.door&&j===0&&i>=o.door[0]&&i<o.door[0]+o.door[1]&&ly<o.door[2]) continue;
      let tt=t;
      if(o.win&&ly>=1&&ly<=Math.min(h-2,1+(o.winH||0))){
        const corner=(i===0||i===w-1)&&(j===0||j===d-1);
        if(!corner&&((j===0||j===d-1)?(i%o.win===1):(j%o.win===1))) tt='g';
      }
      if(o.front&&j===0&&ly>=o.front[0]&&ly<o.front[1]&&i>0&&i<w-1) tt='g';
      out.push({x,y,z,t:tt});
    }
  }
}
function slab(out,x0,z0,w,d,y,t,skip){for(let i=0;i<w;i++)for(let j=0;j<d;j++){if(skip&&skip(i,j))continue;out.push({x:x0+i,y,z:z0+j,t});}}
const BP={
  shed(){const b=[];walls(b,-2,-1,4,3,0,2,'w',{door:[1,2,2]});slab(b,-2,-1,4,3,2,'r');return b;},
  house(){const b=[];walls(b,-3,-2,7,5,0,3,'c',{door:[3,1,2],win:2});slab(b,-3,-2,7,5,3,'r');walls(b,-1,-1,3,3,4,1,'r');return b;},
  garage(){const b=[];walls(b,-3,-3,6,6,0,3,'c',{door:[1,4,2]});slab(b,-3,-3,6,6,3,'r');return b;},
  pool(){const b=[];slab(b,-5,-3,10,7,0,'s',(i,j)=>i>=2&&i<=7&&j>=2&&j<=4);
    for(let i=0;i<10;i++){if(i%3===0){b.push({x:-5+i,y:1,z:-3,t:'w'});}}
    b.push({x:-5,y:1,z:3,t:'c'},{x:-4,y:1,z:3,t:'c'},{x:4,y:1,z:3,t:'c'});return b;},
  villa(){const b=[];walls(b,-4,-3,9,7,0,3,'c',{door:[4,1,2],front:[0,2],win:2});slab(b,-4,-3,9,7,3,'c');
    walls(b,-3,-2,7,5,4,2,'c',{front:[0,2],win:2});slab(b,-3,-2,7,5,6,'r');return b;},
  mansion(){const b=[];walls(b,-6,-4,13,9,0,3,'c',{door:[5,3,2],front:[0,2],win:2});slab(b,-6,-4,13,9,3,'c');
    walls(b,-5,-3,11,7,4,3,'c',{front:[0,2],win:2});slab(b,-5,-3,11,7,7,'c');
    walls(b,-3,-2,7,5,8,2,'c',{win:2,winH:0});slab(b,-3,-2,7,5,10,'r');
    for(const x of [-6,-3,3,6]) for(let y=0;y<3;y++) b.push({x,y,z:-5,t:'w'});
    return b;}
};
const BP_SIZE={shed:7,house:10,garage:10,pool:13,villa:13,mansion:18};

/* =================== RENDERER =================== */
const canvas=$('#c');
let R;
try{R=new T.WebGLRenderer({canvas,antialias:true});}catch(e){
  document.body.insertAdjacentHTML('beforeend','<div class="done"><div class="card"><h2>3D not available</h2><p>This browser can\'t show 3D graphics. Try Chrome or Edge on a computer or phone.</p></div></div>');
  return;

/* static instanced building (for decor) */
function staticBuild(blocks,ox,oz,colors,rotY){
  const grp=new T.Group();const by={};
  blocks.forEach(b=>{(by[b.t]=by[b.t]||[]).push(b);});
  const d=new T.Object3D();
  for(const t in by){
    const m=(colors&&colors[t])||M[t];
    const im=new T.InstancedMesh(BOX,m,by[t].length);im.castShadow=true;im.receiveShadow=true;
    by[t].forEach((b,i)=>{d.position.set(b.x,b.y+.5,b.z);d.updateMatrix();im.setMatrixAt(i,d.matrix);});
    grp.add(im);
  }
  blocks.forEach(b=>decorOcc.add(ck(ox+b.x,b.y,oz+b.z)));
  grp.position.set(ox,0,oz);grp.rotation.y=rotY||0;world.add(grp);return grp;
}

function setupBuild(blocks){
  job.ghosts=[];job.placed=new Set();job.total=blocks.length;job.count=0;
  blocks.forEach(b=>{const g=new T.Mesh(BOX_G,M.ghostOff);g.position.set(b.x,b.y+.5,b.z);g.userData.b=b;site.add(g);job.ghosts.push(g);});
  if(job.def.bp==='pool'){const w=new T.Mesh(new T.PlaneGeometry(6,3),new T.MeshStandardMaterial({color:0x2bb5ff,roughness:.05,metalness:.2,transparent:true,opacity:0}));w.rotation.x=-Math.PI/2;w.position.set(-.5,.35,0);site.add(w);job.water=w;}
  refreshGhosts();
}
function supported(b){
  if(b.y===0) return true;const P=job.placed;
  return P.has(key(b.x,b.y-1,b.z))||P.has(key(b.x+1,b.y,b.z))||P.has(key(b.x-1,b.y,b.z))||P.has(key(b.x,b.y,b.z+1))||P.has(key(b.x,b.y,b.z-1));
}
function refreshGhosts(){job.avail=[];for(const g of job.ghosts){const on=supported(g.userData.b);g.material=on?M.ghostOn:M.ghostOff;if(on)job.avail.push(g);}}
function placeGhost(g){
  const b=g.userData.b;site.remove(g);job.ghosts.splice(job.ghosts.indexOf(g),1);
  const m=new T.Mesh(BOX,M[b.t]);m.position.set(b.x,b.y+.5,b.z);m.castShadow=true;m.receiveShadow=true;site.add(m);popIn(m);
  job.placed.add(key(b.x,b.y,b.z));job.count++;siteOcc.add(ck(b.x,b.y,b.z));
  if(hits(P.pos.x,P.pos.y,P.pos.z)){P.pos.y=b.y+1;P.vy=0;}
}
function buildTap(hit){
  const power=TOOLS.hammer.power[S.hammer];const origin=hit.position.clone();
  placeGhost(hit);
  for(let k=1;k<power;k++){
    refreshGhosts();if(!job.avail.length)break;
    let best=null,bd=1e9;for(const g of job.avail){const d=g.position.distanceToSquared(origin);if(d<bd){bd=d;best=g;}}
    placeGhost(best);
  }
  refreshGhosts();snd('place');sendWorker(origin);
  if(!job.ghosts.length) finishJob();
  updateProgress();
}

function setupFix(blocks){
  job.issues=[];job.meshes=[];
  const solid=[];
  blocks.forEach(b=>{const m=new T.Mesh(BOX,M[b.t]);m.position.set(b.x,b.y+.5,b.z);m.castShadow=true;m.receiveShadow=true;m.userData.b=b;site.add(m);solid.push(m);siteOcc.add(ck(b.x,b.y,b.z));});
  const glass=solid.filter(m=>m.userData.b.t==='g').sort(()=>Math.random()-.5);
  const maxY=Math.max(...blocks.map(b=>b.y));
  const roof=solid.filter(m=>m.userData.b.t==='r'&&m.userData.b.y===maxY).sort(()=>Math.random()-.5);
  const walls=solid.filter(m=>m.userData.b.y===0&&m.userData.b.t==='c').sort(()=>Math.random()-.5);
  const nG=job.def.bp==='villa'?6:4,nR=job.def.bp==='villa'?4:3,nL=job.def.bp==='villa'?3:2;
  glass.slice(0,nG).forEach(m=>{m.material=M.broken;m.userData.hp=3;m.userData.kind='window';job.issues.push(m);});
  roof.slice(0,nR).forEach(m=>{const b=m.userData.b;siteOcc.delete(ck(b.x,b.y,b.z));m.material=M.hole;m.castShadow=false;m.userData.hp=3;m.userData.kind='roof';job.issues.push(m);});
  walls.slice(0,nL).forEach(w=>{
    const b=w.userData.b;const out=new T.Vector3(Math.sign(b.x)*.62*(Math.abs(b.x)>=Math.abs(b.z)?1:0),0,Math.sign(b.z)*.62*(Math.abs(b.z)>Math.abs(b.x)?1:0));
    const pipe=new T.Mesh(new T.CylinderGeometry(.16,.16,.9,12),mat(0x8fa3b8,{metalness:.6,roughness:.4}));
    pipe.position.set(b.x+out.x,.55,b.z+out.z);pipe.castShadow=true;site.add(pipe);
    const leak=new T.Mesh(new T.SphereGeometry(.28,14,10),new T.MeshStandardMaterial({color:0x2b8cff,emissive:0x0b4fff,emissiveIntensity:.4,transparent:true,opacity:.85}));
    leak.position.set(b.x+out.x*1.6,.35,b.z+out.z*1.6);leak.userData.hp=3;leak.userData.kind='leak';site.add(leak);job.issues.push(leak);
  });
  job.total=job.issues.reduce((a,m)=>a+m.userData.hp,0);job.count=0;
}
function fixTap(hit){
  const p=TOOLS.belt.power[S.belt];const dmg=Math.min(hit.userData.hp,p);hit.userData.hp-=dmg;job.count+=dmg;
  sendWorker(hit.position);puff(hit.position,hit.userData.kind==='leak'?0x7cc0ff:0xffffff);
  hit.scale.setScalar(1.15);setTimeout(()=>hit.scale.setScalar(1),90);
  if(hit.userData.hp<=0){
    job.issues.splice(job.issues.indexOf(hit),1);
    if(hit.userData.kind==='window'){hit.material=M.g;}
    else if(hit.userData.kind==='roof'){hit.material=M.r;hit.castShadow=true;popIn(hit);const b=hit.userData.b;siteOcc.add(ck(b.x,b.y,b.z));if(hits(P.pos.x,P.pos.y,P.pos.z)){P.pos.y=b.y+1;P.vy=0;}}
    else{site.remove(hit);}
    snd('coin');
  } else snd('fix');
  if(!job.issues.length) finishJob();
  updateProgress();
}

/* ---- PAINT ---- */
function setupPaint(blocks){
  job.want=PAINTS[1+Math.floor(Math.random()*(PAINTS.length-1))].c;job.brush=PAINTS[0].c;
  job.paintable=[];
  blocks.forEach(b=>{const pt=b.t==='c'||b.t==='w';const m=new T.Mesh(BOX,pt?M.dull:M[b.t]);m.position.set(b.x,b.y+.5,b.z);m.castShadow=true;m.receiveShadow=true;m.userData.b=b;m.userData.col=null;site.add(m);siteOcc.add(ck(b.x,b.y,b.z));if(pt)job.paintable.push(m);});
  job.total=job.paintable.length;job.count=0;
}
function paintTap(hit){
  const r=TOOLS.roller.power[S.roller];let n=0;
  for(const m of job.paintable){if(m===hit||(r&&m.position.distanceTo(hit.position)<=r+.01)){m.material=paintMat[job.brush];m.userData.col=job.brush;n++;}}
  job.count=job.paintable.filter(m=>m.userData.col===job.want).length;
  sendWorker(hit.position);snd(job.brush===job.want?'paint':'no');
  if(job.brush!==job.want) toast('That\'s not the color '+job.client.n+' asked for!');
  if(job.count===job.total) finishJob();
  updateProgress();
}

/* ---- TAP ---- */
const ray=new T.Raycaster(),ndc=new T.Vector2();
function tap(x,y){
  if(!job||job.done) return;
  const r=canvas.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-((y-r.top)/r.height)*2+1);ray.setFromCamera(ndc,cam);
  hideHint();
  const far=o=>{const d=Math.hypot(o.position.x-P.pos.x,o.position.z-P.pos.z);if(d>9){snd('no');toast('Too far away. Walk closer first.');return true;}return false;};
  if(job.def.t==='build'){
    const h=ray.intersectObjects(job.avail,false)[0];
    if(h){if(!far(h.object)) buildTap(h.object);}
    else{const any=ray.intersectObjects(job.ghosts,false)[0];if(any){snd('no');toast('Build from the ground up! Tap a bright block.');}}
  }else if(job.def.t==='fix'){
    const h=ray.intersectObjects(job.issues,false)[0];if(h&&!far(h.object)) fixTap(h.object);
  }else{
    const h=ray.intersectObjects(job.paintable,false)[0];if(h&&!far(h.object)) paintTap(h.object);
  }
}

/* ---- FINISH ---- */
function tipFor(){const s=(performance.now()-job.start)/1000;const par=job.def.par;
  if(s<=par) return {tip:.5,stars:3}; if(s<=par*1.6) return {tip:.2,stars:2}; return {tip:0,stars:1};}
function finishJob(){
  job.done=true;const {tip,stars}=tipFor();
  const earn=Math.round(job.pay*(1+tip)*(S.golden?2:1));
  const xp=Math.round(job.def.pay*.5*(1+tip));const r0=rankIdx();
  S.cash+=earn;S.xp+=xp;S.jobs++;S.best=Math.max(S.best,earn);save();
  if(job.water) anims.push({water:job.water,t:0,d:.8});
  snd('win');burst(new T.Vector3(0,3,0),24);

      <p>${job.client.n} ${stars===3?'loved it and added a big tip':stars===2?'is happy and left a small tip':'paid, but wanted it faster'}${S.golden?' · Golden Contract doubled your pay':''}. +${xp} XP</p>
      ${r1>r0?`<p style="color:var(--ink);font-weight:900">You ranked up to ${RANKS[r1].n}! Bigger jobs unlocked.</p>`:''}

const keys={};let touchE=false,eCd=0;const joy={x:0,y:0};
const ZONES=[{x:5.5,z:8.3,r:3.2,label:'Job board',fn:()=>openJobs()},{x:-44,z:4.4,r:3.2,label:'Job board',fn:()=>openJobs()},

function nearZone(){for(const z of ZONES){if(Math.hypot(P.pos.x-z.x,P.pos.z-z.z)<z.r)return z;}return null;}
const REACH=6.5;let target=null;
function findTarget(){
  if(!job||job.done) return null;
  const list=job.def.t==='build'?job.avail:job.def.t==='fix'?job.issues:job.paintable;
  const ex=P.pos.x,ey=P.pos.y+1.2,ez=P.pos.z,fx=Math.sin(P.face),fz=Math.cos(P.face);
  let best=null,bs=1e9;
  for(const o of list){const dx=o.position.x-ex,dy=o.position.y-ey,dz=o.position.z-ez;const d=Math.sqrt(dx*dx+dy*dy+dz*dz);if(d>REACH)continue;
    const hd=Math.hypot(dx,dz)||1;const dot=(dx*fx+dz*fz)/hd;const sc=d-dot*2.2+Math.max(0,dy)*.15;if(sc<bs){bs=sc;best=o;}}
  return best;
}
function doAction(t){if(job.def.t==='build')buildTap(t);else if(job.def.t==='fix')fixTap(t);else paintTap(t);}
function act(){
  if(layer.innerHTML) return;hideHint();
  if(target){doAction(target);return;}
  const z=nearZone();if(z){z.fn();return;}
  if(job&&!job.done) toast(job.def.t==='build'?'Walk up to a bright blue block, then press E.':job.def.t==='fix'?'Walk up to a red broken part, then press E.':'Walk up to a wall, then press E.');
}
function jump(){if(P.ground&&!layer.innerHTML){P.vy=10.5;P.ground=false;}}
const MOVE_KEYS=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','shift','e'];
addEventListener('keydown',e=>{
  if(layer.innerHTML){if(e.key==='Escape')closeSheet();return;}
  if(e.target&&e.target.closest&&e.target.closest('button')&&(e.key==='Enter'))return;
  const k=e.key.toLowerCase();
  if(MOVE_KEYS.includes(k)) e.preventDefault();

  if(k===' '&&!keys[' ']) jump();
  if(job&&!job.done&&job.def.t==='paint'&&/^[1-6]$/.test(k)){job.brush=PAINTS[+k-1].c;renderHud();snd('paint');}
  keys[k]=true;
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;touchE=false;});
{
  const jz=$('#joy'),kn=$('#knob');let jid=null,cx=0,cy=0;

}
const hl=new T.LineSegments(new T.EdgesGeometry(new T.BoxGeometry(1.08,1.08,1.08)),new T.LineBasicMaterial({color:0xffd21f}));hl.visible=false;scene.add(hl);
const promptEl=$('#prompt'),promptTxt=$('#promptTxt');let promptLast='';
function setPrompt(s){if(s===promptLast)return;promptLast=s;if(s){promptTxt.textContent=s;promptEl.hidden=false;}else promptEl.hidden=true;}
const vF=new T.Vector3(),vR=new T.Vector3(),vM=new T.Vector3();
function stepPlayer(dt,now){
  const blocked=!!layer.innerHTML;
  let f=0,s=0;
  if(!blocked){f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y;s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;}
  vF.set(-Math.sin(theta),0,-Math.cos(theta));vR.set(Math.cos(theta),0,-Math.sin(theta));
  vM.set(0,0,0).addScaledVector(vF,f).addScaledVector(vR,s);
  let m=vM.length();if(m>1){vM.multiplyScalar(1/m);m=1;}
  const speed=(keys.shift?11:6.5)*m;
  if(m>.05){P.face=Math.atan2(vM.x,vM.z);
    const dx=vM.x/m*speed*dt,dz=vM.z/m*speed*dt;
    if(!hits(P.pos.x+dx,P.pos.y,P.pos.z))P.pos.x+=dx;
    if(!hits(P.pos.x,P.pos.y,P.pos.z+dz))P.pos.z+=dz;
    P.pos.x=Math.max(-120,Math.min(120,P.pos.x));P.pos.z=Math.max(-120,Math.min(120,P.pos.z));}
  P.vy-=30*dt;const ny=P.pos.y+P.vy*dt;
  if(P.vy<=0){
    if(ny<=0){P.pos.y=0;P.vy=0;P.ground=true;}
    else if(hits(P.pos.x,ny,P.pos.z)){P.pos.y=Math.floor(ny)+1;P.vy=0;P.ground=true;}
    else{P.pos.y=ny;P.ground=false;}
  }else{if(hits(P.pos.x,ny,P.pos.z)){P.vy=0;}else P.pos.y=ny;P.ground=false;}
  worker.position.copy(P.pos);
  let dr=P.face-worker.rotation.y;while(dr>Math.PI)dr-=Math.PI*2;while(dr<-Math.PI)dr+=Math.PI*2;worker.rotation.y+=dr*Math.min(1,dt*14);
  const walking=m>.05&&P.ground;const sw=walking?Math.sin(now/(keys.shift?55:80))*.7:0;
  worker.userData.legL.rotation.x=sw;worker.userData.legR.rotation.x=-sw;
  // target + prompt
  target=blocked?null:findTarget();
  if(target){hl.visible=true;hl.position.copy(target.position);const sc=target.userData.kind==='leak'?.7:1;hl.scale.setScalar(sc);}else hl.visible=false;
  const z=blocked?null:nearZone();
  setPrompt(blocked?'':target?(job.def.t==='build'?'Build':job.def.t==='fix'?'Fix':'Paint'):z?z.label:'');
  if((keys.e||touchE)&&!blocked){eCd-=dt;if(eCd<=0){if(target)doAction(target);eCd=.13;}}
}

/* =================== LOOP =================== */
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
if(cam.aspect<1){dist=distGoal=20;}
let last=performance.now();
function loop(now){
  const raw=Math.min(.25,(now-last)/1000),dt=Math.min(.05,raw);last=now;
  {let rem=raw;while(rem>1e-4){const h=Math.min(.04,rem);stepPlayer(h,now);rem-=h;}}
  camGoal.set(P.pos.x,P.pos.y+2.2,P.pos.z);
  camT.lerp(camGoal,reduce?1:.2);dist+=(distGoal-dist)*(reduce?1:.1);
  cam.position.set(camT.x+dist*Math.sin(phi)*Math.sin(theta),camT.y+dist*Math.cos(phi),camT.z+dist*Math.sin(phi)*Math.cos(theta));cam.lookAt(camT);
  // ghosts pulse
  M.ghostOn.opacity=.3+.18*Math.sin(now/220);
  M.broken.emissiveIntensity=.35+.3*Math.sin(now/160);
  if(wSwing>0){wSwing-=dt;worker.userData.arm.rotation.x=-Math.sin((.35-wSwing)/.35*Math.PI*2)*1.4;}else worker.userData.arm.rotation.x=0;
  // anims
  for(let i=anims.length-1;i>=0;i--){const a=anims[i];a.t+=dt;const k=Math.min(1,a.t/a.d);
    if(a.water){a.water.material.opacity=.85*k;}else{const e=1-Math.pow(1-k,3);a.m.scale.setScalar(.01+.99*e);a.m.position.y=a.y+.7*(1-e);}
    if(k>=1) anims.splice(i,1);}
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.userData.life-=dt;c.userData.v.y-=12*dt;c.position.addScaledVector(c.userData.v,dt);
    if(!c.userData.puff)c.rotation.z+=dt*10;else c.material.opacity=Math.max(0,c.userData.life*1.8);
    if(c.userData.life<=0){scene.remove(c);if(c.userData.puff){c.geometry.dispose();c.material.dispose();}coins.splice(i,1);}}
  updateTip();
  R.render(scene,cam);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
