<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@500;700&family=Inter:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;background:#14122B;color:#fff;font-family:Inter,'IBM Plex Sans Arabic',sans-serif;overflow:hidden;position:relative}
.glow{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.35),transparent 65%);top:-250px;right:-300px}
.glow.b{top:auto;bottom:-350px;left:-350px;right:auto;background:radial-gradient(circle,rgba(124,108,255,.22),transparent 65%)}
.wrap{position:relative;padding:150px 90px 0}
.logo{display:flex;align-items:center;gap:26px;font-weight:700;font-size:44px}
.mark{display:grid;grid-template-columns:44px 44px;gap:10px}
.mark i{width:44px;height:44px;border-radius:9px;background:#fff}
.mark i:nth-child(2){background:#7C6CFF}.mark i:nth-child(4){background:transparent;border:5px solid #fff}
h1{font-size:112px;line-height:1.02;font-weight:800;letter-spacing:-3px;margin-top:90px}
h1 span{color:#9D90FF}
.ar-h{font-family:'IBM Plex Sans Arabic';font-weight:700;font-size:64px;direction:rtl;text-align:right;margin-top:26px;color:#C9C3FF}
.steps{margin-top:70px;display:grid;gap:34px}
.step{display:grid;grid-template-columns:120px 1fr;gap:36px;align-items:center;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.12);border-radius:40px;padding:40px 44px}
.n{width:120px;height:120px;border-radius:32px;background:#7C6CFF;display:grid;place-items:center;font-size:62px;font-weight:800}
.step b{display:block;font-size:50px;font-weight:700;line-height:1.15}
.step p{font-family:'IBM Plex Sans Arabic';font-size:42px;direction:rtl;text-align:left;color:#C9C3FF;margin-top:8px;font-weight:500}
.free{margin-top:60px;text-align:center;font-size:44px;font-weight:700}
.free small{display:block;font-family:'IBM Plex Sans Arabic';font-size:40px;color:#C9C3FF;margin-top:10px;font-weight:500}
.dm{position:absolute;left:90px;right:90px;bottom:110px;background:#fff;color:#14122B;border-radius:999px;text-align:center;padding:40px;font-size:48px;font-weight:800}
</style></head><body>
<div class="glow"></div><div class="glow b"></div>
<div class="wrap">
  <div class="logo"><div class="mark"><i></i><i></i><i></i><i></i></div>Pixel &amp; Co.</div>
  <h1>How it <span>works</span></h1>
  <div class="ar-h">كيف نشتغل؟</div>
  <div class="steps">
    <div class="step"><div class="n">1</div><div><b>Send us a DM</b><p>راسلنا على الخاص</p></div></div>
    <div class="step"><div class="n">2</div><div><b>We make you a free sample</b><p>نسوي لك نموذج مجاني بشعارك وألوانك</p></div></div>
    <div class="step"><div class="n">3</div><div><b>Like it? We build it</b><p>عجبك؟ نبني موقعك خلال أيام</p></div></div>
  </div>
  <div class="free">No pressure. No commitment.<small>بدون أي التزام ✨</small></div>
</div>
<div class="dm">📩 DM @pixelandco.design</div>
</body></html>
