<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@600;700&family=Inter:wght@600;800&display=swap">
<style>*{margin:0;box-sizing:border-box}body{background:#14122B;color:#fff;font-family:Inter,'IBM Plex Sans Arabic',sans-serif;overflow:hidden;position:relative}
.g{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.45),transparent 65%)}
.mark{display:grid;gap:var(--gap)}.mark i{width:var(--s);height:var(--s);border-radius:calc(var(--s)*.2);background:#fff}.mark i:nth-child(2){background:#7C6CFF}.mark i:nth-child(4){background:transparent;border:calc(var(--s)*.12) solid #fff}
#pfp{position:relative;overflow:hidden;width:1080px;height:1080px;display:grid;place-items:center}
#pfp .mark{--s:230px;--gap:52px;grid-template-columns:230px 230px;position:relative}
#cov{position:relative;overflow:hidden;width:1080px;height:1920px;padding:200px 90px;display:flex;flex-direction:column}
#cov .mark{--s:70px;--gap:16px;grid-template-columns:70px 70px}
#cov h1{font-size:118px;line-height:1.02;font-weight:800;letter-spacing:-3px;margin-top:120px}#cov h1 span{color:#9D90FF}
#cov .ar{font-family:'IBM Plex Sans Arabic';font-weight:700;font-size:70px;direction:rtl;margin-top:40px;color:#C9C3FF;line-height:1.4}
#cov .pill{margin-top:auto;align-self:flex-start;background:#fff;color:#14122B;border-radius:999px;padding:34px 54px;font-size:46px;font-weight:800}
#cov .h{position:absolute;right:90px;top:210px;font-weight:800;font-size:44px}
</style></head><body>
<div id="pfp"><div class="g" style="width:1000px;height:1000px;left:40px;top:40px"></div><div class="mark"><i></i><i></i><i></i><i></i></div></div>
<div id="cov"><div class="g" style="width:1100px;height:1100px;right:-450px;top:-300px"></div><div class="g" style="width:900px;height:900px;left:-400px;bottom:-300px;opacity:.6"></div>
<div class="mark" style="position:relative"><i></i><i></i><i></i><i></i></div><div class="h">Pixel &amp; Co.</div>
<h1 style="position:relative">Websites<br>for Saudi<br><span>small brands</span></h1>
<div class="ar" style="position:relative">مواقع ومتاجر لمشروعك<br>نموذج مجاني قبل أي قرار ✨</div>
<div class="pill" style="position:relative">📩 DM @pixelandco.design</div></div>
<script>document.body.style.width='1080px'</script></body></html>
