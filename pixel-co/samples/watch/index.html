<title>TORQ Watch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,600;12..96,800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=Manrope:wght@400;500;700&display=swap">
<style>
/* Layout: a fixed 3D stage (the watch, light beams, grid floor, particles) behind scrolling chapters. Each chapter is one screen tall; the watch flies to the side opposite the text and its screen changes per chapter. Real photos and specs close the page. One committed night look in every theme. */
:root{
  --night:#07080D; --night-2:#0E1019; --ink:#F1EBDD; --mist:rgba(241,235,221,.6); --line:rgba(241,235,221,.12);
  --amber:#F5A35C; --ice:#8FB8FF; --pulse:#FF5D6C; --mint:#7CE8B5;
  --display:'Bricolage Grotesque','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'Manrope','IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden}
[dir=rtl] body{font-family:'IBM Plex Sans Arabic',var(--body)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
#stage{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(7,8,13,.85) 100%)}
main,header,footer,.credit{position:relative;z-index:2}

.credit{text-align:center;font-size:12.5px;color:var(--mist);padding-block:8px;border-bottom:1px solid var(--line);background:rgba(7,8,13,.6)}
.credit b{color:var(--ink)}
header .wrap{display:flex;justify-content:space-between;align-items:center;padding-block:16px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;letter-spacing:.18em;font-size:18px}
.logo i{width:24px;height:20px;background:linear-gradient(135deg,var(--amber),#C2410C);clip-path:polygon(0 30%,50% 0,100% 30%,72% 100%,50% 62%,28% 100%)}
.lang{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 15px;font-size:14px}

.chapter{min-height:100vh;min-height:100svh;display:flex;align-items:center}
.chapter .wrap{width:100%;display:flex}
.panel{max-width:440px;min-width:0}
.right .wrap{justify-content:flex-end}
[dir=rtl] .right .wrap{justify-content:flex-start}
[dir=rtl] .left .wrap{justify-content:flex-end}
.kicker{font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--amber);font-weight:700}
[dir=rtl] .kicker{letter-spacing:0;font-size:14px}
h1,h2{font-family:var(--display);font-weight:800;text-wrap:balance;margin:0;letter-spacing:-.03em;line-height:.95}
[dir=rtl] h1,[dir=rtl] h2{font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:700;letter-spacing:0;line-height:1.2}
.chapter p{color:var(--mist);margin:16px 0 0;font-size:17.5px}
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding-block:30px 40px}
.hero h1{font-size:clamp(84px,20vw,260px);letter-spacing:-.06em;line-height:.8;font-weight:800;
  background:linear-gradient(180deg,#FFF 20%,rgba(241,235,221,.15));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hero-row p{max-width:30ch;color:var(--mist);margin:0;font-size:18px}
.scroll-hint{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mist)}
.scroll-hint i{width:1px;height:36px;background:linear-gradient(var(--amber),transparent);animation:hint 2s ease-in-out infinite}
@keyframes hint{50%{transform:scaleY(.4);transform-origin:top}}
.ch-title{font-size:clamp(46px,7vw,92px)}
.stat{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}
.stat div{border-top:1px solid var(--line);padding-top:10px;min-width:110px}
.stat b{display:block;font-family:var(--display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--mist)}

.real{padding-block:120px 60px;background:linear-gradient(180deg,transparent,var(--night) 18%)}
.real h2,.specs h2{font-size:clamp(40px,6vw,76px)}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:34px}
.gal figure{margin:0;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;min-width:0}
.gal .g1,.gal .g2{grid-column:span 2;aspect-ratio:16/11}
.gal img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.gal figure:hover img{transform:scale(1.05)}
.ai-note{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);margin-top:14px;opacity:.75}
@media (max-width:820px){.gal{grid-template-columns:1fr 1fr}.gal .g1,.gal .g2{grid-column:span 2}}
.real-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:34px}
.real figure{margin:0;border-radius:24px;overflow:hidden;border:1px solid var(--line);position:relative}
.real img{width:100%;height:100%;object-fit:cover;aspect-ratio:16/10}
.real figcaption{position:absolute;bottom:12px;inset-inline-start:12px;background:rgba(7,8,13,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:5px 12px;font-size:12.5px}
.specs{padding-block:60px 100px;background:var(--night)}
.spec-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:24px;overflow:hidden;margin-top:34px}
.spec-grid div{background:var(--night-2);padding:24px 22px;min-width:0}
.spec-grid b{display:block;font-family:var(--display);font-size:clamp(28px,4vw,44px);font-weight:600;line-height:1.05;margin-bottom:6px}
.spec-grid span{color:var(--mist);font-size:14.5px}
.cta{margin-top:40px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:15px 28px;font-weight:700;background:var(--ink);color:var(--night)}
.btn[aria-disabled=true]{cursor:default}
.cta small{color:var(--mist)}
footer{border-top:1px solid var(--line);background:var(--night)}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:26px;font-size:13.5px;color:var(--mist)}

@media (max-width:820px){
  .chapter{align-items:flex-end;padding-bottom:9vh}
  .chapter .wrap,.right .wrap,[dir=rtl] .right .wrap,[dir=rtl] .left .wrap{justify-content:flex-start}
  .panel{background:rgba(7,8,13,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:20px}
  .chapter p{font-size:15.5px}
  .stat{gap:16px}.stat b{font-size:26px}
  .real-grid,.spec-grid{grid-template-columns:1fr}
  .hero h1{font-size:clamp(80px,26vw,140px)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}html{scroll-behavior:auto}}
</style>

<canvas id="stage" aria-hidden="true"></canvas>
<div class="vignette"></div>
<div class="credit" data-t="credit"></div>
<header><div class="wrap"><div class="logo"><i></i>TORQ</div><button class="lang" id="lang" type="button">عربي</button></div></header>

<main>
  <section class="hero wrap" data-key="hero">
    <span></span>
    <div>
      <p class="kicker" data-t="heroK"></p>

  <section class="chapter left" data-key="design"><div class="wrap"><div class="panel">
    <p class="kicker" data-t="dK"></p><h2 class="ch-title" data-t="dT"></h2><p data-t="dP"></p>
    <div class="stat"><div><b>42<small style="font-size:.5em"> mm</small></b><span data-t="dS1"></span></div><div><b data-t="dS2v"></b><span data-t="dS2"></span></div></div>
  </div></div></section>

  <section class="chapter right" data-key="detail"><div class="wrap"><div class="panel">
    <p class="kicker" data-t="xK"></p><h2 class="ch-title" data-t="xT"></h2><p data-t="xP"></p>
  </div></div></section>

  <section class="chapter left" data-key="health"><div class="wrap"><div class="panel">
    <p class="kicker" style="color:var(--pulse)" data-t="hK"></p><h2 class="ch-title" data-t="hT"></h2><p data-t="hP"></p>
    <div class="stat"><div><b id="bpm">72</b><span>BPM</span></div><div><b>24/7</b><span data-t="hS"></span></div></div>
  </div></div></section>

  <section class="chapter right" data-key="move"><div class="wrap"><div class="panel">
    <p class="kicker" style="color:var(--mint)" data-t="mK"></p><h2 class="ch-title" data-t="mT"></h2><p data-t="mP"></p>
    <div class="stat"><div><b id="steps">0</b><span data-t="mS1"></span></div><div><b id="kcal">0</b><span>kcal</span></div></div>
  </div></div></section>

  <section class="chapter left" data-key="voice"><div class="wrap"><div class="panel">
    <p class="kicker" style="color:var(--ice)" data-t="vK"></p><h2 class="ch-title" data-t="vT"></h2><p data-t="vP"></p>
  </div></div></section>

  <section class="chapter right" data-key="tough"><div class="wrap"><div class="panel">
    <p class="kicker" style="color:var(--ice)" data-t="tK"></p><h2 class="ch-title" data-t="tT"></h2><p data-t="tP"></p>
  </div></div></section>

  <section class="real" data-key="real"><div class="wrap">
    <p class="kicker" data-t="rK"></p><h2 data-t="rT"></h2>
    <div class="gal">
      <figure class="g1"><img src="img/g-stone.jpg" alt="" loading="lazy"></figure>
      <figure class="g2"><img src="img/g-box.jpg" alt="" loading="lazy"></figure>
      <figure class="g3"><img src="img/g-rain.jpg" alt="" loading="lazy"></figure>
      <figure class="g4"><img src="img/g-rock.jpg" alt="" loading="lazy"></figure>
      <figure><img src="img/g-crown.jpg" alt="" loading="lazy"></figure>
      <figure><img src="img/g-sensor.jpg" alt="" loading="lazy"></figure>
      <figure><img src="img/g-buckle.jpg" alt="" loading="lazy"></figure>
      <figure><img src="img/g-edge.jpg" alt="" loading="lazy"></figure>
    </div>
    <p class="ai-note" data-t="rC1"></p>
  </div></section>

  <section class="specs" data-key="specs"><div class="wrap">
    <p class="kicker" data-t="sK"></p><h2 data-t="sT"></h2>
    <div class="spec-grid">
      <div><b>42 mm</b><span data-t="s1"></span></div>
      <div><b data-t="s2v"></b><span data-t="s2"></span></div>
      <div><b data-t="s3v"></b><span data-t="s3"></span></div>
      <div><b data-t="s4v"></b><span data-t="s4"></span></div>
      <div><b data-t="s5v"></b><span data-t="s5"></span></div>
      <div><b data-t="s6v"></b><span data-t="s6"></span></div>
    </div>
    <div class="cta"><a class="btn" aria-disabled="true" data-t="soon"></a><small data-t="note"></small></div>
  </div></section>
</main>
<footer><div class="wrap"><span>TORQ</span><span data-t="foot"></span></div></footer>

  const sh=rr(2.25,.3,.13);
  const g=new THREE.ExtrudeGeometry(sh,{steps:220,bevelEnabled:false,extrudePath:curve});
  const strap=new THREE.Mesh(g,strapMat);watch.add(strap);
}
watch.scale.setScalar(.92);

// lights
scene.add(new THREE.AmbientLight(0xffffff,.18));
const key=new THREE.DirectionalLight(0xfff1dc,.9);key.position.set(-4,6,8);scene.add(key);
const rimA=new THREE.PointLight(0xf5a35c,1.6,30);rimA.position.set(-7,1,-3);scene.add(rimA);
const rimB=new THREE.PointLight(0x8fb8ff,1.8,30);rimB.position.set(7,3,-2);scene.add(rimB);

// grid floor
const stoneTex=(()=>{const c=document.createElement('canvas');c.width=c.height=512;const g=c.getContext('2d');g.fillStyle='#17181c';g.fillRect(0,0,512,512);
  for(let i=0;i<9000;i++){const v=18+Math.random()*30|0;g.fillStyle=`rgba(${v},${v},${v+4},${Math.random()*.5})`;const r=Math.random()*3;g.fillRect(Math.random()*512,Math.random()*512,r,r)}
  for(let i=0;i<40;i++){g.strokeStyle=`rgba(80,82,90,${Math.random()*.25})`;g.lineWidth=Math.random()*1.5;g.beginPath();let x=Math.random()*512,y=Math.random()*512;g.moveTo(x,y);for(let j=0;j<6;j++){x+=(Math.random()-.5)*90;y+=(Math.random()-.5)*90;g.lineTo(x,y)}g.stroke()}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,6);t.encoding=THREE.sRGBEncoding;return t})();
const grid=new THREE.Mesh(new THREE.PlaneGeometry(80,80),new THREE.MeshStandardMaterial({map:stoneTex,roughnessMap:stoneTex,roughness:.55,metalness:.15,envMapIntensity:.6}));grid.rotation.x=-Math.PI/2;grid.position.y=-5.2;scene.add(grid);
const RN=700,rg=new THREE.BufferGeometry(),rp=new Float32Array(RN*6),rs=[];for(let i=0;i<RN;i++){const x=(Math.random()-.5)*30,y=Math.random()*20-8,z=-Math.random()*14+4;rp.set([x,y,z,x-.05,y-.6,z],i*6);rs.push(.5+Math.random())}
rg.setAttribute('position',new THREE.BufferAttribute(rp,3));const rainMat=new THREE.LineBasicMaterial({color:0xaac4ff,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending});scene.add(new THREE.LineSegments(rg,rainMat));
// light beams
const beamTex=(()=>{const c=document.createElement('canvas');c.width=64;c.height=512;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,64,0);gr.addColorStop(0,'rgba(255,255,255,0)');gr.addColorStop(.5,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,64,512);const v=g.createLinearGradient(0,0,0,512);v.addColorStop(0,'rgba(0,0,0,1)');v.addColorStop(1,'rgba(0,0,0,0)');g.globalCompositeOperation='destination-out';g.fillStyle=v;g.fillRect(0,0,64,512);return new THREE.CanvasTexture(c)})();
const beams=[];[[0xf5a35c,-5,.5],[0x8fb8ff,4.5,-.4],[0xffffff,0,.15],[0x8fb8ff,-2.5,-.2]].forEach(([c,x,r],i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(2.6,26),new THREE.MeshBasicMaterial({map:beamTex,color:c,transparent:true,opacity:.16,blending:THREE.AdditiveBlending,depthWrite:false}));m.position.set(x,6,-8-i);m.rotation.z=r;scene.add(m);beams.push(m)});
// particles
const PN=500,pg=new THREE.BufferGeometry(),pp=new Float32Array(PN*3),ps=[];for(let i=0;i<PN;i++){pp[i*3]=(Math.random()-.5)*40;pp[i*3+1]=(Math.random()-.5)*22;pp[i*3+2]=-Math.random()*20+2;ps.push(Math.random()*.4+.1)}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const dots=new THREE.Points(pg,new THREE.PointsMaterial({color:0xf1ebdd,size:.06,transparent:true,opacity:.7,depthWrite:false,blending:THREE.AdditiveBlending}));scene.add(dots);
const base=pp.slice();

/* screen faces */
function face(mode,t,k){const W=512,H=600;sx.fillStyle='#000';sx.fillRect(0,0,W,H);sx.textAlign='center';
  const d=new Date();
  if(mode==='clock'){const hh=String(d.getHours()).padStart(2,'0'),mm=String(d.getMinutes()).padStart(2,'0');
    const g=sx.createRadialGradient(256,300,10,256,300,300);g.addColorStop(0,'#1b1d2a');g.addColorStop(1,'#000');sx.fillStyle=g;sx.fillRect(0,0,W,H);
    for(let i=0;i<60;i++){const a=i/60*Math.PI*2+t*.0002;sx.strokeStyle=i%5?'rgba(241,235,221,.18)':'rgba(245,163,92,.9)';sx.lineWidth=i%5?2:4;sx.beginPath();sx.moveTo(256+Math.cos(a)*200,300+Math.sin(a)*240);sx.lineTo(256+Math.cos(a)*(i%5?186:176),300+Math.sin(a)*(i%5?224:212));sx.stroke()}
    sx.fillStyle='#F1EBDD';sx.font='800 150px "Bricolage Grotesque",sans-serif';sx.fillText(hh,256,290);sx.fillStyle='#F5A35C';sx.fillText(mm,256,420);
    sx.fillStyle='rgba(241,235,221,.6)';sx.font='600 26px Manrope,sans-serif';sx.fillText(d.toDateString().slice(0,10).toUpperCase(),256,130)}
  if(mode==='heart'){const bpm=Math.round(68+8*Math.sin(t*.0012));const el=$('bpm');if(el)el.textContent=bpm;
    sx.fillStyle='#FF5D6C';sx.font='800 140px "Bricolage Grotesque",sans-serif';sx.fillText(bpm,256,250);sx.fillStyle='rgba(241,235,221,.6)';sx.font='600 28px Manrope';sx.fillText('BPM',256,300);
    sx.strokeStyle='#FF5D6C';sx.lineWidth=6;sx.lineJoin='round';sx.shadowColor='#FF5D6C';sx.shadowBlur=18;sx.beginPath();
    for(let x=0;x<=W;x+=4){const ph=((x+t*.25)%256)/256;let y=430;if(ph>.4&&ph<.44)y-=20;else if(ph>.46&&ph<.5)y-=110*(1-Math.abs(ph-.48)/.02);else if(ph>.5&&ph<.53)y+=40;else if(ph>.62&&ph<.7)y-=22*Math.sin((ph-.62)/.08*Math.PI);x?sx.lineTo(x,y):sx.moveTo(x,y)}sx.stroke();sx.shadowBlur=0;
    const pulse=.5+.5*Math.sin(t*.008);sx.fillStyle=`rgba(255,93,108,${.3+pulse*.7})`;sx.beginPath();sx.arc(256,90,14+pulse*6,0,7);sx.fill()}
  if(mode==='rings'){const cols=['#FF5D6C','#7CE8B5','#8FB8FF'];[0,1,2].forEach(i=>{const r=200-i*52,v=clamp(k*1.1-i*.12);sx.lineCap='round';sx.lineWidth=40;sx.strokeStyle=cols[i]+'33';sx.beginPath();sx.arc(256,300,r,0,7);sx.stroke();sx.strokeStyle=cols[i];sx.shadowColor=cols[i];sx.shadowBlur=14;sx.beginPath();sx.arc(256,300,r,-Math.PI/2,-Math.PI/2+v*Math.PI*2);sx.stroke();sx.shadowBlur=0});
    const st=$('steps'),kc=$('kcal');if(st)st.textContent=Math.round(clamp(k)*8420).toLocaleString('en-US');if(kc)kc.textContent=Math.round(clamp(k)*412)}
  if(mode==='voice'){const g=sx.createRadialGradient(256,300,10,256,300,280);g.addColorStop(0,'#14203a');g.addColorStop(1,'#000');sx.fillStyle=g;sx.fillRect(0,0,W,H);
    for(let i=0;i<15;i++){const h=30+Math.abs(Math.sin(t*.006+i*.7)*Math.sin(t*.0023+i))*170;sx.fillStyle=i%2?'#8FB8FF':'#F1EBDD';const x=256+(i-7)*28;sx.beginPath();sx.roundRect?sx.roundRect(x-8,300-h/2,16,h,8):sx.rect(x-8,300-h/2,16,h);sx.fill()}
    sx.fillStyle='rgba(241,235,221,.75)';sx.font='600 30px Manrope';sx.fillText(lang==='ar'?'...أسمعك':'Listening…',256,500)}
  if(mode==='rain'){face('clock',t,k);for(const d of DROPS){const r=d.r*(1+.05*Math.sin(t*.002+d.x));const gx=sx.createRadialGradient(d.x-r*.35,d.y-r*.35,1,d.x,d.y,r);gx.addColorStop(0,'rgba(255,255,255,.75)');gx.addColorStop(.35,'rgba(170,200,255,.18)');gx.addColorStop(1,'rgba(255,255,255,.05)');sx.fillStyle=gx;sx.beginPath();sx.ellipse(d.x,d.y,r,r*1.12,0,0,7);sx.fill();sx.strokeStyle='rgba(255,255,255,.25)';sx.lineWidth=2;sx.stroke()}}
  screenTex.needsUpdate=true}
const DROPS=Array.from({length:26},()=>({x:40+Math.random()*432,y:40+Math.random()*520,r:6+Math.random()*16}));

/* choreography: keyframes per chapter */
const KF={hero:{x:2.6,y:-.2,ry:-.45,rx:.12,s:1,mode:'clock'},design:{x:3.4,y:0,ry:0,rx:.05,s:1,mode:'clock',spin:1},detail:{x:-3.4,y:-.1,ry:-1.0,rx:.12,s:1.55,mode:'clock'},health:{x:3.4,y:0,ry:-.42,rx:.04,s:1.05,mode:'heart'},
 move:{x:-3.4,y:0,ry:.4,rx:.08,s:1.05,mode:'rings'},voice:{x:3.2,y:.2,ry:-.25,rx:-.15,s:1.1,mode:'voice'},tough:{x:-3,y:-.3,ry:.35,rx:.3,s:1.1,mode:'rain'},real:{x:0,y:-1,ry:Math.PI,rx:.9,s:.6,mode:'clock'},specs:{x:0,y:-1,ry:Math.PI,rx:.9,s:.6,mode:'clock'}};
const secs=[...document.querySelectorAll('[data-key]')].filter(s=>!s.hidden);
let W=0,H=0,mobile=false;
function size(){W=innerWidth;H=innerHeight;mobile=W<820;R.setSize(W,H,false);cam.aspect=W/H;cam.fov=mobile?44:32;cam.updateProjectionMatrix()}
size();addEventListener('resize',size);
function state(){const mid=H*.5;let i=0;for(let j=0;j<secs.length;j++){if(secs[j].getBoundingClientRect().top<=mid)i=j}
  const a=secs[i],b=secs[Math.min(i+1,secs.length-1)];const ra=a.getBoundingClientRect();const local=clamp((mid-ra.top)/Math.max(1,ra.height));
  const blend=ease(clamp((local-.6)/.4));return{a:KF[a.dataset.key],b:KF[b.dataset.key],blend,local,key:a.dataset.key}}
const rtl=()=>document.documentElement.dir==='rtl';
function frame(){const t=now(),s=state(),A=s.a,B=s.b,k=s.blend,f=rtl()?-1:1;
  let x=mix(A.x,B.x,k)*f,y=mix(A.y,B.y,k),ry=mix(A.ry,B.ry,k),rx=mix(A.rx,B.rx,k),sc=mix(A.s,B.s,k);
  if(mobile){x*=.0;y=y+1.6;sc*=.86}
  if(s.key==='design')ry+=s.local*Math.PI*2*(1-k);       // full 360 while you read "Design"
  ry+=Math.sin(t*.0006)*.12;y+=Math.sin(t*.0011)*.12;
  watch.position.set(x,y,0);watch.rotation.set(rx,ry,Math.sin(t*.0008)*.03);watch.scale.setScalar(.92*sc);
  const mode=k>.5?B.mode:A.mode;face(mode,t,s.key==='move'?s.local*1.4:1);
  beams.forEach((b,i)=>{b.rotation.z+=Math.sin(t*.0003+i)*.0006;b.material.opacity=.11+.06*Math.sin(t*.0009+i*2)});
  const pa=pg.attributes.position.array;for(let i=0;i<PN;i++){pa[i*3+1]=((base[i*3+1]+t*.0004*ps[i]*4+11)%22)-11}pg.attributes.position.needsUpdate=true;
  const rainAmt=s.key==='tough'?1-k*(B.mode!=='rain'?1:0):(B.mode==='rain'?k:0);rainMat.opacity=rainAmt*.55;
  if(rainAmt>0){const a=rg.attributes.position.array;for(let i=0;i<RN;i++){let y=a[i*6+1]-.32*rs[i];if(y<-5.2)y+=20;a[i*6+1]=y;a[i*6+4]=y-.6}rg.attributes.position.needsUpdate=true}
  cam.position.x=Math.sin(t*.0002)*.4;cam.lookAt(0,0,0);
  rimA.position.x=-7+Math.sin(t*.0007)*2;rimB.position.y=3+Math.cos(t*.0006)*2;
  R.render(scene,cam)}
window.__render=frame;
(function loop(){frame();if(!window.__frozen)requestAnimationFrame(loop)})();
</script>
