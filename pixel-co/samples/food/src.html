<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MUNCH | Burgers, Donuts &amp; Cookies</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: fixed 3D food stage behind four scroll chapters (hero, burger, donuts, cookies), then shop, donut box builder, reviews and cart. Sample brand by Pixel & Co. */
:root{
  --bg:#140A0A; --night:#140A0A; --night2:#1F1111; --hot:#FF5A36; --sun:#FFC83D; --mint:#7ED957; --pink:#FF8FB8; --cream:#FFF6EC; --muted:#C9A99A; --line:rgba(255,200,61,.16);
  --display:'Anton',Impact,sans-serif; --body:'Readex Pro',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
button{font-family:var(--body)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.sample{position:relative;z-index:21;background:var(--sun);color:var(--night);text-align:center;font-size:13px;font-weight:500;padding:7px 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;background:rgba(20,10,10,.55);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-size:30px;letter-spacing:.06em;text-decoration:none;white-space:nowrap;line-height:1}
.logo b{color:var(--hot);font-weight:400}
nav{display:flex;gap:22px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
nav a{text-decoration:none;color:var(--muted)}
.hright{display:flex;align-items:center;gap:8px}
.switch{display:flex;background:rgba(255,246,236,.08);border-radius:999px;padding:4px}
.switch button{border:0;background:transparent;color:var(--cream);font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed=true]{background:var(--cream);color:var(--night)}
.cartbtn{position:relative;border:0;background:var(--hot);color:var(--cream);border-radius:999px;width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
.cartbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--sun);color:var(--night);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;transition:transform .3s}
.badge.pop{transform:scale(1.35)}
#stage3d{position:fixed;inset:0;z-index:0;pointer-events:none}
#stage3d canvas{display:block;width:100%;height:100%}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(80% 70% at 50% 50%,transparent 40%,rgba(0,0,0,.45))}
main,footer{position:relative;z-index:2}
.chap{min-height:100svh;display:flex;align-items:center;padding:90px max(20px,6vw) 60px}
.chap .copy{max-width:540px}
.chap.right{justify-content:flex-end}
.big{font-family:var(--display);font-weight:400;font-size:clamp(64px,11vw,150px);line-height:.88;margin:12px 0 0;text-transform:uppercase;letter-spacing:.01em}
.big em{font-style:normal;color:var(--hot)}
.big i{font-style:normal;color:var(--sun)}
.eyebrow{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--sun);font-weight:500}
.num{font-size:14px;color:var(--sun);letter-spacing:.25em;font-weight:600}
.lead{color:var(--muted);font-size:18px;margin:16px 0 0;max-width:38ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:15px 26px;font-weight:600;font-size:16px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}
.btn.main{background:var(--hot);color:var(--cream)}
.btn.ghost{background:rgba(20,10,10,.25);color:var(--cream);border:1px solid rgba(255,246,236,.3)}
.facts{display:flex;gap:26px;margin-top:22px}
.facts div b{display:block;font-family:var(--display);font-weight:400;font-size:46px;line-height:1;color:var(--cream)}
.facts div span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.pricebar{display:flex;align-items:center;gap:16px;margin-top:24px}
.pricebar .p{font-size:28px;font-weight:700}
.scrollhint{position:absolute;left:50%;bottom:26px;translate:-50% 0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:hint 2s ease-in-out infinite}
@keyframes hint{50%{translate:-50% 8px}}
.reveal{opacity:.001;translate:0 40px;transition:opacity .8s,translate .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;translate:0 0}
.marquee{overflow:hidden;background:var(--hot);color:var(--cream);font-family:var(--display);font-size:26px;white-space:nowrap;padding:12px 0;letter-spacing:.04em}
.marquee div{display:inline-block;animation:slide 26s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.solid{background:var(--night)}
section.s{padding:84px 20px;max-width:1100px;margin:0 auto}
.k{font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--sun);margin:0;font-weight:500}
h2{font-family:var(--display);font-weight:400;font-size:clamp(46px,7vw,80px);line-height:.95;margin:10px 0 0;text-transform:uppercase}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--cream);border-radius:999px;padding:9px 16px;font-size:14px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--cream);color:var(--night);border-color:var(--cream)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:26px}
.card{background:linear-gradient(180deg,#2a1515,var(--night2));border:1px solid var(--line);border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px) rotate(-.5deg);box-shadow:0 30px 50px -25px rgba(0,0,0,.8)}
.pic{height:200px;border-radius:20px;position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card:hover .pic img{transform:scale(1.07)}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--cream);color:var(--night);font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;z-index:1}
.card h3{margin:4px 0 0;font-family:var(--display);font-weight:400;font-size:30px;line-height:1;text-transform:uppercase}
.card p{margin:0;color:var(--muted);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px}
.price{font-weight:700;font-size:21px;font-variant-numeric:tabular-nums}
.add{border:0;background:var(--cream);color:var(--night);font-weight:600;font-size:14px;border-radius:999px;padding:11px 18px;cursor:pointer}
.add.done{background:var(--mint)}
.builder{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;background:linear-gradient(120deg,#5a1a12,#2a1010);border:1px solid var(--line);border-radius:34px;padding:38px}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#ffe9cf;border-radius:24px;padding:18px;box-shadow:0 30px 50px -20px rgba(0,0,0,.6)}
.slot{aspect-ratio:1;border-radius:16px;background:#f5d6ad;overflow:hidden}
.slot img{width:100%;height:100%;object-fit:cover;animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{scale:.3;opacity:0}}
.flavors{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.flavors button{border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--cream);border-radius:999px;padding:10px 14px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.flavors i{width:14px;height:14px;border-radius:50%}
.bnote{color:var(--muted);font-size:15px;margin:14px 0 0}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.rev{background:var(--night2);border:1px solid var(--line);border-radius:24px;padding:22px}
.rev .st{color:var(--sun);letter-spacing:.15em}
.rev p{margin:10px 0 14px}
.rev b{font-weight:500;color:var(--muted);font-size:14px}
footer{text-align:center;padding:50px 20px calc(60px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--muted);font-size:14px;background:var(--night)}
footer .logo{display:block;margin-bottom:8px;color:var(--cream)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:var(--night2);z-index:31;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));border-inline-start:1px solid var(--line)}
[dir=rtl] .drawer{transform:translateX(-105%)}
.open .scrim{opacity:1;pointer-events:auto}.open .drawer{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center}
.dhead h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px;text-transform:uppercase}
.x{border:0;background:rgba(255,246,236,.1);color:var(--cream);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.items{flex:1;overflow:auto;margin:16px 0;display:flex;flex-direction:column;gap:12px}
.it{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.2);border-radius:16px;padding:10px}
.it img{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none}
.it .nm{flex:1;min-width:0;font-size:15px}
.it .nm small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--cream);cursor:pointer}
.empty{color:var(--muted);text-align:center;margin-top:40px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:1px solid var(--line);padding-top:14px;margin-bottom:12px}
.wa{display:flex;justify-content:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;border-radius:999px;padding:15px;font-weight:600}
.dnote{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 20px;background:var(--cream);color:var(--night);font-weight:600;font-size:14px;border-radius:999px;padding:12px 20px;opacity:0;transition:opacity .25s,translate .25s;z-index:40;pointer-events:none}
.toast.show{opacity:1;translate:-50% 0}
[dir=rtl] .big,[dir=rtl] h2,[dir=rtl] .card h3,[dir=rtl] .dhead h3,[dir=rtl] .facts b{font-family:var(--body);font-weight:700;line-height:1.1;letter-spacing:0}
[dir=rtl] .big{font-size:clamp(46px,8vw,104px)}
@media (max-width:820px){
  nav{display:none}
  .chap,.chap.right{align-items:flex-end;justify-content:center;text-align:center;padding-bottom:70px}
  .chap .copy{background:linear-gradient(transparent,rgba(20,10,10,.85) 30%);padding:60px 4px 0;margin:0 auto}
  .lead{margin-inline:auto}.cta,.facts,.pricebar{justify-content:center}
  .builder{grid-template-columns:1fr;padding:24px}
  .reviews{grid-template-columns:1fr}
}
@media (max-width:500px){header{padding:12px 14px}.logo{font-size:24px}.switch button{padding:6px 10px}.big{font-size:clamp(58px,17vw,84px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;translate:0 0}}
</style>
</head>
<body>
<div class="sample" data-i="sample"></div>
<header>
  <a class="logo" href="#top">MUNCH<b>.</b></a>
  <nav><a href="#burger" data-i="n1"></a><a href="#donuts" data-i="n2"></a><a href="#cookies" data-i="n3"></a><a href="#shop" data-i="n4"></a></nav>

    <div class="switch" role="group" aria-label="Language"><button type="button" data-lang="ar" aria-pressed="false">عربي</button><button type="button" data-lang="en" aria-pressed="true">EN</button></div>
    <button class="cartbtn" type="button" id="openCart" aria-label="Cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1.2 12.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="badge" id="badge">0</span></button>

</header>
<div id="stage3d" aria-hidden="true"></div>
<div class="vig"></div>
<main>
  <div class="chap" id="top" data-stage="0">
    <div class="copy">
      <div class="eyebrow reveal" data-i="eyebrow"></div>
      <h1 class="big reveal" data-i="h1"></h1>
      <p class="lead reveal" data-i="lead"></p>
      <div class="cta reveal"><a class="btn main" href="#shop" data-i="shop"></a><a class="btn ghost" href="#box" data-i="boxbtn"></a></div>
    </div>
    <div class="scrollhint" data-i="scroll"></div>
  </div>
  <div class="chap right" id="burger" data-stage="1">
    <div class="copy">

    </div>
  </div>
  <div class="chap" id="donuts" data-stage="2">
    <div class="copy">
      <div class="num reveal">02 — <span data-i="c2k"></span></div>
      <h2 class="big reveal" data-i="c2h"></h2>
      <p class="lead reveal" data-i="c2p"></p>
      <div class="facts reveal"><div><b>4</b><span data-i="flav"></span></div><div><b>6AM</b><span data-i="baked"></span></div></div>
      <div class="pricebar reveal"><span class="p">12 <span data-i="sar"></span></span><button class="btn main" type="button" data-add="donut" data-i="addc"></button></div>
    </div>
  </div>
  <div class="chap right" id="cookies" data-stage="3">
    <div class="copy">
      <div class="num reveal">03 — <span data-i="c3k"></span></div>
      <h2 class="big reveal" data-i="c3h"></h2>
      <p class="lead reveal" data-i="c3p"></p>
      <div class="facts reveal"><div><b>120g</b><span data-i="each"></span></div><div><b>3</b><span data-i="choc"></span></div></div>
      <div class="pricebar reveal"><span class="p">15 <span data-i="sar"></span></span><button class="btn main" type="button" data-add="cookie" data-i="addc"></button></div>
    </div>
  </div>
  <div class="solid" data-stage="4">
    <div class="marquee" aria-hidden="true"><div id="mq"></div></div>
    <section class="s" id="shop">
      <p class="k" data-i="k1"></p>
      <h2 data-i="h2a"></h2>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </section>
    <section class="s" id="box">
      <div class="builder">
        <div>
          <p class="k" data-i="k2"></p>
          <h2 data-i="h2b"></h2>
          <p class="bnote" data-i="bnote"></p>
          <div class="flavors" id="flavors"></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn main" type="button" id="addBox"></button><button class="btn ghost" type="button" id="clearBox" data-i="clear"></button></div>
        </div>
        <div class="tray" id="tray"></div>
      </div>
    </section>
    <section class="s">
      <p class="k" data-i="k3"></p>
      <h2 data-i="h2c"></h2>
      <div class="reviews">
        <div class="rev"><div class="st">★★★★★</div><p data-i="r1"></p><b data-i="rn"></b></div>
        <div class="rev"><div class="st">★★★★★</div><p data-i="r2"></p><b data-i="rn"></b></div>
        <div class="rev"><div class="st">★★★★★</div><p data-i="r3"></p><b data-i="rn"></b></div>
      </div>
    </section>
  </div>
</main>
<footer><span class="logo">MUNCH<b>.</b></span><span data-i="foot"></span></footer>
<div class="scrim" id="scrim"></div>
<aside class="drawer" aria-label="Cart">
  <div class="dhead"><h3 data-i="cart"></h3><button class="x" type="button" id="closeCart" aria-label="Close">×</button></div>
  <div class="items" id="items"></div>
  <div class="total"><span data-i="total"></span><span id="sum">0</span></div>
  <a class="wa" href="#top" id="checkout" data-i="checkout"></a>
  <div class="dnote" data-i="dnote"></div>
</aside>
<div class="toast" id="toast"></div>
