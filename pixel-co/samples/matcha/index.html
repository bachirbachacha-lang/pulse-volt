<title>Bear be matcha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first ordering app. Sticky header, hero with the bear, sticky category tabs, menu cards that open a customise sheet, then a pickup + WhatsApp checkout. On wide screens the checkout sits in a sticky column beside the menu. One committed brand look: matcha green on oat paper. */
:root{
  --oat:#F3EBDD; --paper:#FBF7EF; --matcha:#4F7A3A; --matcha-deep:#2C4A22; --matcha-soft:#DFE8CD;
  --bear:#7A4E2D; --bear-soft:#B9835A; --ink:#2B2A22; --muted:#6B6757; --line:#E4D9C5; --berry:#E58A9A;
  --wa:#1FA855; --wa-bubble:#DCF8C6; --wa-bg:#ECE5DD;
  --display:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  --r:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{margin:0;background:var(--oat);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(rgba(122,78,45,.05) 1px,transparent 1.2px),radial-gradient(rgba(79,122,58,.05) 1px,transparent 1.2px);
  background-size:22px 22px,31px 31px;background-position:0 0,11px 7px}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--matcha);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance}

.sample{background:var(--matcha-deep);color:var(--matcha-soft);font-size:12.5px;text-align:center;padding-block:7px}
.sample .wrap{padding-block:0}

/* header */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(243,235,221,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.head.scrolled{border-bottom-color:var(--line)}
.head .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:21px;color:var(--matcha-deep);text-decoration:none}
.brand svg{width:38px;height:38px;flex:none}
.head-actions{display:flex;align-items:center;gap:8px}
.lang{border:1.5px solid var(--matcha-deep);background:transparent;border-radius:999px;padding:4px 14px;font-weight:600;font-size:14px;color:var(--matcha-deep)}
.cart-btn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--matcha-deep);color:var(--paper);text-decoration:none}
.cart-btn svg{width:20px;height:20px}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--berry);color:var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge[hidden]{display:none}
.bump{animation:bump .45s ease}
@keyframes bump{30%{transform:scale(1.35)}60%{transform:scale(.9)}}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:8px;padding-block:22px 30px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,8.4vw,60px);line-height:1.12;margin:0 0 12px;color:var(--matcha-deep)}
.hero h1 em{font-style:normal;color:var(--matcha);background:linear-gradient(transparent 62%,var(--matcha-soft) 62% 92%,transparent 92%)}
.hero p{margin:0 0 20px;color:var(--muted);max-width:36ch;font-size:17px}
.hero-ctas{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta{display:inline-flex;align-items:center;gap:8px;background:var(--matcha);color:var(--paper);border:0;border-radius:14px;padding:13px 24px;font-weight:600;text-decoration:none;box-shadow:0 6px 0 var(--matcha-deep);transition:transform .12s, box-shadow .12s}
.cta:active{transform:translateY(4px);box-shadow:0 2px 0 var(--matcha-deep)}
.ready{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--matcha-deep);font-weight:500}
.ready i{width:9px;height:9px;border-radius:50%;background:var(--wa);box-shadow:0 0 0 0 rgba(31,168,85,.5);animation:ping 2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(31,168,85,0)}100%{box-shadow:0 0 0 0 rgba(31,168,85,0)}}
.hero-art{position:relative;justify-self:center;width:min(100%,300px)}
.hero-art .halo{position:absolute;inset:8% 4% 10%;border-radius:50%;background:var(--matcha-soft)}
.hero-art svg.bear{position:relative;width:100%;height:auto;display:block}
.leaf{position:absolute;width:22px;height:22px;opacity:.9;animation:float 6s ease-in-out infinite}
.leaf.l1{top:6%;inset-inline-start:2%}
.leaf.l2{top:46%;inset-inline-end:-2%;animation-delay:-2s;width:16px;height:16px}
.leaf.l3{bottom:18%;inset-inline-start:-4%;animation-delay:-4s;width:18px;height:18px}
@keyframes float{50%{transform:translateY(-10px) rotate(18deg)}}
.bear .eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bear .held{animation:sip 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
@keyframes sip{50%{transform:translateY(-4px) rotate(-3deg)}}

.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-bottom:28px}
.how div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.how b{font-family:var(--display);font-size:22px;line-height:1;color:var(--matcha)}
.how span{font-size:13.5px;font-weight:500;line-height:1.4}

/* layout */
.shop{display:grid;grid-template-columns:1fr;gap:24px;align-items:start}
@media (min-width:920px){.shop{grid-template-columns:minmax(0,1fr) 380px}.checkout{position:sticky;top:76px}}

/* menu */
h2{font-family:var(--display);font-weight:800;font-size:28px;margin:0;color:var(--matcha-deep);line-height:1.2}
.menu-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted)}
.tabs{position:sticky;top:61px;z-index:10;display:flex;gap:8px;overflow-x:auto;padding-block:12px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none;background:linear-gradient(var(--oat) 80%,transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 18px;font-weight:600;font-size:14px;transition:background .15s,color .15s}
.tab[aria-pressed="true"]{background:var(--matcha-deep);border-color:var(--matcha-deep);color:var(--paper)}
.cat-title{font-family:var(--display);font-weight:700;font-size:19px;color:var(--bear);margin:14px 0 8px}
.items{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.items{grid-template-columns:1fr 1fr}}
.item{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:start;width:100%;transition:transform .15s,box-shadow .15s}
.item:hover{transform:translateY(-2px);box-shadow:0 8px 20px -12px rgba(44,74,34,.35)}
.item .art{width:72px;height:88px;display:grid;place-items:center;background:var(--oat);border-radius:14px}
.item .art svg{width:56px;height:74px}
.item h3{margin:0;font-size:16px;font-weight:600;line-height:1.35}
.item .desc{margin:2px 0 4px;font-size:13px;color:var(--muted);line-height:1.45}
.item .price{font-weight:600;color:var(--matcha-deep);font-size:14px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;font-weight:600;background:var(--berry);color:var(--ink);border-radius:999px;padding:1px 8px;margin-inline-start:6px;vertical-align:2px}
.plus{width:38px;height:38px;border-radius:50%;background:var(--matcha);color:var(--paper);display:grid;place-items:center;font-size:22px;line-height:1;position:relative}
.plus .n{position:absolute;top:-6px;inset-inline-end:-6px;min-width:20px;height:20px;border-radius:999px;background:var(--matcha-deep);color:var(--paper);font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--paper)}

/* checkout */
.checkout{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;scroll-margin-top:80px}
.checkout h2{font-size:24px;margin-bottom:12px}
.lines{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:10px}
.line{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.line svg{width:34px;height:44px}
.line .nm{font-weight:600;font-size:14.5px;line-height:1.35}
.line .op{font-size:12.5px;color:var(--muted);line-height:1.4}
.line .pr{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;text-align:end}
.mini{display:flex;align-items:center;gap:4px;margin-top:4px}
.mini button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--oat);font-size:15px;line-height:1;display:grid;place-items:center}
.mini output{min-width:18px;text-align:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px 0}
.empty svg{width:60px;display:block;margin:0 auto 6px;opacity:.8}
.total{display:flex;justify-content:space-between;border-top:1.5px dashed var(--line);padding-top:12px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.lbl{display:block;font-weight:600;font-size:14px;margin:18px 0 8px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.time{border:1.5px solid var(--line);background:var(--oat);border-radius:12px;padding:8px 4px;font-size:13.5px;text-align:center;line-height:1.3;font-weight:600}
.time small{display:block;color:var(--muted);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums}
.time[aria-pressed="true"]{border-color:var(--matcha);background:var(--matcha-soft);color:var(--matcha-deep)}
input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--oat);border-radius:12px;padding:11px 12px;font:inherit;color:var(--ink)}
input[type=text][aria-invalid="true"]{border-color:#C0563F}
.err{color:#A8432F;font-size:13px;margin:6px 0 0}
.send{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:18px;background:var(--wa);color:#fff;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:16px;text-decoration:none}
.send svg{width:22px;height:22px}
.send:disabled{opacity:.45;cursor:not-allowed}

/* what the shop sees */
.shop-sees{margin-top:20px;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.shop-sees .bar{display:flex;align-items:center;gap:10px;background:#075E54;color:#fff;padding:9px 12px;font-size:14px;font-weight:600}
.shop-sees .bar svg{width:30px;height:30px;border-radius:50%;background:var(--matcha-soft)}
.shop-sees .bar small{display:block;font-weight:400;font-size:11.5px;opacity:.85}
.chat{background:var(--wa-bg);padding:14px 12px}
.bubble{background:var(--wa-bubble);color:#1d2a1d;border-radius:12px;padding:9px 12px 6px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;max-width:92%;margin-inline-start:auto;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.bubble .meta{display:block;text-align:end;font-size:11px;color:#667;margin-top:2px}
.caption{font-size:12.5px;color:var(--muted);margin:8px 2px 0}

/* sticky cart bar (phones) */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(120%);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}
.cartbar.show{transform:none}
.cartbar .wrap{padding-block:10px}
.cartbar a{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--matcha-deep);color:var(--paper);border-radius:16px;padding:13px 18px;text-decoration:none;font-weight:600;box-shadow:0 10px 30px -10px rgba(44,74,34,.6)}
.cartbar .ct{display:flex;align-items:center;gap:10px}
.cartbar .ct b{background:var(--paper);color:var(--matcha-deep);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
@media (min-width:920px){.cartbar{display:none}}

/* customise sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(43,42,34,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:41;left:0;right:0;bottom:0;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:contain}
.sheet.open{transform:none}
@media (min-width:700px){.sheet{left:50%;right:auto;width:560px;bottom:auto;top:50%;border-radius:26px;transform:translate(-50%,-40%) scale(.96);opacity:0;pointer-events:none;transition:transform .3s,opacity .25s}.sheet.open{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}}
.sheet-in{padding:10px max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 6px}
.x{position:absolute;top:12px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--oat);font-size:20px;display:grid;place-items:center}
.sheet-top{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center;margin-top:6px}
.stage{height:150px;border-radius:20px;background:var(--matcha-soft);display:grid;place-items:center}
.stage svg{width:92px;height:122px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:24px;margin:0;line-height:1.2;color:var(--matcha-deep)}
.sheet .desc{color:var(--muted);font-size:14px;margin:4px 0 0}
.opt{margin-top:16px}
.opt-label{font-weight:600;font-size:14px;margin-bottom:8px;display:flex;justify-content:space-between}
.opt-label small{font-weight:400;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--oat);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:500;line-height:1.3}
.chip small{color:var(--muted);font-size:12px;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--matcha);background:var(--matcha-soft);color:var(--matcha-deep);font-weight:600}
.sheet-foot{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;background:var(--paper);padding-top:14px;margin-top:18px;border-top:1px solid var(--line)}
.stepper{display:flex;align-items:center;gap:6px;background:var(--oat);border-radius:14px;padding:4px}
.stepper button{width:38px;height:38px;border-radius:11px;border:0;background:var(--paper);font-size:20px;line-height:1}
.stepper output{min-width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.add-btn{flex:1;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:14px;background:var(--matcha);color:var(--paper);padding:13px 18px;font-weight:600;font-size:16px}
.add-btn span:last-child{font-variant-numeric:tabular-nums}

/* pour animation inside the sheet */
.pour .fill{transform-box:fill-box;transform-origin:center bottom;animation:pour .8s cubic-bezier(.3,.8,.3,1) both}
.pour .fill:nth-child(2){animation-delay:.12s}
.pour .fill:nth-child(3){animation-delay:.24s}
.pour .fill:nth-child(4){animation-delay:.36s}
@keyframes pour{from{transform:scaleY(0)}}
.steam path{animation:steam 2.4s ease-in-out infinite;opacity:0}
.steam path:nth-child(2){animation-delay:.8s}
.steam path:nth-child(3){animation-delay:1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-10px)}}

/* done screen */
.done{text-align:center;padding:10px 4px 6px}
.done svg{width:120px}
.done h3{font-family:var(--display);font-size:26px;color:var(--matcha-deep);margin:6px 0}
.done p{color:var(--muted);margin:0 0 6px}
.done .num{display:inline-block;font-family:var(--display);font-weight:800;font-size:20px;background:var(--matcha-soft);color:var(--matcha-deep);border-radius:12px;padding:4px 14px;margin:8px 0;font-variant-numeric:tabular-nums}
.ghost{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 16px;font-weight:600;margin-top:10px}

/* visit */
.visit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding-block:40px 30px}
.visit div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.visit b{display:block;font-family:var(--display);font-size:18px;color:var(--matcha-deep)}
.visit span{font-size:14px;color:var(--muted)}
.visit a{color:var(--matcha-deep);font-weight:600}
footer{text-align:center;font-size:13px;color:var(--muted);padding-block:0 110px}
@media (min-width:920px){footer{padding-bottom:30px}}

.toast{position:fixed;z-index:50;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-20px);background:var(--ink);color:var(--paper);border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:420px){
  .hero{grid-template-columns:1fr 128px;gap:4px}
  .hero p{font-size:15.5px}
  .times{grid-template-columns:1fr 1fr}
  .sheet-top{grid-template-columns:100px minmax(0,1fr)}
  .stage{height:130px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

<div class="sample"><div class="wrap" data-t="sample"></div></div>

<header class="head" id="head">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Bear be matcha">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#DFE8CD"/><circle cx="11" cy="12" r="5" fill="#7A4E2D"/><circle cx="29" cy="12" r="5" fill="#7A4E2D"/><circle cx="20" cy="22" r="12" fill="#7A4E2D"/><ellipse cx="20" cy="26" rx="5.5" ry="4.2" fill="#F3EBDD"/><circle cx="15.5" cy="20" r="1.6" fill="#2B2A22"/><circle cx="24.5" cy="20" r="1.6" fill="#2B2A22"/><ellipse cx="20" cy="24.6" rx="2" ry="1.4" fill="#2B2A22"/></svg>
      <span>Bear be matcha</span>
    </a>
    <div class="head-actions">
      <button class="lang" id="lang" type="button">EN</button>
      <a class="cart-btn" href="#checkout" id="cartBtn" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1.2 11.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        <span class="badge" id="badge" hidden>0</span>
      </a>
    </div>
  </div>
</header>

<main id="top">
  <section class="wrap hero">
    <div>
      <h1 id="heroTitle"></h1>
      <p data-t="heroSub"></p>
      <div class="hero-ctas">
        <a class="cta" href="#menu" data-t="orderNow"></a>
        <span class="ready"><i></i><span data-t="readyIn"></span></span>
      </div>
    </div>
    <div class="hero-art" aria-hidden="true">
      <div class="halo"></div>
      <svg class="leaf l1" viewBox="0 0 24 24"><path d="M4 20C4 9 11 4 21 3c-1 10-6 17-17 17z" fill="#6E9A4F"/><path d="M5 19 16 8" stroke="#2C4A22" stroke-width="1.4"/></svg>
      <svg class="leaf l2" viewBox="0 0 24 24"><path d="M4 20C4 9 11 4 21 3c-1 10-6 17-17 17z" fill="#8DB36A"/></svg>
      <svg class="leaf l3" viewBox="0 0 24 24"><path d="M4 20C4 9 11 4 21 3c-1 10-6 17-17 17z" fill="#4F7A3A"/></svg>
      <svg class="bear" viewBox="0 0 200 220">

function art(it,o,{pour=false,big=false}={}){

    return `<svg viewBox="0 0 100 130" aria-hidden="true"><g transform="translate(${50-50*sc} ${130-130*sc}) scale(${sc})">

  }

function orderNo(){return 'BB-'+String(1000+((Date.now()/60000|0)%9000))}

    return;
  }
  const lines=cart.length?cart.map((l,i)=>{const it=byId[l.id],ot=optText(it,l.o);return `<li class="line">${art(it,l.o)}<div style="min-width:0"><div class="nm">${L(it)}</div>${ot?`<div class="op">${esc(ot)}</div>`:''}
      <div class="mini"><button type="button" data-line="${i}" data-d="-1" aria-label="−">−</button><output>${l.q}</output><button type="button" data-line="${i}" data-d="1" aria-label="+">+</button></div></div>
      <div class="pr">${sar(unit(it,l.o)*l.q)}</div></li>`}).join('')
    :`<li class="empty"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#DFE8CD"/><circle cx="11" cy="12" r="5" fill="#7A4E2D"/><circle cx="29" cy="12" r="5" fill="#7A4E2D"/><circle cx="20" cy="22" r="12" fill="#7A4E2D"/><ellipse cx="20" cy="26" rx="5.5" ry="4.2" fill="#F3EBDD"/><circle cx="15.5" cy="20" r="1.6" fill="#2B2A22"/><circle cx="24.5" cy="20" r="1.6" fill="#2B2A22"/></svg>${tx('emptyCart')}</li>`;
  const no=orderNo();
  $('checkoutBody').innerHTML=`<h2>${tx('yourOrder')}</h2><ul class="lines">${lines}</ul>
    <div class="total"><span>${tx('total')}</span><span>${sar(total)}</span></div>
    <span class="lbl">${tx('pickup')}</span>
    <div class="times">${TIMES.map(m=>`<button class="time" type="button" data-m="${m}" aria-pressed="${m===pick}">${tx('inMin',{m})}<small>${clock(m)}</small></button>`).join('')}</div>
    <label class="lbl" for="name">${tx('name')}</label>
    <input type="text" id="name" autocomplete="given-name" value="${esc(name)}" placeholder="${tx('namePh')}" aria-invalid="${nameErr}">
    ${nameErr?`<p class="err">${tx('nameErr')}</p>`:''}
    <button class="send" type="button" id="send" ${cart.length?'':'disabled'}><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3a.4.4 0 0 0 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.5-.3z"/></svg>${tx('send')}</button>
    ${cart.length?`<div class="shop-sees"><div class="bar"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#DFE8CD"/><circle cx="11" cy="12" r="5" fill="#7A4E2D"/><circle cx="29" cy="12" r="5" fill="#7A4E2D"/><circle cx="20" cy="22" r="12" fill="#7A4E2D"/><ellipse cx="20" cy="26" rx="5.5" ry="4.2" fill="#F3EBDD"/></svg><span>Bear be matcha<small>${tx('shopSees')}</small></span></div>
      <div class="chat"><div class="bubble">${esc(message(no))}<span class="meta">${clock(0)} ✓✓</span></div></div></div>
      <p class="caption">${tx('shopSeesCap')}</p>`:''}`;
}
function renderAll(){renderStatic();renderMenu();renderCheckout();if(sheet)renderSheet(false)}

/* customise sheet */
function openSheet(id,lineIndex=null){
  const it=byId[id]; const base=lineIndex!=null?cart[lineIndex]:null;
  sheet={id,o:base?JSON.parse(JSON.stringify(base.o)):defaults(it),q:base?base.q:1,line:lineIndex,last:document.activeElement};
  renderSheet(true);
  $('scrim').classList.add('open'); $('sheet').classList.add('open'); document.body.classList.add('locked');
  setTimeout(()=>{const x=$('sheetIn').querySelector('.x');x&&x.focus()},50);
}
function closeSheet(){
  if(!sheet)return; const last=sheet.last; sheet=null;
  $('scrim').classList.remove('open'); $('sheet').classList.remove('open'); document.body.classList.remove('locked');
  last&&last.focus&&last.focus();
}
function chipRow(group,multi){
  const it=byId[sheet.id];
  return `<div class="opt"><div class="opt-label">${tx(group)}${multi?`<small>${tx('optional')}</small>`:''}</div><div class="chips">${OPTS[group].map(o=>{
    const on=multi?sheet.o.extra.includes(o.id):sheet.o[group]===o.id;
    return `<button class="chip" type="button" data-g="${group}" data-v="${o.id}" aria-pressed="${on}">${L(o)}${o.p?`<small>+${o.p}</small>`:''}</button>`}).join('')}</div></div>`;
}
function renderSheet(pour){
  const it=byId[sheet.id];
  $('sheetIn').innerHTML=`<div class="grab"></div><button class="x" type="button" data-close aria-label="Close">×</button>
    <div class="sheet-top"><div class="stage" id="stage">${art(it,sheet.o,{pour,big:true})}</div>
      <div style="min-width:0"><h3 id="sheetTitle">${L(it)}</h3><p class="desc">${L({ar:it.dar,en:it.den})}</p></div></div>
    ${it.opts.map(g=>chipRow(g,g==='extra')).join('')}
    <div class="sheet-foot"><div class="stepper"><button type="button" data-q="-1" aria-label="−">−</button><output>${sheet.q}</output><button type="button" data-q="1" aria-label="+">+</button></div>
      <button class="add-btn" type="button" id="addBtn"><span>${tx(sheet.line!=null?'update':'add')}</span><span>${sar(unit(it,sheet.o)*sheet.q)}</span></button></div>`;
}
function commit(){
  const s=sheet; if(!s)return;
  if(s.line!=null) cart.splice(s.line,1);
  const k=sig(s.id,s.o), ex=cart.find(l=>sig(l.id,l.o)===k);
  if(ex) ex.q+=s.q; else cart.push({id:s.id,o:s.o,q:s.q});
  done=null; save(); closeSheet(); renderMenu(); renderCheckout(); toast(tx('added'));
  const b=$('badge'); b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
}
let tt; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600)}

/* events */
$('lang').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';save();renderAll()});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;activeCat=b.dataset.cat;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',t===b));
  const el=$('cat-'+activeCat);window.scrollTo({top:el.getBoundingClientRect().top+scrollY-118,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})});
$('cats').addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openSheet(b.dataset.open)});
$('scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('sheetIn').addEventListener('click',e=>{
  if(e.target.closest('[data-close]'))return closeSheet();
  if(e.target.closest('#addBtn'))return commit();
  const q=e.target.closest('[data-q]'); if(q){sheet.q=Math.max(1,Math.min(20,sheet.q+Number(q.dataset.q)));return renderSheet(false)}
  const c=e.target.closest('[data-g]'); if(c){const g=c.dataset.g,v=c.dataset.v;
    if(g==='extra'){const a=sheet.o.extra;const i=a.indexOf(v);i<0?a.push(v):a.splice(i,1)} else sheet.o[g]=v;
    renderSheet(g==='milk'||g==='size'||g==='ice'||g==='extra')}
});
$('checkoutBody').addEventListener('click',e=>{
  const ln=e.target.closest('[data-line]'); if(ln){const l=cart[+ln.dataset.line];l.q+=Number(ln.dataset.d);if(l.q<=0)cart.splice(+ln.dataset.line,1);save();renderMenu();return renderCheckout()}
  const tm=e.target.closest('[data-m]'); if(tm){pick=+tm.dataset.m;return renderCheckout()}
  if(e.target.closest('#again')){done=null;cart=[];save();renderMenu();renderCheckout();return document.getElementById('menu').scrollIntoView()}
  if(e.target.closest('#send')){
    if(!name.trim()){nameErr=true;renderCheckout();return $('name').focus()}
    const no=orderNo(); const a=document.createElement('a');a.href='https://wa.me/?text='+encodeURIComponent(message(no));a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
    done=no; renderCheckout(); $('checkout').scrollIntoView({block:'start'});
  }
});
$('checkoutBody').addEventListener('input',e=>{if(e.target.id!=='name')return;name=e.target.value;save();if(nameErr&&name.trim()){nameErr=false;e.target.setAttribute('aria-invalid','false');const er=document.querySelector('.err');er&&er.remove()}
  const bub=document.querySelector('.bubble');if(bub)bub.innerHTML=esc(message(orderNo()))+`<span class="meta">${clock(0)} ✓✓</span>`});
addEventListener('scroll',()=>{$('head').classList.toggle('scrolled',scrollY>8);
  if(sheet)return; let cur=activeCat; for(const c of cats){const el=$('cat-'+c.id);if(el&&el.getBoundingClientRect().top<160)cur=c.id}
  if(cur!==activeCat){activeCat=cur;document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-pressed',t.dataset.cat===cur))}},{passive:true});
renderAll();
</script>
