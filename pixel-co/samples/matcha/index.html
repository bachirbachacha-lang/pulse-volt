<title>Bear be matcha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column. Hero with the bear, a tap-to-add menu of drinks drawn as layered cups, then pickup time + order sent to WhatsApp. One committed brand look (matcha green on oat paper), same in light and dark. */
:root{
  --oat:#F3EBDD; --paper:#FBF7EF; --matcha:#4F7A3A; --matcha-deep:#2F4D24; --matcha-soft:#DCE6C9;
  --bear:#7A4E2D; --ink:#2B2A22; --muted:#6E6A5A; --line:#E2D7C3; --berry:#E58A9A;
  --display:'Baloo Bhaijaan 2','IBM Plex Sans Arabic',system-ui,sans-serif;
  --body:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--oat);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--matcha);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sample{background:var(--matcha-deep);color:var(--matcha-soft);font-size:12.5px;text-align:center;padding-block:7px}
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--matcha-deep)}
.brand svg{width:40px;height:40px}
.lang{border:1.5px solid var(--matcha-deep);background:transparent;border-radius:999px;padding:4px 14px;font-weight:600;font-size:14px;color:var(--matcha-deep)}

.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding-block:8px 28px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,46px);line-height:1.15;margin:0 0 10px;color:var(--matcha-deep);text-wrap:balance}
.hero p{margin:0 0 18px;color:var(--muted);max-width:34ch}
.hero .bear{width:clamp(120px,32vw,190px)}
.cta{display:inline-block;background:var(--matcha);color:var(--paper);border:0;border-radius:14px;padding:12px 22px;font-weight:600;text-decoration:none}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--matcha-deep)}
.steps span{background:var(--matcha-soft);border-radius:999px;padding:4px 12px}

h2{font-family:var(--display);font-weight:800;font-size:26px;margin:0;color:var(--matcha-deep)}
.menu-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.note{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.tab{flex:none;border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 16px;font-weight:600;font-size:14px}
.tab[aria-pressed="true"]{background:var(--matcha-deep);border-color:var(--matcha-deep);color:var(--paper)}

.items{display:grid;grid-template-columns:1fr;gap:10px;padding-bottom:12px}
@media (min-width:620px){.items{grid-template-columns:1fr 1fr}}
.item{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.item h3{margin:0;font-size:16px;font-weight:600}
.item .desc{margin:0;font-size:13px;color:var(--muted);line-height:1.45}
.item .price{font-weight:600;color:var(--matcha-deep);font-size:14px;font-variant-numeric:tabular-nums}
.item > div{min-width:0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--matcha);background:var(--paper);color:var(--matcha-deep);font-size:20px;line-height:1;display:grid;place-items:center}
.qty button.add{background:var(--matcha);color:var(--paper)}
.qty output{min-width:18px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

/* drink drawn as a clear cup with layers */
.cup{position:relative;width:52px;height:68px;margin:0 auto}
.cup .glass{position:absolute;inset:6px 0 0 0;clip-path:polygon(0 0,100% 0,86% 100%,14% 100%);background:var(--layers);border-radius:2px}
.cup .glass::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.35) 0 18%,transparent 18% 100%)}
.cup .lid{position:absolute;top:0;left:-3px;right:-3px;height:8px;border-radius:6px 6px 2px 2px;background:var(--line)}
.cup.hot .glass{clip-path:polygon(4% 0,96% 0,88% 100%,12% 100%)}
.cup.hot .lid{background:var(--bear)}
.cup.sweet .glass{inset:22px 0 6px;clip-path:none;border-radius:50%;}
.cup.sweet .lid{display:none}

.order{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:20px;margin-block:18px 120px}
.order h2{margin-bottom:12px}
.lines{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px;font-variant-numeric:tabular-nums}
.lines li{display:flex;justify-content:space-between;gap:12px}
.empty{color:var(--muted);font-size:14px}
.total{display:flex;justify-content:space-between;border-top:1.5px dashed var(--line);padding-top:10px;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
label.lbl{display:block;font-weight:600;font-size:14px;margin:16px 0 8px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.times{grid-template-columns:1fr 1fr}}
.time{border:1.5px solid var(--line);background:var(--oat);border-radius:12px;padding:8px 12px;font-size:14px;text-align:center;line-height:1.3}
.time small{display:block;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.time[aria-pressed="true"]{border-color:var(--matcha);background:var(--matcha-soft)}
input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--oat);border-radius:12px;padding:10px 12px;font:inherit;color:var(--ink)}
.send{display:block;width:100%;margin-top:18px;background:#25A244;color:#fff;border:0;border-radius:14px;padding:14px;font-weight:600;font-size:16px;text-align:center;text-decoration:none}
.send[aria-disabled="true"]{opacity:.45;pointer-events:none}
.preview{margin-top:16px;background:#E7F3DD;border-radius:14px 14px 4px 14px;padding:12px 14px;font-size:14px;white-space:pre-wrap;line-height:1.55}
.preview-label{font-size:12.5px;color:var(--muted);margin:16px 0 0}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--matcha-deep);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(110%);transition:transform .25s ease}
.bar.show{transform:none}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.bar a{background:var(--paper);color:var(--matcha-deep);border-radius:12px;padding:8px 16px;font-weight:600;text-decoration:none}
footer{text-align:center;font-size:13px;color:var(--muted);padding-block:0 24px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar{transition:none}}
</style>

<div class="sample" data-ar="تصميم تجريبي من Pixel &amp; Co. — ليس الموقع الرسمي لـ Bear be matcha" data-en="Sample design by Pixel &amp; Co. — not Bear be matcha's official website"></div>

<header class="wrap top">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="19" fill="#DCE6C9"/><circle cx="11" cy="12" r="5" fill="#7A4E2D"/><circle cx="29" cy="12" r="5" fill="#7A4E2D"/><circle cx="20" cy="22" r="12" fill="#7A4E2D"/><ellipse cx="20" cy="26" rx="5.5" ry="4.2" fill="#F3EBDD"/><circle cx="15.5" cy="20" r="1.6" fill="#2B2A22"/><circle cx="24.5" cy="20" r="1.6" fill="#2B2A22"/><ellipse cx="20" cy="24.6" rx="2" ry="1.4" fill="#2B2A22"/></svg>
    <span>Bear be matcha</span>
  </div>
  <button class="lang" id="lang" type="button">EN</button>
</header>

<main>
  <section class="wrap hero">
    <div>
      <h1 data-ar="ماتشا تحبها، جاهزة أول ما توصل" data-en="Your matcha, ready the moment you arrive"></h1>
      <p data-ar="اختر مشروبك، حدد وقت الاستلام، والطلب يوصلنا على الواتساب. بدون انتظار وبدون رسائل." data-en="Pick your drink, choose a pickup time, and your order lands on our WhatsApp. No waiting, no DMs."></p>
      <a class="cta" href="#menu" data-ar="اطلب الحين" data-en="Order now"></a>
      <div class="steps"><span data-ar="١ اختر" data-en="1 Pick"></span><span data-ar="٢ حدد الوقت" data-en="2 Choose time"></span><span data-ar="٣ استلم" data-en="3 Pick up"></span></div>
    </div>
    <svg class="bear" viewBox="0 0 200 220" aria-hidden="true">
      <ellipse cx="100" cy="206" rx="70" ry="10" fill="#E2D7C3"/>
      <circle cx="52" cy="42" r="24" fill="#7A4E2D"/><circle cx="52" cy="42" r="12" fill="#B9835A"/>
      <circle cx="148" cy="42" r="24" fill="#7A4E2D"/><circle cx="148" cy="42" r="12" fill="#B9835A"/>
      <ellipse cx="100" cy="150" rx="66" ry="58" fill="#7A4E2D"/>
      <circle cx="100" cy="84" r="58" fill="#7A4E2D"/>
      <ellipse cx="100" cy="102" rx="26" ry="19" fill="#F3EBDD"/>
      <circle cx="78" cy="78" r="6" fill="#2B2A22"/><circle cx="122" cy="78" r="6" fill="#2B2A22"/>
      <circle cx="80" cy="76" r="2" fill="#fff"/><circle cx="124" cy="76" r="2" fill="#fff"/>
      <ellipse cx="100" cy="96" rx="8" ry="5.5" fill="#2B2A22"/>
      <path d="M92 108 q8 7 16 0" stroke="#2B2A22" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="64" cy="98" r="7" fill="#E58A9A" opacity=".55"/><circle cx="136" cy="98" r="7" fill="#E58A9A" opacity=".55"/>
      <rect x="72" y="118" width="56" height="10" rx="5" fill="#E2D7C3"/>
      <path d="M76 128 h48 l-6 62 h-36z" fill="#F3EBDD"/>
      <path d="M78 150 h44 l-4 40 h-36z" fill="#6E9A4F"/>
      <path d="M77 138 h46 l-1 12 h-44z" fill="#F7F2E8"/>
      <rect x="104" y="96" width="5" height="40" rx="2.5" fill="#4F7A3A" transform="rotate(14 106 116)"/>
      <ellipse cx="66" cy="160" rx="16" ry="13" fill="#8C5C37"/><ellipse cx="134" cy="160" rx="16" ry="13" fill="#8C5C37"/>
    </svg>
  </section>

  <section class="wrap" id="menu">
    <div class="menu-head">
      <h2 data-ar="المنيو" data-en="Menu"></h2>
      <span class="note" data-ar="الأصناف والأسعار للتجربة فقط" data-en="Items and prices are placeholders"></span>
    </div>
    <div class="tabs" id="tabs" role="toolbar"></div>
    <div class="items" id="items"></div>
  </section>

  <section class="wrap" id="order">
    <div class="order">
      <h2 data-ar="طلبك" data-en="Your order"></h2>
      <ul class="lines" id="lines"></ul>
      <div class="total"><span data-ar="المجموع" data-en="Total"></span><span id="total"></span></div>

      <label class="lbl" data-ar="وقت الاستلام" data-en="Pickup time"></label>
      <div class="times" id="times"></div>

      <label class="lbl" for="name" data-ar="الاسم" data-en="Name"></label>
      <input type="text" id="name" autocomplete="given-name">

      <a class="send" id="send" target="_blank" rel="noopener" data-ar="أرسل الطلب على الواتساب" data-en="Send order on WhatsApp"></a>
      <p class="preview-label" data-ar="هذي الرسالة اللي توصل للمحل:" data-en="This is the message the shop receives:"></p>
      <div class="preview" id="preview"></div>
    </div>
  </section>
</main>

<footer class="wrap" data-ar="Bear be matcha · جدة — تصميم تجريبي من Pixel &amp; Co." data-en="Bear be matcha · Jeddah — sample by Pixel &amp; Co."></footer>

<div class="bar" id="bar"><div class="wrap"><span id="barText"></span><a href="#order" data-ar="إكمال الطلب" data-en="Checkout"></a></div></div>

<script>
const MILK='#F7F2E8', MATCHA='#6E9A4F', MATCHA_D='#4F7A3A', ICE='#EEF3EA';
const cats=[
  {id:'iced', ar:'مثلّج', en:'Iced'},
  {id:'hot', ar:'حار', en:'Hot'},
  {id:'sweet', ar:'حلا', en:'Sweets'}
];
const menu=[
  {id:'iml',cat:'iced',ar:'آيس ماتشا لاتيه',en:'Iced Matcha Latte',dar:'ماتشا ياباني مع حليب طازج',den:'Japanese matcha over fresh milk',p:19,layers:[MILK,MILK,MATCHA,MATCHA]},
  {id:'isb',cat:'iced',ar:'ماتشا فراولة',en:'Strawberry Matcha',dar:'فراولة طازجة، حليب، ماتشا',den:'Fresh strawberry, milk, matcha',p:23,layers:['#E58A9A',MILK,MATCHA]},
  {id:'ico',cat:'iced',ar:'ماتشا جوز الهند',en:'Coconut Matcha',dar:'حليب جوز الهند مع ماتشا',den:'Coconut milk with matcha',p:22,layers:['#E8DCC2',MILK,MATCHA_D]},
  {id:'imn',cat:'iced',ar:'ماتشا مانجو',en:'Mango Matcha',dar:'مانجو، حليب، ماتشا',den:'Mango, milk, matcha',p:23,layers:['#F2B544',MILK,MATCHA]},
  {id:'ivn',cat:'iced',ar:'ماتشا فانيلا',en:'Vanilla Matcha',dar:'فانيلا مدغشقر مع ماتشا',den:'Madagascar vanilla and matcha',p:21,layers:['#F1E2B8',MILK,MATCHA]},
  {id:'hml',cat:'hot',ar:'ماتشا لاتيه',en:'Matcha Latte',dar:'حار مع رغوة حليب ناعمة',den:'Hot, with silky milk foam',p:18,layers:[MATCHA,MATCHA,'#A9C48E']},
  {id:'hus',cat:'hot',ar:'ماتشا سادة',en:'Pure Matcha',dar:'ماتشا مخفوق بالطريقة اليابانية',den:'Whisked the traditional way',p:16,layers:[MATCHA_D,MATCHA_D,MATCHA]},
  {id:'hhj',cat:'hot',ar:'هوجيتشا لاتيه',en:'Hojicha Latte',dar:'شاي ياباني محمّص مع حليب',den:'Roasted Japanese tea with milk',p:20,layers:['#9A6B45','#9A6B45','#C9A27E']},
  {id:'sck',cat:'sweet',ar:'كوكيز ماتشا',en:'Matcha Cookie',dar:'مع شوكولاتة بيضاء',den:'With white chocolate',p:9,layers:['#B9C98F','#9DB46E']},
  {id:'sch',cat:'sweet',ar:'تشيز كيك ماتشا',en:'Matcha Cheesecake',dar:'قطعة كريمية بطبقة ماتشا',den:'Creamy slice, matcha top',p:18,layers:['#E9DCC0','#F7F2E8',MATCHA]}
];
const times=[15,30,45,60];
let lang='ar', cat='iced', qty={}, pick=15;
try{const s=JSON.parse(localStorage.getItem('bbm')||'{}'); if(s.qty)qty=s.qty; if(s.lang)lang=s.lang;}catch(e){}
if(!Object.keys(qty).length) qty={iml:2,isb:1};   // sample order so the page opens filled in
const $=id=>document.getElementById(id);
const t=(ar,en)=>lang==='ar'?ar:en;
const sar=n=>lang==='ar'?n+' ر.س':'SAR '+n;
function save(){try{localStorage.setItem('bbm',JSON.stringify({qty,lang}))}catch(e){}}
function clock(min){const d=new Date(Date.now()+min*60000);let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');const pm=h>=12;h=h%12||12;return `${h}:${m} ${lang==='ar'?(pm?'م':'ص'):(pm?'PM':'AM')}`}
function cupStyle(it){const n=it.layers.length;const stops=it.layers.map((c,i)=>`${c} ${i*100/n}% ${(i+1)*100/n}%`).join(',');return `--layers:linear-gradient(to top,${stops})`}

function renderStatic(){
  document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=el.dataset[lang]);
  $('lang').textContent=lang==='ar'?'EN':'عربي';
  $('name').placeholder=t('مثال: نورة','e.g. Noura');
}
function renderTabs(){
  $('tabs').innerHTML=cats.map(c=>`<button class="tab" type="button" aria-pressed="${c.id===cat}" data-cat="${c.id}">${t(c.ar,c.en)}</button>`).join('');
}
function renderItems(){
  $('items').innerHTML=menu.filter(i=>i.cat===cat).map(i=>{
    const q=qty[i.id]||0, kind=i.cat==='iced'?'':i.cat;
    return `<article class="item">
      <div class="cup ${kind}" style="${cupStyle(i)}"><div class="lid"></div><div class="glass"></div></div>
      <div><h3>${t(i.ar,i.en)}</h3><p class="desc">${t(i.dar,i.den)}</p><span class="price">${sar(i.p)}</span></div>
      <div class="qty">${q?`<button type="button" data-id="${i.id}" data-d="-1" aria-label="${t('إنقاص','Remove one')}">−</button><output>${q}</output>`:''}<button class="add" type="button" data-id="${i.id}" data-d="1" aria-label="${t('إضافة','Add one')}">+</button></div>
    </article>`}).join('');
}
function renderOrder(){
  const chosen=menu.filter(i=>qty[i.id]>0);
  const total=chosen.reduce((s,i)=>s+i.p*qty[i.id],0);
  const count=chosen.reduce((s,i)=>s+qty[i.id],0);
  $('lines').innerHTML=chosen.length?chosen.map(i=>`<li><span>${qty[i.id]}× ${t(i.ar,i.en)}</span><span>${sar(i.p*qty[i.id])}</span></li>`).join(''):`<li class="empty">${t('ما أضفت شي للحين. اختر من المنيو فوق.','Nothing added yet. Pick something from the menu above.')}</li>`;
  $('total').textContent=sar(total);
  $('times').innerHTML=times.map(m=>`<button class="time" type="button" aria-pressed="${m===pick}" data-m="${m}">${t('بعد '+m+' دقيقة','In '+m+' min')}<small>${clock(m)}</small></button>`).join('');
  const name=$('name').value.trim()||t('(الاسم)','(name)');
  const msg=[t('طلب جديد من الموقع 🐻🍵','New website order 🐻🍵'),
    t('الاسم: ','Name: ')+name,
    t('الاستلام: ','Pickup: ')+clock(pick)+t(` (بعد ${pick} دقيقة)`,` (in ${pick} min)`),'',
    ...chosen.map(i=>`• ${qty[i.id]}× ${t(i.ar,i.en)} — ${sar(i.p*qty[i.id])}`),'',
    t('المجموع: ','Total: ')+sar(total)].join('\n');
  $('preview').textContent=msg;
  const send=$('send'); send.href='https://wa.me/?text='+encodeURIComponent(msg); send.setAttribute('aria-disabled',chosen.length?'false':'true');
  $('bar').classList.toggle('show',count>0);
  $('barText').textContent=t(`${count} في السلة · ${sar(total)}`,`${count} in cart · ${sar(total)}`);
}
function all(){renderStatic();renderTabs();renderItems();renderOrder()}

$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;cat=b.dataset.cat;renderTabs();renderItems()});
$('items').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(!b)return;const id=b.dataset.id;qty[id]=Math.max(0,(qty[id]||0)+Number(b.dataset.d));if(!qty[id])delete qty[id];save();renderItems();renderOrder()});
$('times').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;pick=Number(b.dataset.m);renderOrder()});
$('name').addEventListener('input',renderOrder);
$('lang').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';save();all()});
all();
</script>
