<style>
/* Layout: fixed 3D studio stage (bottles, mug, beans) behind four scroll chapters, then a light shop with a 3-pack builder, how-to, reviews and a cart. Sample brand by Pixel & Co. */
:root{

}
*{box-sizing:border-box}
html{scroll-behavior:smooth;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden}
a{color:inherit}
button{font-family:var(--body)}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sample{position:relative;z-index:21;background:var(--ink);color:var(--paper);text-align:center;font-size:13px;padding:7px 16px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(20px,4vw);background:rgba(243,235,223,.6);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-style:italic;font-weight:600;font-size:32px;letter-spacing:-.02em;text-decoration:none;line-height:1}
.logo b{color:var(--accent);font-weight:600}
nav{display:flex;gap:26px;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
nav a{text-decoration:none;color:var(--muted)}
.hright{display:flex;align-items:center;gap:8px}
.switch{display:flex;background:rgba(43,29,20,.06);border-radius:999px;padding:4px}
.switch button{border:0;background:transparent;color:var(--ink);font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;cursor:pointer}
.switch button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.cartbtn{position:relative;border:0;background:var(--ink);color:var(--paper);border-radius:999px;width:44px;height:44px;cursor:pointer;display:grid;place-items:center}
.cartbtn svg{width:22px;height:22px}
.badge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:20px;height:20px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px;transition:transform .3s}
.badge.pop{transform:scale(1.35)}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(70% 60% at 62% 42%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%)}
#stage3d{position:fixed;inset:0;z-index:0;pointer-events:none}
#stage3d canvas{display:block;width:100%;height:100%}
main,footer{position:relative;z-index:2}
.chap{min-height:100svh;display:flex;align-items:center;padding:90px max(20px,6vw) 60px}
.chap .copy{max-width:520px}
.chap.right{justify-content:flex-end}
.big{font-family:var(--serif);font-weight:600;font-size:clamp(54px,8.2vw,118px);line-height:.95;letter-spacing:-.035em;margin:14px 0 0}
.big em{font-style:italic;font-weight:500;color:var(--accent)}
.eyebrow,.num{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:500}
.lead{color:var(--muted);font-size:19px;margin:18px 0 0;max-width:36ch}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:15px 26px;font-weight:500;font-size:16px;text-decoration:none;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(43,29,20,.5)}
.btn.main{background:var(--ink);color:var(--paper)}
.btn.ghost{background:rgba(255,255,255,.5);color:var(--ink);border:1px solid var(--line)}
.facts{display:flex;gap:30px;margin-top:24px}
.facts div b{display:block;font-family:var(--serif);font-weight:600;font-size:42px;line-height:1;letter-spacing:-.02em}
.facts div span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.pricebar{display:flex;align-items:center;gap:16px;margin-top:26px}
.pricebar .p{font-size:26px;font-weight:600}
.scrollhint{position:absolute;left:50%;bottom:26px;translate:-50% 0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);animation:hint 2s ease-in-out infinite}
@keyframes hint{50%{translate:-50% 8px}}
.reveal{opacity:.001;translate:0 36px;transition:opacity .9s,translate .9s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;translate:0 0}
.marquee{overflow:hidden;background:var(--ink);color:var(--paper);font-family:var(--serif);font-style:italic;font-size:28px;white-space:nowrap;padding:14px 0}
.marquee div{display:inline-block;animation:slide 30s linear infinite}
@keyframes slide{to{transform:translateX(-50%)}}
.solid{background:var(--bg)}
section.s{padding:90px 20px;max-width:1120px;margin:0 auto}
.k{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin:0;font-weight:500}
h2{font-family:var(--serif);font-weight:600;font-size:clamp(40px,6vw,72px);line-height:1;letter-spacing:-.03em;margin:10px 0 0}
h2 em{font-style:italic;font-weight:500;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;margin-top:30px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:14px;display:flex;flex-direction:column;gap:8px;transition:transform .35s,box-shadow .35s}
.card:hover{transform:translateY(-6px);box-shadow:0 30px 50px -30px rgba(43,29,20,.45)}
.pic{aspect-ratio:1;border-radius:18px;position:relative;overflow:hidden;background:#EDE3D6}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.card:hover .pic img{transform:scale(1.05)}
.tag{position:absolute;top:12px;inset-inline-start:12px;background:var(--ink);color:var(--paper);font-size:12px;font-weight:500;border-radius:999px;padding:4px 10px;z-index:1}
.card h3{margin:6px 4px 0;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.card p{margin:0 4px;color:var(--muted);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding:8px 4px 2px}
.price{font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.add{border:0;background:var(--ink);color:var(--paper);font-weight:500;font-size:14px;border-radius:999px;padding:11px 18px;cursor:pointer}
.add.done{background:var(--sage)}
.builder{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:34px;padding:40px}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#E6D8C6;border-radius:24px;padding:16px;box-shadow:inset 0 2px 12px rgba(43,29,20,.12)}
.slot{aspect-ratio:3/4;border-radius:16px;background:#EFE5D8;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-size:30px}
.slot img{width:100%;height:100%;object-fit:cover;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{scale:.5;opacity:0}}
.flavors{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}
.flavors button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 15px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.flavors i{width:14px;height:14px;border-radius:50%}
.bnote{color:var(--muted);font-size:16px;margin:14px 0 0}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px;counter-reset:s}
.step{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:26px;counter-increment:s}
.step::before{content:counter(s);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--serif);font-size:22px;margin-bottom:16px}
.step h3{margin:0;font-family:var(--serif);font-weight:600;font-size:26px}
.step p{margin:6px 0 0;color:var(--muted)}
.reviews{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.rev{background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:24px}
.rev .st{color:var(--accent);letter-spacing:.15em}
.rev p{margin:10px 0 14px;font-family:var(--serif);font-size:20px;line-height:1.35}
.rev b{font-weight:400;color:var(--muted);font-size:14px}
footer{text-align:center;padding:56px 20px calc(60px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--muted);font-size:14px;background:var(--bg)}
footer .logo{display:block;margin-bottom:10px;color:var(--ink);font-size:44px}
.scrim{position:fixed;inset:0;background:rgba(43,29,20,.4);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(400px,100%);background:var(--paper);z-index:31;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));border-inline-start:1px solid var(--line)}
[dir=rtl] .drawer{transform:translateX(-105%)}
.open .scrim{opacity:1;pointer-events:auto}.open .drawer{transform:none}
.dhead{display:flex;justify-content:space-between;align-items:center}
.dhead h3{margin:0;font-family:var(--serif);font-weight:600;font-size:32px}
.x{border:0;background:rgba(43,29,20,.07);color:var(--ink);width:40px;height:40px;border-radius:50%;font-size:20px;cursor:pointer}
.items{flex:1;overflow:auto;margin:16px 0;display:flex;flex-direction:column;gap:12px}
.it{display:flex;gap:12px;align-items:center;background:#fff;border-radius:16px;padding:10px;border:1px solid var(--line)}
.it img{width:54px;height:54px;border-radius:12px;object-fit:cover;flex:none}
.it .nm{flex:1;min-width:0;font-size:15px}
.it .nm small{display:block;color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.empty{color:var(--muted);text-align:center;margin-top:40px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:600;border-top:1px solid var(--line);padding-top:14px;margin-bottom:12px}
.wa{display:flex;justify-content:center;gap:8px;background:#25D366;color:#fff;text-decoration:none;border-radius:999px;padding:15px;font-weight:500}
.dnote{text-align:center;color:var(--muted);font-size:12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));translate:-50% 20px;background:var(--ink);color:var(--paper);font-size:14px;border-radius:999px;padding:12px 20px;opacity:0;transition:opacity .25s,translate .25s;z-index:40;pointer-events:none}
.toast.show{opacity:1;translate:-50% 0}
[dir=rtl] .big,[dir=rtl] h2,[dir=rtl] .card h3,[dir=rtl] .dhead h3,[dir=rtl] .facts b,[dir=rtl] .step h3,[dir=rtl] .rev p{font-family:var(--body);font-weight:600;letter-spacing:0;line-height:1.2}
[dir=rtl] .big em,[dir=rtl] h2 em{font-style:normal}
[dir=rtl] .big{font-size:clamp(42px,6.4vw,92px)}
@media (max-width:820px){
  nav{display:none}
  .chap,.chap.right{align-items:flex-end;justify-content:center;text-align:center;padding-bottom:64px}
  .chap .copy{background:linear-gradient(rgba(243,235,223,0),rgba(243,235,223,.92) 26%);padding:56px 6px 0;margin:0 auto}
  .lead{margin-inline:auto}.cta,.facts,.pricebar{justify-content:center}
  .builder{grid-template-columns:1fr;padding:24px}
  .steps,.reviews{grid-template-columns:1fr}
}
@media (max-width:500px){header{padding:12px 14px}.logo{font-size:28px}.switch button{padding:6px 10px}.big{font-size:clamp(46px,13.5vw,64px)}.facts{gap:20px}.facts div b{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;translate:0 0}}
</style>

    {b:[[6.8,0,-5,0,-.4,0,.95],[-9,0,-4,0,0,0,.9],[.4,0,-5.5,0,.2,0,.95],[2.6,0,1,0,-.1,0,1.22]],mug:[5.4,0,2.4,0,-.4,0,.6],beans:[5,0,2.4,1],pods:1,bg:'#E6E7D9'},
    {b:[[-9,0,-4,0,0,0,.9],[-1.15,2.35,.6,.1,.4,2.35,.8],[-9,0,-5,0,0,0,.9],[9,0,-4,0,0,0,.9]],mug:[-2.4,.25,1.6,.62,-.4,0,1.15],beans:[-2.4,0,1.6,0],pods:0,bg:'#F0E4D4'},
    {b:[OFF,OFF,OFF,OFF],mug:OFF,beans:[0,-12,0,0],pods:0,bg:'#F3EBDF'}
  ];
  const BG=L.map(l=>new THREE.Color(l.bg));
  const chaps=[...document.querySelectorAll('[data-stage]')];
  function stageNow(){
    const mid=scrollY+innerHeight/2;
    const c=chaps.map(el=>{const r=el.getBoundingClientRect();return el.dataset.stage==='4'?r.top+scrollY+innerHeight*.35:r.top+scrollY+r.height/2});
    if(mid<=c[0])return 0;
    for(let i=0;i<c.length-1;i++)if(mid<c[i+1])return i+(mid-c[i])/(c[i+1]-c[i]);
    return c.length-1;
  }
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const mob=()=>innerWidth<820;
  const mapX=x=>mob()?x*.38:x, floorY=()=>mob()?.05:FLOOR, mapS=s=>s*(mob()?.62:1);
  function place(obj,a,b,t,time,ph,idle){
    const k=ease(t),I=i=>a[i]+(b[i]-a[i])*k;const s=mapS(I(6)),half=obj.userData.half||0;
    const lift=I(1);
    obj.position.set(mapX(I(0)),floorY()+half*s+lift*(mob()?.7:1)+(idle?Math.sin(time*.8+ph)*.05*Math.min(1,lift):0),I(2));
    obj.rotation.set(I(3),I(4)+(idle?Math.sin(time*.35+ph)*.12:0),I(5));
    obj.scale.setScalar(s);
    const sh=obj.userData.sh;if(sh){const w=sh.userData.w*s*(1+lift*.25);sh.position.set(obj.position.x,floorY()+.002,obj.position.z);sh.scale.set(w,w*.62,1);sh.material.opacity=Math.max(0,.95-lift*.45)*(s>.01?1:0)}
  }
  let smooth=stageNow();const bgc=new THREE.Color();
  function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
  addEventListener('resize',resize);resize();
  const va=new THREE.Vector3(),vb=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
  let last=performance.now();
  function frame(now){
    requestAnimationFrame(frame);
    const dt=Math.min((now-last)/1000,.1);last=now;const time=now/1000;
    const raw=stageNow();smooth=reduce?raw:THREE.MathUtils.damp(smooth,raw,5,dt);
    const i=Math.min(Math.floor(smooth),L.length-1),j=Math.min(i+1,L.length-1),t=smooth-i,A=L[i],B=L[j],idle=!reduce;
    bottles.forEach((b,n)=>place(b,A.b[n],B.b[n],t,time,n*1.4,idle));
    // feature bottle turns slowly so the whole label shows
    const feat=smooth>.5&&smooth<1.5?0:smooth>1.5&&smooth<2.5?3:-1;
    if(feat>=0&&idle)bottles[feat].rotation.y+=Math.sin(time*.45)*.55;
    place(mug,A.mug,B.mug,t,time,2.2,idle);
    const k=ease(t),bA=A.beans,bB=B.beans;
    beans.position.set(mapX(bA[0]+(bB[0]-bA[0])*k),floorY()+(bA[1]+(bB[1]-bA[1])*k),bA[2]+(bB[2]-bA[2])*k);
    const bs=mapS(1)*(bA[3]+(bB[3]-bA[3])*k);beans.scale.setScalar(Math.max(bs,.001));
    scene.children.forEach(o=>{const bn=o.userData&&o.userData.bean;if(bn){bn.getWorldPosition(va);o.position.set(va.x,floorY()+.001,va.z);o.scale.set(.5*bs,.32*bs,1);o.material.opacity=.55*Math.min(1,bs)}});
    const pv=A.pods+(B.pods-A.pods)*k;
    pods.forEach((p,n)=>{const [x,y,z]=p.userData.p,sp=p.userData.sp;const cx=mob()?0:3.1;p.position.set(cx+x*(mob()?.6:1)+Math.sin(time*sp+n)*.15,(mob()?1.9:.4)+y*(mob()?.6:1)+Math.sin(time*sp*.8+n*2)*.2,z+1.2);p.rotation.set(p.userData.r[0]+time*sp*.5,p.userData.r[1]+time*sp*.4,p.userData.r[2]);p.scale.setScalar(Math.max(.001,pv*mapS(1.4)))});
    // cream pour in chapter 3
    const pw=Math.max(0,1-Math.abs(smooth-3)/.35);
    if(pw>.01){const b=bottles[1];va.set(0,1.62,0);b.localToWorld(va);mug.getWorldPosition(vb);vb.y+=.5*mug.scale.x;vb.x+=.05;const len=va.distanceTo(vb);stream.position.copy(va).lerp(vb,.5);stream.quaternion.setFromUnitVectors(up,vb.clone().sub(va).normalize());stream.scale.set(mapS(1)*(.6+.4*pw),len*pw,mapS(1)*(.6+.4*pw));stream.visible=true;stream.material.opacity=pw}else stream.visible=false;
    bgc.copy(BG[i]).lerp(BG[j],ease(t));document.body.style.backgroundColor='#'+bgc.getHexString();
    host.style.opacity=smooth>3.85?Math.max(0,1-(smooth-3.85)/.15):1;
    renderer.render(scene,camera);
  }
  requestAnimationFrame(frame);

  /* ---- studio product photos for the shop ---- */
  const shotR=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});shotR.setPixelRatio(1);shotR.setSize(720,720,false);shotR.toneMapping=THREE.ACESFilmicToneMapping;shotR.toneMappingExposure=1.15;shotR.outputColorSpace=THREE.SRGBColorSpace;
  const ss=new THREE.Scene();ss.environment=envTex;ss.environmentIntensity=.9;[key,fill,back].forEach(l=>ss.add(l.clone()));ss.add(new THREE.HemisphereLight(0xffffff,0xeadfce,1.1));
  const sc=new THREE.PerspectiveCamera(26,1,.1,60);
  const flat=(o)=>{const s=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial({map:shTex,transparent:true,depthWrite:false}));s.rotation.x=-Math.PI/2;const w=(o.userData.half>1?2.3:3.6)*o.scale.x;s.scale.set(w,w*.62,1);s.position.set(o.position.x,.003,o.position.z);return s};
  function shot(items,bg,cam,size=[720,720]){
    shotR.setSize(size[0],size[1],false);sc.aspect=size[0]/size[1];
    while(ss.children.length>4)ss.remove(ss.children[4]);
    const [c,x]=cv(size[0],size[1]);const g=x.createRadialGradient(size[0]*.5,size[1]*.42,10,size[0]*.5,size[1]*.5,size[0]*.8);g.addColorStop(0,'#FBF5EC');g.addColorStop(1,bg);x.fillStyle=g;x.fillRect(0,0,size[0],size[1]);
    ss.background=tex(c);
    items.forEach(([o,px,pz,ry,s])=>{o.scale.setScalar(s);o.position.set(px,o.userData.half*s,pz);o.rotation.y=ry;ss.add(o);ss.add(flat(o))});
    sc.position.set(...cam[0]);sc.lookAt(...cam[1]);sc.updateProjectionMatrix();
    shotR.render(ss,sc);return shotR.domElement.toDataURL('image/jpeg',.9);
  }
  const beanAt=(x,z,r)=>{const b=new THREE.Mesh(beanGeo,beanMat);b.position.set(x,.07,z);b.rotation.set(-Math.PI/2,r,0);b.userData.half=.07;return b};
  KEYS.forEach(k=>{
    const items=[[makeBottle(k),0,0,-.25,1]];
    SHOTS[k]=shot(items,'#E8DCCB',[[0,2.3,9.4],[0,1.75,0]]);
    SHOTS['t_'+k]=shot([[makeBottle(k),0,0,-.2,1]],'#E8DCCB',[[0,2.2,8.6],[0,1.85,0]],[480,640]);
  });
  SHOTS.set=shot(KEYS.map((k,n)=>[makeBottle(k),(n-1.5)*1.75,n%2?.45:-.35,-.2,1]),'#E8DCCB',[[0,3.3,13.2],[0,1.6,0]]);
  shotR.dispose();
  render();
}
