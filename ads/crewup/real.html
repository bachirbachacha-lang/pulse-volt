<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CrewUp Screen Recordings</title>
<style>
@font-face{font-family:Inter;src:url(fonts/inter-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Inter;src:url(fonts/inter-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Inter;src:url(fonts/inter-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Inter;src:url(fonts/inter-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Inter;src:url(fonts/inter-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Sora;src:url(fonts/sora-latin-800-normal.woff2);font-weight:800}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090B10;--b:#1F6BFF;--o:#FF7A2F;--g:#FFC83D;--red:#FF453A;--grn:#30D158;--card:#141822;--card2:#1b2030;--line:#232a38;--mut:#8E95A6}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
/* everything is laid out on a 390 x 693 iPhone canvas (9:16) and scaled up to 1080 x 1920 */
#dev{position:absolute;left:0;top:0;width:390px;height:693.4px;transform:scale(2.76923);transform-origin:0 0;overflow:hidden;background:var(--bg);color:#fff;font-family:Inter,"Noto Color Emoji",sans-serif;-webkit-font-smoothing:antialiased}
.abs{position:absolute}
.layer{position:absolute;inset:0;overflow:hidden}
/* iOS chrome */
.sbar{position:absolute;left:0;right:0;top:0;height:50px;z-index:40;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 40px;font:600 15px/1 Inter;letter-spacing:-.2px}
.sbar .r{display:flex;gap:6px;align-items:center}
.island{position:absolute;left:50%;top:11px;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#000;z-index:41}
.homeind{position:absolute;left:50%;bottom:7px;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:rgba(255,255,255,.85);z-index:41}
/* app */
.app{position:absolute;inset:0;padding:54px 16px 0;background:var(--bg)}
.scroll{position:relative}
.app::before{content:'';position:absolute;left:0;right:0;top:0;height:50px;background:var(--bg);z-index:15}
.hd{display:flex;justify-content:space-between;align-items:center;height:44px}
.hd h1{font:800 28px/1 Inter;letter-spacing:-.6px}
.hd .r{display:flex;gap:10px;align-items:center}
.ic{width:34px;height:34px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center}
.pfp{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 14px Inter;color:#0a0f1c;flex:none}
.card{background:var(--card);border-radius:18px;padding:14px;margin-top:12px;position:relative}
.cap{font:600 12px/1 Inter;color:var(--mut);letter-spacing:.2px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.big{font:800 40px/1 Inter;letter-spacing:-1px}
.t15{font:600 15px/1.25 Inter}.t13{font:500 13px/1.3 Inter;color:var(--mut)}.t17{font:700 17px/1.25 Inter;letter-spacing:-.2px}
.wk{display:flex;gap:4px}.wk i{width:18px;height:18px;border-radius:6px;background:#232a3a}.wk i.on{background:var(--b)}
.mini{font:600 12px Inter;padding:7px 10px;border-radius:10px;background:var(--b);color:#fff}
.mini.gray{background:var(--card2);color:#cfd5e2}
.btn{height:50px;border-radius:14px;background:var(--b);display:flex;align-items:center;justify-content:center;font:700 16px Inter}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#171b26;border-radius:22px 22px 0 0;padding:10px 16px 30px;z-index:30}
.grab{width:36px;height:5px;border-radius:3px;background:#3a4256;margin:0 auto 14px}
.opt{background:var(--card2);border-radius:14px;padding:14px;margin-top:8px;font:600 15px Inter;display:flex;justify-content:space-between;align-items:center}
.opt.sel{outline:2px solid var(--b);background:#16264a}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:29}
.tabbar{position:absolute;left:0;right:0;bottom:0;height:82px;background:rgba(14,17,24,.94);border-top:1px solid #1d2230;display:flex;justify-content:space-around;padding-top:8px;z-index:20}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font:600 10px Inter;color:#6b7386;width:70px}
.tab.on{color:var(--b)}
.tab svg{width:24px;height:24px}
/* iOS banners */
.ban{position:absolute;left:10px;right:10px;top:12px;border-radius:22px;background:rgba(38,42,52,.82);backdrop-filter:blur(20px);padding:11px 13px;display:flex;gap:10px;align-items:center;z-index:45;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.ban img,.appicon{width:38px;height:38px;border-radius:9px;flex:none}
.ban .tt1{display:flex;justify-content:space-between;font:600 14px/1.2 Inter}
.ban .tt1 span{font:400 13px Inter;color:#b7bdc9}
.ban .bd{font:400 14px/1.3 Inter;color:#eef1f6;margin-top:2px}
.toast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:rgba(40,44,56,.95);border-radius:20px;padding:10px 16px;font:600 14px Inter;white-space:nowrap;z-index:46;display:flex;gap:8px;align-items:center}
/* lock screen */
.lock{position:absolute;inset:0;background:radial-gradient(120% 80% at 30% 10%,#26407a 0%,#111b38 45%,#05070d 100%)}
.lock .dt{position:absolute;left:0;right:0;top:66px;text-align:center;font:600 18px Inter;color:rgba(255,255,255,.85)}
.lock .tm{position:absolute;left:0;right:0;top:84px;text-align:center;font:700 96px/1 Inter;letter-spacing:-3px;color:rgba(235,240,255,.95)}
.lock .ban{position:absolute;top:auto}
.lock .bot{position:absolute;bottom:34px;left:44px;right:44px;display:flex;justify-content:space-between}
.lock .bot i{width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.14);backdrop-filter:blur(10px)}
/* camera */
.cam{position:absolute;inset:0;background:#000}
.vf{position:absolute;left:0;right:0;top:100px;height:440px;overflow:hidden;background:linear-gradient(180deg,#2b2f37 0%,#3d424c 40%,#1c1f25 100%)}
.shutter{position:absolute;left:50%;bottom:52px;width:74px;height:74px;margin-left:-37px;border-radius:50%;border:4px solid #fff;padding:4px}
.shutter i{display:block;width:100%;height:100%;border-radius:50%;background:#fff}
/* chat */
.msg{display:flex;gap:8px;align-items:flex-end;margin-top:10px}
.msg .b{background:#1f2433;border-radius:18px 18px 18px 6px;padding:9px 13px;font:400 15px/1.3 Inter;max-width:250px}
.msg .n{font:600 11px Inter;color:var(--mut);margin:0 0 3px 4px}
.msg.me{justify-content:flex-end}.msg.me .b{background:var(--b);border-radius:18px 18px 6px 18px}
.typing{display:flex;gap:4px;padding:12px 14px;background:#1f2433;border-radius:18px;width:58px}
.typing i{width:7px;height:7px;border-radius:50%;background:#7b8295}
/* TikTok-style text */
.tt{position:absolute;left:24px;right:24px;text-align:center;z-index:60;line-height:1.55}
.tt span{background:#fff;color:#111;font:600 17px/1.55 Inter;padding:3px 8px;border-radius:6px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tt.dark span{background:rgba(0,0,0,.72);color:#fff}
#touch{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:rgba(200,200,205,.55);border:1.5px solid rgba(255,255,255,.7);z-index:55;opacity:0}
#label{position:absolute;left:12px;top:52px;font:600 8px Inter;letter-spacing:.6px;color:rgba(255,255,255,.55);z-index:58;text-transform:uppercase}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:70}
#endc{position:absolute;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0}
#endc img{width:96px;height:96px;border-radius:24px}
#endc b{font:800 34px Sora;letter-spacing:-1px;margin-top:16px}
#endc span{font:500 14px Inter;color:#c7cedd;margin-top:6px}
#endc em{font:600 14px Inter;color:#6f9dff;margin-top:14px;font-style:normal}
#fade{position:absolute;inset:0;background:#000;z-index:90}
.conf{position:absolute;width:6px;height:10px;border-radius:2px;z-index:50}
/* frame mode (?frame=1): the screen sits inside a phone seen from outside */
body.frame{background:#090B10}
#fbg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 66%,rgba(31,107,255,.30),rgba(31,107,255,0) 70%),#090B10}
#fdots{position:absolute;inset:-100px;background-image:radial-gradient(rgba(91,147,255,.14) 2px,transparent 2.5px);background-size:54px 54px}
#pmove{position:absolute;left:255px;top:640px;width:570px;height:1197px;transform-origin:50% 40%}
#pwrap{position:absolute;inset:0;border-radius:84px;background:linear-gradient(145deg,#3a4152,#11141b 40%,#2a303d);padding:16px;box-shadow:0 0 0 2px #4a5265,0 70px 140px rgba(0,0,0,.7),0 0 180px rgba(31,107,255,.35)}
#pwrap::before{content:'';position:absolute;left:-5px;top:230px;width:5px;height:90px;border-radius:3px 0 0 3px;background:#3a4152;box-shadow:0 120px 0 #3a4152}
#pwrap::after{content:'';position:absolute;right:-5px;top:300px;width:5px;height:140px;border-radius:0 3px 3px 0;background:#3a4152}
.frame #dev{left:16px;top:16px;height:844px;transform:scale(1.3795);border-radius:49px}
#fcorner{position:absolute;left:50px;top:80px;display:flex;align-items:center;gap:14px;z-index:20}
#fcorner img{width:64px;height:64px;border-radius:16px}
#fcorner span{font:600 22px Inter;color:#c9d3e8;letter-spacing:.06em;border:2px solid rgba(201,211,232,.3);padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.35)}
#otexts .tt{position:absolute;left:60px;right:60px;top:auto!important;bottom:1310px;line-height:1.5}
#otexts .tt span{font:700 46px/1.5 Inter;padding:6px 18px;border-radius:14px}
.frame #label{display:none}
body.frame > #fade{position:absolute;inset:0;background:#000;z-index:90}
</style>
</head>
<body>
<div id="dev">
  <div id="stage" class="layer"></div>
  <div class="island"></div>
  <div class="sbar" id="sbar"><span data-s="clock">9:41</span><span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="16" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.2-1.3A10.6 10.6 0 0 0 8 .4 10.6 10.6 0 0 0 .6 3.4l1.2 1.3A8.8 8.8 0 0 1 8 2.2zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.2-1.3A7.2 7.2 0 0 0 8 4a7.2 7.2 0 0 0-4.9 1.9l1.2 1.3c1-.9 2.3-1.4 3.7-1.4zm0 3.6c.5 0 1 .2 1.3.5L8 11.6 6.7 9.9c.3-.3.8-.5 1.3-.5z"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x=".5" y=".5" width="22" height="12" rx="3.5" stroke="#fff" opacity=".4"/><rect x="2" y="2" width="16" height="9" rx="2" fill="#fff"/><path d="M24.5 4.5v4c.8-.3 1.5-1 1.5-2s-.7-1.7-1.5-2z" fill="#fff" opacity=".4"/></svg></span></div>
  <div class="homeind"></div>
  <div id="label">App preview · concept</div>
  <div id="touch"></div>
  <div id="texts"></div>
  <div id="flash"></div>
  <div id="endc"><img src="img/crewup-logo.png"><b>CrewUp</b><span>Gym with your crew, not alone.</span><em>@getcrewup</em></div>
  <div id="fade"></div>
</div>
<script src="lib/gsap.min.js"></script>
<script>
const CUT = new URLSearchParams(location.search).get('cut') || 'day1';
const $ = s => document.querySelector(s);
const FRAME = new URLSearchParams(location.search).get('frame') === '1';
if (new URLSearchParams(location.search).get('notext') === '1') document.head.insertAdjacentHTML('beforeend', '<style>#texts,#otexts,#label{display:none!important}</style>');
if (FRAME) {
  document.body.classList.add('frame');
  const dev = $('#dev'), fade = $('#fade');
  document.body.insertAdjacentHTML('afterbegin', `<div id="fbg"><div id="fdots"></div></div><div id="fcorner"><img src="img/crewup-logo.png"><span>APP PREVIEW · CONCEPT</span></div><div id="pmove"><div id="pwrap"></div></div><div id="otexts"></div>`);
  $('#pwrap').appendChild(dev); document.body.appendChild(fade);
}
// sound cues, read by record.js and turned into audio by sfx.py
const SFX = []; window.SFX = SFX;
const sfx = (type, t) => SFX.push({ type, t: +t.toFixed(3) });
const LOGO = 'img/crewup-logo.png';
const PC = { O: '#6E9BFF', K: '#FFC83D', F: '#FF9A5A', Y: '#d6dbe6' };
const pfp = (l, s = 34) => `<div class="pfp" style="width:${s}px;height:${s}px;font-size:${s * .42}px;background:${PC[l]}">${l}</div>`;
const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v10a1 1 0 0 0 1 1h5v-6h6v6h5a1 1 0 0 0 1-1V10z"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4 5 5 0 0 1-3 2.8V18h3v3H8v-3h3v-3.2A5 5 0 0 1 8 12a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1 1.7zm11 0h-1v2.7A2 2 0 0 0 18 8z"/></svg>',
  crew: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.7"/><path d="M2 19c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5zM14.5 19c0-2-.6-3.6-1.7-4.7.9-.4 2-.7 3.2-.7 2.8 0 5 1.9 5 5.4z"/></svg>',
  me: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z"/></svg>',
  bell: '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 22a2.5 2.5 0 0 0 2.4-2H9.6A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3a1.5 1.5 0 0 0-3 0v1.2A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg>',
};
const tabbar = on => `<div class="tabbar">${[['home', 'Home'], ['trophy', 'Challenges'], ['crew', 'Crew'], ['me', 'Profile']].map(([k, n]) => `<div class="tab${k == on ? ' on' : ''}">${ICON[k]}${n}</div>`).join('')}</div>`;
const banner = (id, title, body, style = '') => `<div class="ban" id="${id}" style="${style}"><img src="${LOGO}"><div style="flex:1"><div class="tt1">${title}<span>now</span></div><div class="bd">${body}</div></div></div>`;
const homeHead = (title = 'Home') => `<div class="hd"><h1>${title}</h1><div class="r"><div class="ic">${ICON.bell}</div>${pfp('Y')}</div></div>`;
const streakCard = (k = 'st') => `<div class="card"><div class="row"><div><div class="cap">CURRENT STREAK</div><div class="row" style="margin-top:8px;gap:6px"><span style="font-size:30px">🔥</span><span class="big" style="color:var(--o)" data-n="${k}">0</span><span class="t13" style="margin-top:10px">days</span></div></div><div class="sp"></div>
  <div class="wk">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((d, i) => `<div style="text-align:center;font:600 10px Inter;color:var(--mut)"><i class="${i < 4 ? 'on' : ''}" style="display:block;margin-bottom:4px;width:16px;height:16px;border-radius:5px;background:${i < 4 ? 'var(--o)' : '#232a3a'}"></i>${d}</div>`).join('')}</div></div></div>`;
const chalCard = (nudgeId = 'nb') => `<div class="card"><div class="row"><div><div class="t17">Gym 4x per week</div><div class="t13" style="margin-top:2px">Loser buys everyone coffee ☕ · 3 days left</div></div></div>
  ${[['O', 'Omar', 4], ['K', 'Khalid', 3], ['Y', 'You', 3], ['F', 'Faisal', 0]].map(([l, n, k]) => `<div class="row" style="margin-top:12px">${pfp(l, 30)}<span class="t15" style="width:62px">${n}</span><div class="wk">${[0, 1, 2, 3].map(j => `<i class="${j < k ? 'on' : ''}"></i>`).join('')}</div><div class="sp"></div>${l == 'F' ? `<span class="mini" id="${nudgeId}">Nudge ⚡</span>` : `<span class="t13" style="color:${k == 4 ? 'var(--grn)' : 'var(--mut)'}">${k}/4</span>`}</div>`).join('')}</div>`;

const N = {}; const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
let DUR = 12, tcount = 0;
// TikTok text box: shows from a to b
function text(html, a, b, top = 118, cls = '') {
  const id = 'tx' + (tcount++); const el = document.createElement('div'); el.className = 'tt ' + cls; el.id = id; el.style.top = top + 'px';
  el.innerHTML = html.split('\n').map(l => `<span>${l}</span>`).join('<br>'); $(FRAME ? '#otexts' : '#texts').appendChild(el);
  tl.set('#' + id, { opacity: 0 }, 0).set('#' + id, { opacity: 1 }, a).set('#' + id, { opacity: 0 }, b);
}
// iOS "show touches" dot: tap at (x,y)
function tap(t, x, y) { sfx('tap', t + .05); tl.set('#touch', { left: x, top: y, scale: 1, opacity: 0 }, t - .01).to('#touch', { opacity: 1, duration: .06 }, t).to('#touch', { scale: .85, duration: .08 }, t + .06).to('#touch', { opacity: 0, scale: 1, duration: .15 }, t + .22); }
function drag(t, x, y1, y2, d = .45) { sfx('swipe', t); tl.set('#touch', { left: x, top: y1, opacity: 0 }, t - .01).to('#touch', { opacity: 1, duration: .05 }, t).to('#touch', { top: y2, duration: d, ease: 'power1.inOut' }, t).to('#touch', { opacity: 0, duration: .12 }, t + d); }
const show = (id, t) => tl.set(id, { opacity: 1, visibility: 'visible' }, t);
const hide = (id, t) => tl.set(id, { opacity: 0, visibility: 'hidden' }, t);
const bannerIn = (id, t, out) => { sfx('ding', t); tl.fromTo(id, { y: -120, opacity: 1 }, { y: 0, duration: .45, ease: 'back.out(1.3)' }, t); if (out) tl.to(id, { y: -120, duration: .35, ease: 'power2.in' }, out); };
const haptic = (t, id = '#stage') => { sfx('buzz', t); if (FRAME) id = '#pwrap'; tl.to(id, { x: FRAME ? 7 : 2, duration: .03, yoyo: true, repeat: 5, ease: 'none' }, t).set(id, { x: 0 }, t + .2); };
const endCard = t => (sfx('logo', t), tl).fromTo('#endc', { opacity: 0 }, { opacity: 1, duration: .25 }, t).from('#endc img', { scale: .6, duration: .5, ease: 'back.out(2)' }, t);
const devPos = sel => { const d = $('#dev').getBoundingClientRect(), s = d.width / 390, r = $(sel).getBoundingClientRect(); return [(r.left - d.left) / s + r.width / s / 2, (r.top - d.top) / s + r.height / s / 2]; };
const center = devPos;
let sd = 5; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const FX = [];
function confetti(t0, n = 70) { sfx('win', t0); for (let i = 0; i < n; i++) { const el = document.createElement('div'); el.className = 'conf'; el.style.background = ['#1F6BFF', '#FFC83D', '#fff', '#FF7A2F'][i % 4]; $('#stage').appendChild(el); FX.push({ el, t0: t0 + rnd() * .2, x: 195 + (rnd() - .5) * 60, y: 300, vx: (rnd() - .5) * 500, vy: -300 - rnd() * 350, r: rnd() * 900 }); } }

const CUTS = {
day1() {
  DUR = 14;
  $('#stage').innerHTML = `<div class="app" id="home"><div class="scroll" id="sc">${homeHead()}${streakCard()}${chalCard()}
    <div class="card"><div class="cap">CREW ACTIVITY</div>
      <div class="row" style="margin-top:10px">${pfp('O', 30)}<div class="t15">Omar checked in <span class="t13">· 7:02 AM</span></div></div>
      <div class="row" style="margin-top:10px">${pfp('K', 30)}<div class="t15">Khalid hit 10k steps <span class="t13">· 9:15 AM</span></div></div></div></div>${tabbar('home')}
    <div class="dim" id="dim" style="opacity:0"></div>
    <div class="sheet" id="sheet"><div class="grab"></div><div class="row">${pfp('F', 40)}<div><div class="t17">Nudge Faisal</div><div class="t13">0 of 4 gym days this week</div></div></div>
      <div class="opt" id="o1">Your crew is waiting on you 👀</div><div class="opt" id="o2">The couch is not a workout 🛋️</div><div class="opt" id="o3">Don't break the streak 🔥</div>
      <div class="btn" id="send" style="margin-top:14px">Send nudge ⚡</div></div>
    <div class="toast" id="toast">⚡ Nudge sent to Faisal</div>
    ${banner('bn', 'CrewUp', 'Faisal checked in at the gym 💪 Crew: 4/4 active')}</div>`;
  N.st = 12;
  tl.set('#sheet', { y: 420 }, 0).set('#toast', { opacity: 0 }, 0).set('#bn', { y: -120 }, 0);
