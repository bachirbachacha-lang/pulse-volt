<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CrewUp Reels</title>
<style>
@font-face{font-family:Sora;src:url(fonts/sora-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Sora;src:url(fonts/sora-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Sora;src:url(fonts/sora-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Mont;src:url(fonts/montserrat-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-400-normal.woff2);font-weight:400;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-700-normal.woff2);font-weight:600 700;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-800-normal.woff2);font-weight:800;unicode-range:U+0600-06FF,U+0750-077F,U+FB50-FDFF,U+FE70-FEFF}
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#090B10;--b:#1F6BFF;--b2:#5B93FF;--o:#FF7A2F;--g:#FFC83D;--w:#fff;--mut:#9AA3B5;--card:#12161F;--line:#232a38;--red:#FF4D5E}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--w);font-family:Sora,Taj,"Noto Color Emoji",sans-serif}
.abs{position:absolute}
#bg{inset:0;background:radial-gradient(70% 45% at 50% 62%,rgba(31,107,255,.28),rgba(31,107,255,0) 70%),var(--bg)}
#dots{inset:-200px;background-image:radial-gradient(rgba(91,147,255,.16) 2px,transparent 2.5px);background-size:54px 54px}
.ov{left:0;right:0;text-align:center;padding:0 60px}
.hook{position:relative;z-index:12;font:800 92px/1.08 Sora;letter-spacing:-.03em}
.hook b{color:var(--b);text-shadow:0 0 40px rgba(31,107,255,.55)}
.hook .o{color:var(--o)}
.ar{font-family:Taj,Sora,"Noto Color Emoji";font-weight:800;direction:rtl;font-size:52px;line-height:1.35;color:#dfe6f5;margin-top:22px}
.cap{font:800 60px/1.1 Sora;letter-spacing:-.02em;z-index:12;text-shadow:0 4px 30px rgba(9,11,16,.9)}
.cap b{color:var(--b)}
.cap .ar{font-size:44px;margin-top:12px}
.pill{display:inline-block;background:var(--b);color:#fff;font:800 40px/1 Mont;padding:18px 34px 16px;border-radius:999px;letter-spacing:.04em;box-shadow:0 0 40px rgba(31,107,255,.6)}
#corner{left:50px;top:80px;display:flex;align-items:center;gap:14px;z-index:20}
#corner span{font:700 22px/1 Sora;color:#c9d3e8;letter-spacing:.08em;border:2px solid rgba(201,211,232,.3);padding:10px 14px;border-radius:10px;background:rgba(0,0,0,.35)}
.logo{width:64px;height:64px;border-radius:18px;background:var(--b);display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(31,107,255,.5);flex:none}
.logo{overflow:hidden}.logo img{width:108%;height:108%;object-fit:cover;display:block}
/* phone */
.phone{left:250px;top:620px;width:580px;height:1180px;border-radius:72px;background:#000;padding:16px;box-shadow:0 0 0 3px #2a3142,0 60px 140px rgba(0,0,0,.7),0 0 160px rgba(31,107,255,.3)}
.scr{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:#0d1017;padding:64px 28px 0}
.sb{position:absolute;left:44px;right:44px;top:24px;display:flex;justify-content:space-between;font:700 22px/1 Sora;color:#cfd6e4}
.apphd{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
.apphd .nm{display:flex;align-items:center;gap:12px;font:800 34px/1 Sora}
.apphd .logo{width:52px;height:52px;border-radius:15px}
.me{width:56px;height:56px;border-radius:50%;background:#2a3348;display:flex;align-items:center;justify-content:center;font:800 24px Sora}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px 24px;margin-top:20px;position:relative}
.lbl{font:700 20px/1 Sora;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.streak{display:flex;align-items:center;gap:18px;margin-top:10px}
.streak .fire{font-size:84px;line-height:1;filter:drop-shadow(0 0 20px rgba(255,122,47,.8))}
.streak .n{font:800 96px/1 Sora;color:var(--o);text-shadow:0 0 30px rgba(255,122,47,.5)}
.streak .d{font:700 26px/1.2 Sora;color:#ffd7bf}
.ch h3{font:800 30px/1.2 Sora}
.ch .sub{font:600 22px/1.3 Sora;color:var(--mut);margin-top:6px}
.fr{display:flex;align-items:center;gap:14px;margin-top:16px}
.av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 24px Sora;color:#08101f;flex:none}
.fr .name{font:700 26px/1 Sora;width:120px}
.fr .dots{display:flex;gap:8px;flex:1}
.fr .dots i{width:34px;height:34px;border-radius:10px;background:#1c2230;border:1px solid var(--line)}
.fr .dots i.on{background:var(--b);border-color:var(--b);box-shadow:0 0 14px rgba(31,107,255,.6)}
.fr .st{font:700 22px Sora;color:var(--mut);width:70px;text-align:right}
.fr .st.bad{color:var(--red)}
.nbtn{display:inline-flex;align-items:center;gap:6px;background:var(--b);color:#fff;font:800 20px Sora;padding:10px 14px;border-radius:14px}
.bigbtn{margin-top:20px;background:var(--b);border-radius:24px;text-align:center;font:800 34px/1 Sora;padding:28px 0;box-shadow:0 0 40px rgba(31,107,255,.5)}
.toast{position:absolute;left:24px;right:24px;top:70px;background:rgba(30,36,52,.96);border:1px solid #33405a;border-radius:26px;padding:20px 22px;display:flex;gap:16px;align-items:center;box-shadow:0 20px 50px rgba(0,0,0,.5);z-index:5}
.toast .logo{width:60px;height:60px;border-radius:16px}
.toast .t{font:700 20px/1.2 Sora;color:var(--mut)}
.toast .m{font:700 26px/1.3 Sora;color:#fff;margin-top:4px}
.tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(255,255,255,.35);border:4px solid #fff;z-index:9}
/* lock screen */
.lock{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,#1b2a55,#0a0e1a 70%);text-align:center;padding-top:150px}
.lock .tm{font:600 190px/1 Sora;letter-spacing:-.04em}
.lock .dt{font:600 30px Sora;color:#c9d3e8;margin-top:10px}
.lock .nt{position:absolute;left:22px;right:22px;background:rgba(235,240,255,.16);backdrop-filter:blur(10px);border-radius:28px;padding:20px 22px;display:flex;gap:16px;text-align:left;align-items:center}
.lock .nt .logo{width:62px;height:62px;border-radius:16px}
.lock .nt .t{font:700 20px/1.2 Sora;color:#d5dcec;display:flex;justify-content:space-between}
.lock .nt .m{font:700 27px/1.3 Sora;color:#fff;margin-top:4px}
/* results */
.rk{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.rk .p{font:800 30px Sora;width:44px;color:var(--mut)}
.rk .name{font:700 30px Sora;flex:1}
.rk .sc{font:800 28px Sora}
.rk.loser{background:rgba(255,77,94,.12);border-radius:18px;padding:16px 12px;border:none;margin-top:8px}
.rk.loser .sc,.rk.loser .p{color:var(--red)}
.stamp{position:absolute;border:8px solid var(--red);color:var(--red);font:800 66px/1 Mont;padding:20px 30px 14px;border-radius:18px;letter-spacing:.04em;text-align:center;background:rgba(9,11,16,.82);box-shadow:0 0 50px rgba(255,77,94,.4);z-index:6}
/* check-in post */
.post .who{display:flex;align-items:center;gap:14px}
.post .who b{font:800 28px Sora}.post .who span{font:600 20px Sora;color:var(--mut)}
.photo{margin-top:16px;height:470px;border-radius:22px;position:relative;overflow:hidden;background:linear-gradient(180deg,#3b2f2a 0%,#5a463c 55%,#2b211d 100%)}
.photo .em{position:absolute;font-size:150px;line-height:1}
.photo .live{position:absolute;left:16px;top:16px;font:800 18px Sora;background:rgba(0,0,0,.55);padding:8px 12px;border-radius:10px;letter-spacing:.1em}
.post .capt{font:700 28px/1.3 Sora;margin-top:16px}
.post .meta{font:600 21px Sora;color:var(--mut);margin-top:6px}
.doubt{margin-top:18px;display:flex;align-items:center;justify-content:space-between;background:#1a1f2b;border-radius:20px;padding:16px 20px;font:800 28px Sora}
.doubt .c{color:var(--g)}
/* excuses */
.ex{left:80px;right:80px;top:640px;background:var(--card);border:2px solid var(--line);border-radius:40px;padding:50px 50px 46px}
.ex .q{font:800 64px/1.15 Sora;letter-spacing:-.02em}
.ex .ar{font-size:46px;margin-top:16px;text-align:right}
.ex .score{display:flex;align-items:flex-end;gap:16px;margin-top:40px}
.ex .score .n{font:800 150px/.9 Mont}
.ex .score .of{font:800 52px/1 Mont;color:var(--mut);padding-bottom:12px}
.ex .bar{height:22px;border-radius:11px;background:#1c2230;margin-top:30px;overflow:hidden}
.ex .bar i{display:block;height:100%;width:0;border-radius:11px}
.ex .verdict{font:800 40px/1.2 Sora;margin-top:24px}
/* showcase bits */
.big{font:800 120px/1 Mont;letter-spacing:-.02em}
.rank{display:inline-flex;flex-direction:column;align-items:center;gap:14px;width:200px}
.rank .hex{width:170px;height:190px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:flex;align-items:center;justify-content:center;font:800 64px Mont;color:#0b0f18}
.rank b{font:800 30px Sora}
.pcard{left:250px;top:560px;width:580px;height:860px;border-radius:44px;background:linear-gradient(160deg,#1F6BFF 0%,#1446b8 45%,#0c1a3d 100%);border:3px solid #6e9cff;box-shadow:0 0 120px rgba(31,107,255,.6);padding:44px;overflow:hidden}
.pcard .shine{position:absolute;inset:-50%;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.28) 50%,rgba(255,255,255,0) 60%)}
.vs{display:flex;align-items:center;gap:20px;font:800 34px Sora}
.vs .bar{flex:1;height:44px;border-radius:22px;background:#1c2230;overflow:hidden;display:flex}
.cf{position:absolute;width:18px;height:30px;border-radius:4px;z-index:15}
.emo{position:absolute;font-size:90px;line-height:1;z-index:15}
#flash{inset:0;background:#cfe0ff;mix-blend-mode:screen;opacity:0;z-index:30}
#fade{inset:0;background:#000;z-index:31}
.end{top:640px}
.end .logo{width:220px;height:220px;border-radius:60px;margin:0 auto;box-shadow:0 0 100px rgba(31,107,255,.7)}
.end .wm{font:800 140px/1 Sora;letter-spacing:-.04em;margin-top:44px}
.end .tag{font:700 44px/1.3 Sora;color:#cfd8ea;margin-top:20px}
.end .cta{display:inline-block;margin-top:50px;background:var(--b);font:800 44px/1.2 Sora;padding:28px 44px;border-radius:30px;box-shadow:0 0 60px rgba(31,107,255,.6)}
.end .h{font:700 36px Sora;color:var(--b2);margin-top:30px}
</style>
</head>
<body>
<div id="bg" class="abs"></div><div id="dots" class="abs"></div>
<div id="stage" class="abs" style="inset:0"></div>
<div id="corner" class="abs"><div class="logo" id="cl"></div><span>APP PREVIEW · CONCEPT</span></div>
<div id="flash" class="abs"></div><div id="fade" class="abs"></div>
<script src="lib/gsap.min.js"></script>
<script>
const CUT = new URLSearchParams(location.search).get('cut') || 'day1';
const $ = s => document.querySelector(s);
const LOGO = `<img src="img/crewup-logo.png" alt="">`;
$('#cl').innerHTML = LOGO;
const AVC = { O: '#5B93FF', K: '#FFC83D', F: '#FF7A2F', Y: '#c9d3e8', S: '#7ee0b0' };
const av = (l, s = 52) => `<div class="av" style="width:${s}px;height:${s}px;font-size:${s * .45}px;background:${AVC[l] || '#9aa3b5'}">${l}</div>`;
const sb = (t = '9:41') => `<div class="sb"><span>${t}</span><span>●●● ▮</span></div>`;
const appHead = `<div class="apphd"><div class="nm"><div class="logo">${LOGO}</div>CrewUp</div><div class="me">Y</div></div>`;
const toast = (id, who, msg, top = 70) => `<div class="toast" id="${id}" style="top:${top}px"><div class="logo">${LOGO}</div><div><div class="t">CrewUp · now</div><div class="m">${msg}</div></div></div>`;
const endCard = (q, qar) => `<div class="abs ov end" id="end"><div class="logo">${LOGO}</div><div class="wm">CrewUp</div>
  <div class="tag">Gym with your crew, not alone.</div><div class="ar" style="font-size:44px">تمرّن مع شلتك، مو لحالك</div>
  <div class="cta">${q}</div>${qar ? `<div class="ar" style="font-size:42px">${qar}</div>` : ''}<div class="h">@getcrewup</div></div>`;
const N = {};              // numbers animated by GSAP, written in renderAt
const FX = [];             // time-based particles: {t0, els, kind}
let sd = 11; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
function burst(kind, t0, n, opts = {}) {
  const box = document.createElement('div'); box.className = 'abs'; box.style.inset = 0; box.style.pointerEvents = 'none'; $('#stage').appendChild(box);
  const parts = [];
  for (let i = 0; i < n; i++) {
    const el = document.createElement('div');
    if (kind === 'confetti') { el.className = 'cf'; el.style.background = ['#1F6BFF', '#FFC83D', '#fff', '#FF7A2F', '#5B93FF'][i % 5]; }
    else { el.className = 'emo'; el.textContent = opts.emoji[i % opts.emoji.length]; }
    box.appendChild(el);
    parts.push({ el, x: (opts.x ?? 540) + (rnd() - .5) * (opts.spread ?? 200), vx: (rnd() - .5) * (opts.vx ?? 1400), vy: -(opts.vy ?? 1500) * (.5 + rnd() * .7), r: rnd() * 720 - 360, d: rnd() * .4 });
  }
  FX.push({ t0, parts, kind, y: opts.y ?? 1000, life: opts.life ?? 2.6 });
}
function fx(t) {
  for (const f of FX) for (const p of f.parts) {
    const k = t - f.t0 - p.d;
    if (k < 0 || k > f.life) { p.el.style.opacity = 0; continue; }
    const g = f.kind === 'confetti' ? 2600 : 1400;
    const x = p.x + p.vx * k, y = f.y + p.vy * k + .5 * g * k * k;
    p.el.style.opacity = Math.min(1, (f.life - k) / .5);
    p.el.style.transform = `translate(${x}px,${y}px) rotate(${p.r * k}deg)`;
  }
}
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
const tapAt = (id, t, x, y) => tl.fromTo(id, { left: x, top: y, opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: .25 }, t).to(id, { scale: .75, duration: .12, yoyo: true, repeat: 1 }, t + .25).to(id, { opacity: 0, duration: .2 }, t + .6);
const ctr = sel => { const el = $(sel); let x = el.offsetWidth / 2, y = el.offsetHeight / 2, e = el; while (e && !e.classList.contains('scr')) { x += e.offsetLeft; y += e.offsetTop; e = e.offsetParent; } return [x, y]; };
const pop = (id, t, from = {}) => tl.fromTo(id, { opacity: 0, y: 50, scale: .92, ...from }, { opacity: 1, y: 0, scale: 1, duration: .4 }, t);
const out = (id, t) => tl.to(id, { opacity: 0, y: -40, duration: .3, ease: 'power2.in' }, t);
const punch = (id, t, s = 1.12) => tl.fromTo(id, { scale: s }, { scale: 1, duration: .5, ease: 'power3.out' }, t);
const flash = t => tl.to('#flash', { opacity: .7, duration: .06, yoyo: true, repeat: 1 }, t);
const shake = (id, t, n = 8, a = 18) => tl.to(id, { x: a, duration: .04, yoyo: true, repeat: n, ease: 'none' }, t).set(id, { x: 0 }, t + .04 * (n + 1));
let DUR = 12;

const CUTS = {
/* 1 — Day 1 of building an app so my friends can't skip the gym */
day1() {
  DUR = 15;
  $('#stage').innerHTML = `
  <div class="abs ov" id="h" style="top:230px"><div class="pill">DAY 1</div>
    <div class="hook" style="margin-top:34px">building an app so my friends <b>can't skip the gym</b></div>
    <div class="ar">اليوم ١: أبني تطبيق عشان ربعي ما يهربون من الجيم</div></div>
  ${['🔥 <b>Streaks</b> nobody wants to break|ستريك محد يبي يكسره', '🏋️ <b>Challenges</b> with your crew|تحديات مع الشلة', '⚡ Slacking? <b>Nudge</b> them|واحد يكسل؟ انكزه'].map((s, i) => { const [e, a] = s.split('|'); return `<div class="abs ov cap" id="c${i}" style="top:260px">${e}<div class="ar">${a}</div></div>`; }).join('')}
  <div class="abs phone" id="ph"><div class="scr" id="scr">${sb()}${appHead}
    <div class="card"><div class="lbl">Your streak</div><div class="streak"><span class="fire" id="fire">🔥</span><span class="n" data-n="st">0</span><span class="d">days<br>in a row</span></div></div>
    <div class="card ch" id="chal"><div class="lbl">This week</div><h3 style="margin-top:10px">Gym 4x per week</h3><div class="sub">Loser buys everyone coffee ☕</div>
      ${[['O', 'Omar', 4], ['K', 'Khalid', 3], ['Y', 'You', 3], ['F', 'Faisal', 0]].map(([l, n, k], i) => `<div class="fr" id="r${i}">${av(l)}<div class="name">${n}</div><div class="dots">${[0, 1, 2, 3].map(j => `<i id="d${i}${j}" class="${j < k ? 'on' : ''}"></i>`).join('')}</div>${i == 3 ? `<div class="nbtn" id="nb">⚡ Nudge</div>` : `<div class="st">${k}/4</div>`}</div>`).join('')}
    </div>
    ${toast('t1', '', '⚡ Nudge sent to Faisal 😴', 700)}
    <div class="tap" id="tap" style="opacity:0"></div></div></div>
  ${endCard('Would you use this? 👀', 'بتستخدمه؟ قولوا لي بالكومنتات')}`;
  pop('#h', 0, { y: 0, scale: 1.15 }); out('#h', 2.3);
  tl.fromTo('#ph', { y: 900, rotate: 6 }, { y: 0, rotate: 0, duration: .9, ease: 'power4.out' }, 1.2);
  pop('#c0', 2.5); out('#c0', 5.0);
  tl.to(N, { st: 12, duration: 1.4, ease: 'power2.out' }, 2.7).fromTo('#fire', { scale: .6 }, { scale: 1, duration: .6, ease: 'elastic.out(1,.4)' }, 3.9);
  tl.to('#ph', { scale: 1.12, y: 60, duration: 1.2, ease: 'power2.inOut' }, 2.6);
  pop('#c1', 5.2); out('#c1', 8.3);
  tl.to('#ph', { y: -150, scale: 1.12, duration: 1.2, ease: 'power3.inOut' }, 5.2);
  tl.from('#chal .fr', { opacity: 0, x: 60, stagger: .15, duration: .4 }, 5.6);
  pop('#c2', 8.5); out('#c2', 11.2);
  tl.to('#ph', { y: -100, scale: 1.18, x: -40, duration: 1, ease: 'power3.inOut' }, 8.5);
  tapAt('#tap', 9.6, ...ctr('#nb'));
  tl.to('#nb', { scale: .85, duration: .1, yoyo: true, repeat: 1 }, 9.85);
  tl.fromTo('#t1', { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: .45, ease: 'back.out(1.6)' }, 10.0);
  flash(9.9);
  tl.to('#ph', { opacity: 0, scale: .9, duration: .4 }, 11.4);
  pop('#end', 11.7);
},

/* 2 — POV: your friend nudges you at 6am */
nudge() {
  DUR = 13;
  const nt = (id, top, msg, ago = 'now') => `<div class="nt" id="${id}" style="top:${top}px"><div class="logo">${LOGO}</div><div style="flex:1"><div class="t"><span>CREWUP</span><span>${ago}</span></div><div class="m">${msg}</div></div></div>`;
  $('#stage').innerHTML = `
  <div class="abs ov" id="h" style="top:230px"><div class="hook">POV: your friend nudges you at <b>6am</b></div><div class="ar">لما خويك ينكزك الساعة ٦ الصبح</div></div>
  <div class="abs ov cap" id="c0" style="top:170px">😴 “5 more minutes…”<div class="ar">خمس دقايق بس…</div></div>
  <div class="abs ov" id="up" style="top:380px"><div class="big" style="font-size:190px">GOT UP.</div><div class="ar" style="font-size:70px">قمت.</div></div>
  <div class="emo" id="run" style="left:0;top:880px;font-size:200px;z-index:16">🏃‍♂️💨</div>
  <div class="abs ov cap" id="c1" style="top:170px">Streak <b>saved.</b> 🔥<div class="ar">الستريك سليم</div></div>
  <div class="abs phone" id="ph"><div class="scr" style="padding:0">
    <div class="lock" id="lock">${sb('6:00')}<div class="tm">6:00</div><div class="dt">Thursday</div>
      ${nt('n1', 470, '⚡ Omar nudged you: Don\'t break the streak! 🔥12')}
      ${nt('n2', 640, '⚡ Khalid: The couch is not a workout 🛋️')}
      ${nt('n3', 810, '⚡ Faisal: Your crew is waiting on you 👀')}
    </div>
    <div class="abs" id="app" style="inset:0;background:#0d1017;padding:64px 28px 0;opacity:0">${sb('6:24')}${appHead}
