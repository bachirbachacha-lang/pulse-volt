<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>X engine lookdev</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<div id="bgdom"><div id="glow"></div><div id="glow2"></div></div>
<canvas id="gl" width="1080" height="1920"></canvas>
<div id="lines"></div><div id="endWrap"></div><div id="vig"></div>
<div id="flash"></div><div id="fade" style="opacity:0"></div>
<script src="../img/trailer-beat.js"></script>
<script src="lib/three.min.js"></script>
<script src="lib/CopyShader.js"></script><script src="lib/LuminosityHighPassShader.js"></script><script src="lib/FXAAShader.js"></script>
<script src="lib/EffectComposer.js"></script><script src="lib/RenderPass.js"></script><script src="lib/ShaderPass.js"></script><script src="lib/MaskPass.js"></script>
<script src="lib/UnrealBloomPass.js"></script><script src="lib/Reflector.js"></script>
<script src="lib/gsap.min.js"></script>
<script src="common.js"></script>
<script>
// lookdev: 4 crew phones lying on a black glass table, zigzag column (fits 9:16 from above)
X.DUR = 4;
const tl = X.tl;
const ctx = X.three({ fov: 40 });
X.studioEnv(ctx); X.lights(ctx);
X.mirrorFloor(ctx, 40, 0x2a2d35); X.floorFade(ctx, 3, 10);
const names = ['you', 'omar', 'khalid', 'faisal'], fin = ['blue', 'natural', 'black', 'white'];
const POS = { you: [-.55, 1.9, .05], omar: [.6, .7, -.08], khalid: [-.6, -.5, .1], faisal: [.55, -1.7, -.06] };
const pre = X.loadTex(['lock_you', 'lock_omar', 'lock_khalid', 'lock_faisal', 'app_you', 'ban_check_omar']);
const P = {};
pre.then(() => names.forEach((n, i) => {
  const p = P[n] = X.makePhone({ finish: fin[i], tex: X.T[n === 'you' ? 'app_you' : 'lock_' + n] });
  const [x, z, yaw] = POS[n]; p.g.position.set(x, X.PHONE.PD / 2 + .028, z); p.g.rotation.set(-Math.PI / 2 + .02, 0, yaw, 'XZY'); ctx.scene.add(p.g);
  if (n === 'faisal') p.dim.material.opacity = 1;
  const pool = X.pool(0x7aa6ff, 2.2, n === 'faisal' ? 0 : .35); pool.position.set(x, 0, z); ctx.scene.add(pool);
  const ring = X.floorRing(.95, 0x2b6bff, n === 'faisal' ? 0 : 2.2); ring.scale.set(.62, 1, 1); ring.position.set(x, 0, z); ctx.scene.add(ring);
  if (n === 'omar') { const b = p.overlay(X.T.ban_check_omar, 195, 140, 370); b.material.opacity = 1; }
}));
const dust = X.dust(1200, [6, 3.5, 6]); ctx.scene.add(dust);
X.onFrame(t => dust.userData.update(t));
X.mb = 0;
// views: top-down hero, oblique 3/4, low across the table (DOF), close on You's screen (DOF)
Object.assign(X.rig, { px: 0, py: 7.4, pz: .9, tx: 0, ty: 0, tz: .05, fov: 42 });
tl.set(X.rig, { px: 2.3, py: 2.5, pz: 3.8, tx: 0, ty: 0, tz: .3, fov: 40 }, 1.0)
  .set(X.rig, { px: -.25, py: .3, pz: 3.4, tx: .55, ty: .04, tz: -1.7, fov: 34 }, 2.0)
  .set(X.dof, { amt: .01, w: .06, cx: .5, cy: .5, nx: 0, ny: 1 }, 2.0)
  .set(X.rig, { px: -.2, py: 1.05, pz: 2.75, tx: -.55, ty: .04, tz: 1.75, fov: 32 }, 3.0)
  .set(X.dof, { amt: .012, w: .14, cx: .5, cy: .5, nx: 0, ny: 1 }, 3.0);
X.start(pre);
</script>
</body>
</html>
