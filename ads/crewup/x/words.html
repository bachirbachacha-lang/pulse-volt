<script>
const { tl, $ } = X;
X.DUR = 24.0;
const N = 70000;
const k01 = (t, a, b) => X.clamp((t - a) / (b - a));
const ctx = X.three({ fov: 50, bloom: .5, radius: .45, threshold: .9, ss: 1.5 });
const G = ctx.grade.uniforms; G.vignette.value = .36; G.grain.value = .02; G.lift.value.set(0, 0, 0); G.knee.value = .9; G.fringe.value = .0018; G.contrast.value = 1.03; G.sat.value = 1.06;
const GLOWB = { a: 0 };
ctx.drawBg = () => { const g = ctx.bg.getContext('2d'); g.fillStyle = '#060404'; g.fillRect(0, 0, 108, 192);
  const gr = g.createRadialGradient(54, 100, 0, 54, 100, 115); gr.addColorStop(0, `rgba(150,52,16,${GLOWB.a})`); gr.addColorStop(.55, `rgba(70,22,8,${GLOWB.a * .5})`); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = gr; g.fillRect(0, 0, 108, 192); ctx.bgTex.needsUpdate = true; };
// camera on an orbit: radius, azimuth, elevation around a target
const CAM = { r: 10, az: 0, el: 0, tx: 0, ty: 0, tz: 0, fov: 50, roll: 0 };
X.camFn = () => { const a = CAM.az * Math.PI / 180, e = CAM.el * Math.PI / 180;
  return { p: [CAM.tx + Math.sin(a) * Math.cos(e) * CAM.r, CAM.ty + Math.sin(e) * CAM.r, CAM.tz + Math.cos(a) * Math.cos(e) * CAM.r], q: [CAM.tx, CAM.ty, CAM.tz], fov: CAM.fov, roll: CAM.roll * Math.PI / 180 }; };

// ---------------------------------------------------------------- shapes (every one is N points)
let sd = 20251031; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const gauss = () => { let u = 0; while (!u) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * rnd()); };
const fill = fn => { const a = new Float32Array(N * 3); for (let i = 0; i < N; i++) { const p = fn(i); a[i * 3] = p[0]; a[i * 3 + 1] = p[1]; a[i * 3 + 2] = p[2]; } return a; };
const pick = (L, jit = 0) => fill(() => { const p = L[Math.floor(rnd() * L.length)]; return [p[0] + (rnd() - .5) * jit, p[1] + (rnd() - .5) * jit, p[2] + (rnd() - .5) * jit]; });
const canvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const PXU = 1920 / (2 * 10 * Math.tan(25 * Math.PI / 180));   // px per world unit on z = 0, seen from z = 10 at fov 50
// lit pixels of a drawing -> points; (cx, cy) is the drawing's centre, s = world units per pixel
const pixels = (w, h, draw, step, s, cx = w / 2, cy = h / 2, z = 0) => { const c = canvas(w, h), g = c.getContext('2d'); draw(g, w, h);
  const d = g.getImageData(0, 0, w, h).data, L = []; for (let y = 0; y < h; y += step) for (let x = 0; x < w; x += step) if (d[(y * w + x) * 4 + 3] > 130) L.push([(x - cx) * s, (cy - y) * s, z]); return L; };
const textAt = (lines, font, lh, step) => pixels(1080, 1920, g => { g.fillStyle = '#fff'; g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle'; const y0 = 960 - (lines.length - 1) * lh / 2; lines.forEach((l, i) => g.fillText(l, 540, y0 + i * lh)); }, step, 1 / PXU, 540, 960);
const tilt = (a, ax, ay) => { const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay); for (let i = 0; i < N; i++) { let x = a[i * 3], y = a[i * 3 + 1], z = a[i * 3 + 2]; let y2 = y * cx - z * sx, z2 = y * sx + z * cx; let x3 = x * cy + z2 * sy, z3 = -x * sy + z2 * cy; a[i * 3] = x3; a[i * 3 + 1] = y2; a[i * 3 + 2] = z3; } return a; };
const SH = {};
const buildShapes = () => {
  SH.prompt = pick(textAt(['make something so crazy', 'no one has ever seen it'], '600 56px Inter', 74, 2), .006);
  SH.galaxy = tilt(fill(i => { const arm = i % 3, u = Math.pow(rnd(), .62), r = .35 + 8.6 * u, th = arm * 2.0944 + r * .62 + gauss() * .2 * (1.25 - u); return [Math.cos(th) * r, gauss() * .26 * (1 - u * .7), Math.sin(th) * r]; }), 1.05, 0);
  SH.sphere = fill(i => {
    const m = i % 20;
    if (m < 13) { const k = i + .5, ph = Math.acos(1 - 2 * ((k * .6180339) % 1)), th = 3.8832 * k, r = 2.05 + gauss() * .025; return [r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)]; }
    if (m < 17) { const a = rnd() * 6.2832, r = 2.42 + gauss() * .04, x = Math.cos(a) * r, z = Math.sin(a) * r, y = gauss() * .025; return [x, y * .9 + z * .35, z * .94 - y * .35]; }
    if (m < 19) { const a = rnd() * 6.2832, r = 2.78 + gauss() * .035, x = Math.cos(a) * r, z = Math.sin(a) * r; return [x * .95 + z * .31, -x * .2, z * .93]; }
    const r = 1.9 * Math.cbrt(rnd()), v = [gauss(), gauss(), gauss()], l = Math.hypot(...v); return v.map(c => c / l * r); });
  // a phone with an app on it
  const ph = pixels(460, 940, g => {
    g.strokeStyle = '#fff'; g.fillStyle = '#fff'; g.lineWidth = 12; const rr = (x, y, w, h, r) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); };
    rr(8, 8, 444, 924, 70); g.stroke(); rr(170, 30, 120, 30, 15); g.fill();
    g.beginPath(); g.arc(70, 120, 26, 0, 6.3); g.fill(); g.fillRect(112, 104, 160, 14); g.fillRect(112, 128, 100, 10);
    g.globalAlpha = .55; rr(40, 180, 380, 300, 34); g.fill(); g.globalAlpha = 1; rr(40, 180, 380, 300, 34); g.lineWidth = 6; g.stroke();
    [520, 580, 640].forEach((y, i) => { g.fillRect(40, y, 380 - i * 70, 16); }); [700, 760].forEach(y => { g.beginPath(); g.arc(64, y + 18, 18, 0, 6.3); g.fill(); g.fillRect(100, y + 6, 240, 12); g.fillRect(100, y + 26, 150, 8); });
    rr(40, 830, 380, 70, 35); g.fill();
  }, 3, 2.35 / 460);
  const phE = []; for (let i = 0; i < 2000; i++) { const t = rnd(), side = Math.floor(rnd() * 4), w = 1.15, h = 2.36, z = (rnd() - .5) * .26; phE.push(side === 0 ? [-w + 2 * w * t, h, z] : side === 1 ? [-w + 2 * w * t, -h, z] : side === 2 ? [w, -h + 2 * h * t, z] : [-w, -h + 2 * h * t, z]); }
  SH.phone = fill(() => { const r = rnd(); if (r < .8) { const p = ph[Math.floor(rnd() * ph.length)]; return [p[0], p[1], .13]; } if (r < .94) return phE[Math.floor(rnd() * phE.length)]; const p = ph[Math.floor(rnd() * ph.length)]; return [p[0] * .98, p[1] * .98, -.13]; });
  // a small city of towers with lit windows
  const T = []; for (let gx = -3; gx <= 3; gx++) for (let gz = -3; gz <= 3; gz++) { if (rnd() < .16) continue; const d = Math.hypot(gx, gz) / 4.3; T.push([gx * .64, gz * .64, .21 + rnd() * .07, .4 + Math.pow(rnd(), 1.6) * 4.2 * Math.max(.15, 1 - d)]); }
  const tw = T.map(t => t[3] + .5), tot = tw.reduce((a, b) => a + b, 0);
  SH.city = fill(() => {
    if (rnd() < .1) { const al = (rnd() - .5) * 4.8, k = (Math.round((rnd() - .5) * 8) + .5) * .32; return rnd() < .5 ? [al, -2.1, k] : [k, -2.1, al]; }
    let q = rnd() * tot, j = 0; while (q > tw[j]) q -= tw[j++]; const [cx, cz, hw, h] = T[Math.min(j, T.length - 1)], f = Math.floor(rnd() * 6);
    if (f === 5) return [cx + (rnd() - .5) * 2 * hw, h - 2.1, cz + (rnd() - .5) * 2 * hw];
    const u = Math.round((rnd() - .5) * 2 * hw / .1) * .1, v = Math.round(rnd() * h / .14) * .14 - 2.1;
    return f === 0 ? [cx + u, v, cz + hw] : f === 1 ? [cx + u, v, cz - hw] : f === 2 ? [cx + hw, v, cz + u] : f === 3 ? [cx - hw, v, cz + u] : [cx + (rnd() < .5 ? hw : -hw), rnd() * h - 2.1, cz + (rnd() < .5 ? hw : -hw)];
  });
  // an open book, one page mid-turn, lines of text on every page
  const pageXY = (side, u, v, flip) => { const W = 2.05, H = 2.9; const x = u * W, y = (v - .5) * H, z = -.32 * Math.sin(Math.min(1, u * 1.15) * Math.PI / 2); if (flip) { const a = 2.05; return [side * x * Math.cos(a) * .98, y, x * Math.sin(a) * .98 + .05]; } return [side * x, y, z]; };
  const lineOn = (u, v) => { const row = Math.round((v - .1) / .062); if (Math.abs((v - .1) / .062 - row) > .17 || v > .92 || v < .08) return false; const w = X.hash(row * 7.7 + Math.floor(u * 9) * 3.1); return u > .08 && u < (row % 7 === 6 ? .5 : .93) && w > .12 && (u * 9) % 1 < .86; };
  SH.book = fill(() => { const r = rnd(); if (r < .1) { const side = rnd() < .5 ? -1 : 1, t = rnd(), e = Math.floor(rnd() * 3); return pageXY(side, e === 0 ? t : 1, e === 0 ? (rnd() < .5 ? 0 : 1) : t, false); }
    for (;;) { const u = rnd(), v = rnd(); if (!lineOn(u, v)) continue; const flip = r > .82; return pageXY(flip ? 1 : rnd() < .5 ? -1 : 1, u, v, flip); } });

  const bars = Array.from({ length: 7 }, (_, i) => [-1.86 + i * .62, .45 + i * .52 + (i === 3 ? -.35 : 0) + (i === 5 ? .2 : 0)]);
  SH.chart = fill(() => { const r = rnd(), B = -2.2;
    if (r < .08) return rnd() < .7 ? [-2.3 + rnd() * 4.6, B, .4] : [-2.3, B + rnd() * 4.4, .4];
    if (r < .2) { const k = rnd() * 6, i = Math.floor(k), f = k - i; const a = bars[i], b = bars[Math.min(6, i + 1)]; return [X.lerp(a[0], b[0], f), B + X.lerp(a[1], b[1], f) + .32, .25 + gauss() * .01]; }
    const [x, h] = bars[Math.floor(rnd() * 7)], w = .22, f = Math.floor(rnd() * 3);
    if (f === 0) return [x + (rnd() - .5) * 2 * w, B + rnd() * h, w];
    if (f === 1) { const e = Math.floor(rnd() * 4); return [x + (e & 1 ? w : -w), B + rnd() * h, e & 2 ? w : -w]; }
    return [x + (rnd() - .5) * 2 * w, B + h, (rnd() - .5) * 2 * w]; });
  // a sheet of code
  const CODE = ['function build(idea) {', '  const plan = think(idea);', '  for (const step of plan) {', '    make(step);', '    check(step);', '  }', '  return something.new;', '}'];
  SH.code = tilt(pick(pixels(900, 760, g => { g.fillStyle = '#fff'; g.font = '600 50px "JetBrains Mono"'; g.textBaseline = 'middle'; CODE.forEach((l, i) => g.fillText(l, 20, 60 + i * 90)); }, 2, 4.4 / 900), .008), -.32, -.22);
  SH.reveal = pick(textAt(['It starts', 'with words.'], '400 168px News', 178, 3), .006);
  SH.stars = fill(() => { const v = [gauss(), gauss(), gauss()], l = Math.hypot(...v), r = 13 + rnd() * 22; return v.map(c => c / l * r); });
};

// ---------------------------------------------------------------- the letter particles
const geo = new THREE.BufferGeometry();
const A = new Float32Array(N * 3), Bp = new Float32Array(N * 3), seed = new Float32Array(N), glyph = new Float32Array(N), hue = new Float32Array(N);
for (let i = 0; i < N; i++) { seed[i] = rnd(); glyph[i] = Math.floor(rnd() * 88); hue[i] = rnd() < .22 ? 1 : rnd() * .25; }
geo.setAttribute('position', new THREE.BufferAttribute(A, 3)); geo.setAttribute('pA', new THREE.BufferAttribute(A, 3)); geo.setAttribute('pB', new THREE.BufferAttribute(Bp, 3));
geo.setAttribute('seed', new THREE.BufferAttribute(seed, 1)); geo.setAttribute('glyph', new THREE.BufferAttribute(glyph, 1)); geo.setAttribute('hue', new THREE.BufferAttribute(hue, 1));
const U = { atlas: { value: null }, morph: { value: 0 }, time: { value: 0 }, swirl: { value: 1 }, size: { value: .052 }, scale: { value: 1000 }, bright: { value: .5 }, vis: { value: 0 }, orange: { value: 0 } };
const pmat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  vertexShader: `attribute vec3 pA; attribute vec3 pB; attribute float seed; attribute float glyph; attribute float hue;
    uniform float morph, time, swirl, size, scale;
    varying float vG; varying float vH; varying float vA;
    void main(){

      gl_PointSize = min(90.0, size * scale / max(0.05, -mv.z) * (0.75 + 0.5 * fract(seed * 13.7)) * (1.0 + 0.6 * s));
      vG = mod(glyph + floor(time * 14.0 + seed * 50.0) * step(0.02, s), 88.0);

  fragmentShader: `uniform sampler2D atlas; uniform float bright, vis, orange; varying float vG; varying float vH; varying float vA;
    void main(){

// ---------------------------------------------------------------- the story: [morph start, length, from, to, swirl, brightness]
// [morph start, length, from, to, swirl, brightness, letter size]: dense shapes get dimmer letters so they never burn to white
const ST = [[2.28, .95, 'prompt', 'galaxy', 2.4, .34, .07], [5.3, .7, 'galaxy', 'sphere', 1.3, .32, .06], [7.35, .55, 'sphere', 'phone', 1.0, .17, .05], [8.95, .55, 'phone', 'city', 1.0, .22, .05],
  [10.55, .55, 'city', 'book', 1.0, .17, .05], [12.15, .55, 'book', 'chart', 1.0, .2, .05], [13.75, .55, 'chart', 'code', 1.0, .11, .044], [15.35, .85, 'code', 'reveal', 1.5, .075, .04], [18.4, 1.3, 'reveal', 'stars', 2.6, .55, .06]];
let bound = -1;
const bind = i => { if (bound === i) return; bound = i; const [, , a, b] = ST[i]; A.set(SH[a]); Bp.set(SH[b]); geo.attributes.pA.needsUpdate = true; geo.attributes.pB.needsUpdate = true; geo.attributes.position.needsUpdate = true; };
const BR = { v: .1, sz: .06 };

// ---------------------------------------------------------------- camera moves
tl.set(CAM, { r: 10, az: 0, el: 0, tx: 0, ty: 0, tz: 0, fov: 50, roll: 0 }, 0)
  .to(CAM, { r: 13.5, az: 22, el: 18, duration: 1.0, ease: 'power2.out' }, 2.3)
  .to(CAM, { r: 5.2, az: 80, el: 7, roll: -6, duration: 2.0, ease: 'sine.inOut' }, 3.3)
  .to(CAM, { r: 11.2, az: 100, el: 10, roll: 0, duration: .7, ease: 'power2.inOut' }, 5.3)
  .to(CAM, { r: 10.4, az: 140, el: 14, duration: 1.35, ease: 'none' }, 6.0)
  .to(CAM, { r: 9.8, az: 336, el: 4, duration: .55, ease: 'power3.inOut' }, 7.35)
  .to(CAM, { az: 382, duration: 1.05, ease: 'none' }, 7.9)
  .to(CAM, { r: 11.2, az: 404, el: 27, ty: -.5, duration: .55, ease: 'power3.inOut' }, 8.95)
  .to(CAM, { az: 438, duration: 1.05, ease: 'none' }, 9.5)
  .to(CAM, { r: 9.4, az: 360, el: 9, ty: 0, duration: .55, ease: 'power3.inOut' }, 10.55)
