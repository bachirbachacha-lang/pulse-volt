<!doctype html>
<html lang="en">
<head>

<title>Stocks Concept Rebuild</title>

<style>
/* Rebuild of the owner's reference ad (dnyxstudios' "Stocks" app concept, 16:9), made at the owner's request
   ("the same exact one"; the creator gave them permission): same shots, text and cut times as the original,
   played over the original soundtrack (music + AI voice). Ends on the creator's "dnyxstudios" card; TikTok's
   watermark and end screen were added by TikTok, so they are left out. Layout follows x/simple-wide.html. */
html,body{width:1920px;height:1080px}
#gl{width:1920px;height:1080px}
#bg{position:absolute;inset:0;background-color:#fff}
#bgdom{opacity:0}
#gl{opacity:0}
#stage{position:absolute;inset:0;z-index:10;perspective:2200px}
.shot{position:absolute;inset:0;visibility:hidden;transform-style:preserve-3d}
.ink{color:#111114}
.tx{position:absolute;left:0;right:0;top:498px;text-align:center;font:600 66px/1.1 Inter;letter-spacing:-.03em}
.tx .w{display:inline-block;margin:0 .03em}
.mut{color:#8e8e93}
.up{color:#34C759}.dn{color:#FF3B30}
/* portfolio widget */
.wid{position:absolute;background:rgba(240,240,244,.94);border-radius:42px;box-shadow:0 30px 80px rgba(40,50,80,.16),0 2px 0 rgba(255,255,255,.9) inset;color:#1c1c1e}
.pill{display:inline-flex;align-items:center;justify-content:center;height:70px;border-radius:35px;background:#fafafc;font:500 26px Inter;color:#1c1c1e;box-shadow:0 2px 6px rgba(0,0,0,.04)}
/* finance wall */
#wall{position:absolute;left:-420px;top:-360px;width:2760px;height:1900px;display:grid;grid-template-columns:repeat(6,1fr);gap:30px;transform-style:preserve-3d}
.cc{background:#232326;border-radius:30px;padding:26px 28px;color:#f2f2f7;font:500 24px/1.3 Inter;overflow:hidden;border:1px solid rgba(255,255,255,.07)}
.src{font:600 18px Inter;color:#9a9aa1;margin-bottom:8px}
.hd{font:700 28px/1.22 Inter;color:#fff}
.phb{border-radius:16px;margin-top:16px;height:120px}
.tt{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 14px;font:600 26px Inter;margin-bottom:18px}
.tt .v{text-align:right;font-weight:500}
/* search + list */
#sbar{position:absolute;left:510px;right:510px;top:470px;height:92px;border-radius:46px;background:#2c2c2e;display:flex;align-items:center;padding:0 34px;gap:20px;font:500 34px Inter;color:#fff}
#sbar .ph{color:#8e8e93}
.row{position:absolute;left:500px;width:900px;height:140px;display:flex;align-items:center;gap:0}
.row .nm{font:600 36px Inter;color:#fff}.row .sb{font:500 26px Inter;color:#8e8e93;margin-top:6px}
.row .val{font:500 36px Inter;color:#fff;text-align:right}.row .dl{font:500 28px Inter;text-align:right;margin-top:6px}
/* stats grid */
.ring{position:absolute;width:442px;height:440px;background:#232326;border-radius:44px;border:1px solid rgba(255,255,255,.06);color:#fff}
.ring svg{position:absolute;left:125px;top:72px}
.ring b{position:absolute;left:0;right:0;top:142px;text-align:center;font:600 58px Inter;letter-spacing:-.02em}
.ring span{position:absolute;left:0;right:0;top:296px;text-align:center;font:500 34px Inter}
#grad{position:absolute;left:1097px;top:81px;width:707px;height:922px;border-radius:52px;overflow:hidden;color:#fff;text-align:center;
  background:linear-gradient(180deg,rgba(255,255,255,0) 52%,#f4f4f6 82%),linear-gradient(120deg,#ff3b55 0%,#f0287a 45%,#d81fa8 100%)}
#grad b{display:block;font:700 196px/1 Inter;letter-spacing:-.05em;margin-top:120px}
#grad div{font:500 36px/1.4 Inter;margin-top:26px}
#recap{position:absolute;left:182px;top:559px;width:784px;height:439px;border-radius:40px;overflow:hidden;color:#fff;text-align:center}
#recap .wv,#lap .wv{position:absolute;inset:0}
#lap{position:absolute;left:913px;top:506px;width:980px;height:450px;perspective:1400px}
/* widget + detail + filters */
#w9{position:absolute;left:677px;top:260px;width:562px;height:560px;border-radius:82px;background:#1c1c1e;color:#fff;padding:44px 46px;box-shadow:0 50px 110px rgba(0,0,0,.3);backface-visibility:hidden}
#w9 .r{display:flex;justify-content:space-between;padding:22px 0}
#w9 .r+.r{border-top:1px solid rgba(255,255,255,.12)}
#w9 .r b{font:600 44px Inter}#w9 .r small{display:block;font:500 36px Inter;color:#8e8e93;margin-top:6px}
#w9 .r .v{text-align:right}#w9 .r .v b{font-weight:500}#w9 .r .v small{color:#34C759}
#det{position:absolute;left:110px;top:470px;width:1020px;height:480px;border-radius:52px;background:#1c1c1e;color:#fff;padding:40px 46px;box-shadow:0 50px 110px rgba(0,0,0,.35);backface-visibility:hidden}
#flt{position:absolute;left:930px;top:210px;width:405px;height:566px;border-radius:44px;background:rgba(108,108,114,.84);backdrop-filter:blur(20px);color:#fff;padding:36px 34px;box-shadow:0 40px 100px rgba(0,0,0,.35)}
#flt .it{display:flex;gap:20px;align-items:center;font:500 27px Inter;margin:30px 0}
/* closing lines + title cards */
.ln{position:absolute;left:0;right:0;top:500px;text-align:center;font:600 72px/1.1 Inter;letter-spacing:-.03em;color:#111114;white-space:nowrap}
.ln .w{display:inline-block;margin:0 .12em}
#stk,#dnyx{position:absolute;left:0;right:0;top:494px;text-align:center;color:#fff;white-space:nowrap}
#stk{font:600 66px Inter;letter-spacing:-.02em}
#dnyx{font:600 88px Inter;letter-spacing:-.02em;text-shadow:0 0 18px rgba(255,255,255,.75),0 0 60px rgba(255,255,255,.35)}
#halo{position:absolute;left:460px;top:190px;width:1000px;height:700px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.34),rgba(255,255,255,.1) 50%,rgba(255,255,255,0))}
#noise{position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:60;opacity:0;pointer-events:none;image-rendering:pixelated}
</style>
</head>
<body>

    <div id="sbar"><svg width="40" height="40" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#8e8e93" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="#8e8e93" stroke-width="2.4" stroke-linecap="round"/></svg><span id="q"></span><span style="flex:1"></span><svg width="34" height="40" viewBox="0 0 20 24"><rect x="6" y="2" width="8" height="13" rx="4" fill="#8e8e93"/><path d="M3 11a7 7 0 0 0 14 0M10 18v4" stroke="#8e8e93" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>

    <div class="ring" style="left:606px;top:81px"><svg width="192" height="192" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#3a3a3c" stroke-width="3"/><circle id="rc2" cx="50" cy="50" r="44" fill="none" stroke="#f2f2f7" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="276.5" transform="rotate(-90 50 50)"/></svg><b id="rv2">0%</b><span>ROE</span></div>

    <div id="lap">
      <div id="lscr" style="position:absolute;left:470px;top:0;width:560px;height:380px;border-radius:20px;background:#0b0b0d;padding:12px;transform-origin:0 100%;transform:rotateY(-30deg) rotateX(6deg);box-shadow:0 30px 70px rgba(0,0,0,.45)"><div style="position:absolute;inset:12px;border-radius:10px;overflow:hidden"><div class="wv" id="wv2"></div></div></div>
      <div style="position:absolute;left:0;top:404px;width:980px;height:16px;border-radius:3px 3px 14px 14px;background:linear-gradient(#e6e7ea,#a9abb1 70%,#7d8086);transform:skewX(-8deg);box-shadow:0 12px 30px rgba(0,0,0,.35)"></div>
    </div>

  <div class="shot" id="s9">
    <div id="w9"></div>

  </div>
  <div class="shot" id="s10">
    <div class="ln" id="L1"><span class="w" id="L1a">No</span><span class="w" id="L1b">clutter.</span></div>
    <div class="ln" id="L2"><span class="w" id="L2a">No</span><span class="w" id="L2b">chaos.</span></div>
    <div class="ln" id="L3"><span class="w" id="L3a">Just</span><span class="w" id="L3b" style="color:#3a8ee6">simplicity.</span></div>
  </div>
  <div class="shot" id="s11">
    <div id="stk"><svg id="apl" width="54" height="64" viewBox="0 0 24 28" style="vertical-align:-6px;margin-right:16px"><path fill="#fff" d="M16.1 14.9c0-2.6 2.1-3.8 2.2-3.9-1.2-1.8-3.1-2-3.7-2-1.6-.2-3.1.9-3.9.9-.8 0-2.1-.9-3.4-.9-1.8 0-3.4 1-4.3 2.6-1.8 3.2-.5 7.9 1.3 10.5.9 1.3 1.9 2.7 3.3 2.6 1.3-.1 1.8-.9 3.4-.9 1.6 0 2 .9 3.4.8 1.4 0 2.3-1.3 3.2-2.6 1-1.5 1.4-2.9 1.4-3-.1 0-2.8-1.1-2.9-4.1zM13.5 7.1c.7-.9 1.2-2.1 1.1-3.3-1 0-2.3.7-3.1 1.6-.7.8-1.3 2-1.1 3.2 1.2.1 2.4-.6 3.1-1.5z"/></svg>Stocks</div>
    <div id="halo"></div>
    <div id="dnyx">dnyxstudios</div>
  </div>
</div>
<canvas id="noise" width="480" height="270"></canvas>

<script>
const { tl, $ } = X;
X.DUR = 23.0;
const show = (id, a, b) => tl.set('#' + id, { visibility: 'visible' }, a).set('#' + id, { visibility: 'hidden' }, b);
const words = (el, list) => { $(el).innerHTML = list.map(([w, c], i) => `<span class="w" id="${el.slice(1)}w${i}" style="${c || ''}">${w}</span>`).join(' '); };
const wIn = (id, i, t, d = .3) => tl.fromTo(`#${id}w${i}`, { opacity: 0, y: 26, filter: 'blur(16px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: d, ease: 'power3.out' }, t);
const mb = (f, t, amt, d = .16) => tl.fromTo('#' + f, { attr: { stdDeviation: '0 0' } }, { attr: { stdDeviation: amt }, duration: d, ease: 'power2.in', immediateRender: false }, t);
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));
// price line with a soft area under it (green up, red down), same shape every frame
const chart = (seed, up, w, h, area = true) => {
  let y = up ? h * .72 : h * .28; const p = [];
  for (let i = 0; i <= 40; i++) { y += (X.hash(seed * 17 + i) - (up ? .58 : .42)) * h * .14; y = Math.max(4, Math.min(h - 4, y)); p.push(`${(i * w / 40).toFixed(1)},${y.toFixed(1)}`); }
  const c = up ? '#34C759' : '#FF3B30';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">${area ? `<polygon points="0,${h} ${p.join(' ')} ${w},${h}" fill="${c}" opacity=".18"/>` : ''}<polyline points="${p.join(' ')}" fill="none" stroke="${c}" stroke-width="3" stroke-linejoin="round"/></svg>`;
};
// layered wave wallpaper (purple / magenta / pink / blue), used on the report card and the laptop screen
const waves = (id, w, h) => `<svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs>
  <linearGradient id="${id}0" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1678"/><stop offset="1" stop-color="#150c46"/></linearGradient>
  <linearGradient id="${id}1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b2bd8"/><stop offset=".6" stop-color="#b52fd6"/><stop offset="1" stop-color="#ff4fa0"/></linearGradient>
  <linearGradient id="${id}2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff3d6e"/><stop offset=".5" stop-color="#ff5fb8"/><stop offset="1" stop-color="#8f3cff"/></linearGradient>
  <linearGradient id="${id}3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f5cff"/><stop offset=".55" stop-color="#7b3cff"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
  <linearGradient id="${id}4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a59"/><stop offset="1" stop-color="#e0218a"/></linearGradient></defs>
  <rect width="${w}" height="${h}" fill="url(#${id}0)"/>
  <path d="M0 ${h * .38} C ${w * .22} ${h * .08}, ${w * .48} ${h * .62}, ${w * .72} ${h * .3} S ${w * .95} ${h * .05}, ${w} ${h * .12} L ${w} ${h} L 0 ${h} Z" fill="url(#${id}1)" opacity=".9"/>
  <path d="M0 ${h * .62} C ${w * .2} ${h * .35}, ${w * .45} ${h * .9}, ${w * .7} ${h * .55} S ${w * .92} ${h * .3}, ${w} ${h * .42} L ${w} ${h} L 0 ${h} Z" fill="url(#${id}2)" opacity=".85"/>
  <path d="M0 ${h * .82} C ${w * .25} ${h * .6}, ${w * .5} ${h * 1.05}, ${w * .75} ${h * .74} S ${w * .95} ${h * .6}, ${w} ${h * .66} L ${w} ${h} L 0 ${h} Z" fill="url(#${id}3)" opacity=".9"/>
  <path d="M${w * .35} ${h} C ${w * .5} ${h * .82}, ${w * .65} ${h * .95}, ${w * .85} ${h * .78} S ${w} ${h * .85}, ${w} ${h * .9} L ${w} ${h} Z" fill="url(#${id}4)" opacity=".7"/></svg>`;

// ---------- backgrounds ----------
const solid = c => ({ backgroundImage: 'none', backgroundColor: c });
tl.set('#bg', { backgroundImage: 'radial-gradient(120% 80% at 50% 45%,#ffffff 0%,#eef4ff 55%,#e2ecfb 100%)', backgroundColor: '#ffffff' }, 0)
  .set('#bg', { backgroundImage: 'radial-gradient(90% 80% at 50% 50%,#1d1311 0%,#0c0807 100%)', backgroundColor: '#0c0807' }, 3.58)
  .set('#bg', solid('#ffffff'), 5.76)
  .set('#bg', solid('#1c1c1e'), 7.72)
  .set('#bg', solid('#8d8e93'), 12.97).to('#bg', { backgroundColor: '#e5e5ea', duration: .6, ease: 'power2.out' }, 13.05)
  .set('#bg', { backgroundImage: 'radial-gradient(100% 70% at 50% 45%,#ebeaf0,#dedde4)', backgroundColor: '#e5e4ea' }, 17.72)
  .set('#bg', { backgroundImage: 'radial-gradient(90% 80% at 50% 50%,#22221d,#161613)', backgroundColor: '#1c1c18' }, 20.95);

// ---------- S1 "We've all been there..." ----------
words('#t1', [['We’ve'], ['all'], ['been'], ['there...']]);
show('s1', 0, 1.33);
[.08, .2, .32, .44].forEach((t, i) => wIn('t1', i, t));
tl.set('#s1', { filter: 'url(#mbA)' }, 1.1).to('#t1', { x: -220, opacity: 0, duration: .22, ease: 'power2.in' }, 1.11);
mb('mbAb', 1.1, '60 0', .2);
tl.set('#mbAb', { attr: { stdDeviation: '0 0' } }, 1.34).set('#s1', { filter: 'none' }, 1.34);

// ---------- S2 "Your Portfolio" widget, the balance types in ----------
show('s2', 1.34, 2.88);
tl.fromTo('#w2', { scale: .78, opacity: 0, filter: 'blur(22px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: .38, ease: 'power3.out' }, 1.36)
  .to('#w2', { scale: 1.05, duration: .8, ease: 'none' }, 1.74)
  .to('#w2', { scale: 1.32, opacity: 0, filter: 'blur(26px)', duration: .3, ease: 'power2.in' }, 2.56);

// ---------- S3 "but instead..." ----------
words('#t3', [['but'], ['instead...']]);
show('s3', 2.88, 3.58);
wIn('t3', 0, 2.9, .22); wIn('t3', 1, 3.03, .26);
tl.fromTo('#t3', { scale: 1.28 }, { scale: 1.45, duration: .52, ease: 'none' }, 2.9)
  .to('#t3', { opacity: 0, filter: 'blur(14px)', scale: 1.58, duration: .16, ease: 'power2.in' }, 3.42);

// ---------- S4 the noise: a wall of tickers, charts and market headlines ----------
const tick = (s, v, up) => `<span><span class="${up ? 'up' : 'dn'}" style="font-size:.8em;margin-right:4px">${up ? '▲' : '▼'}</span>${s}</span>`;
const tbl = `<div class="tt">${tick('AAPL', 0, 1)}<span class="v">229.00</span>${tick('NVDA', 0, 0)}<span class="v">119.37</span>${tick('MSFT', 0, 1)}<span class="v">417.14</span>${tick('QCOM', 0, 0)}<span class="v">175.30</span>${tick('TSLA', 0, 1)}<span class="v">213.97</span>${tick('T', 0, 0)}<span class="v">19.90</span></div>`;
const photo = g => `<div class="phb" style="background:${g}"></div>`;
const CARDS = [
  `<div class="src">MarketWatch</div><div class="hd">Tesla recalls some Model Y EVs, stock jumps toward 7-day win streak</div>${photo('linear-gradient(135deg,#a7b0ba,#46505c 55%,#cfd4da)')}`,
  `${tbl}<div class="src">Seeking Alpha</div><div class="hd">Apple reportedly acquired AR start-up Mira as it pushes new headset...</div>`,
  `<div style="font:600 30px Inter">${tick('AAPL', 0, 1)}</div><div class="mut">Apple Inc.</div><div style="display:grid;grid-template-columns:auto auto;gap:6px 30px;margin:16px 0;font:500 22px Inter"><span class="mut">Open</span><span>226.18</span><span class="mut">High</span><span>230.40</span><span class="mut">Low</span><span>225.72</span></div><div style="font:500 52px Inter">229.00</div>`,
  `<div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="font:500 40px Inter">229.00<div class="up" style="font-size:24px">+2.82</div></div></div><div style="margin-top:20px">${chart(3, 1, 360, 150)}</div>`,
  `<div style="display:flex;justify-content:space-between"><div><div style="font:600 28px Inter">${tick('AAPL', 0, 1)}</div><div class="mut">Apple Inc.</div></div><div style="text-align:right;font:500 28px Inter">229.00<div class="up" style="font-size:22px">+2.82</div></div></div><div style="margin:12px 0">${chart(5, 1, 360, 70, false)}</div><div class="src">CNBC</div><div class="hd">Apple to open first store in Malaysia as Asia expansion continues</div>`,

rollOut('L2a', 19.5); rollOut('L2b', 19.53); rollIn('L3a', 19.58, .26); rollIn('L3b', 19.63, .3);
tl.fromTo('#L3', { scale: 1 }, { scale: 1.28, duration: 1.15, ease: 'power2.in' }, 19.6)
  .set('#s10', { filter: 'url(#mbA)' }, 20.72).to('#L3', { x: -420, opacity: 0, duration: .22, ease: 'power2.in' }, 20.73);
mb('mbAb', 20.72, '70 0', .22);
tl.set('#mbAb', { attr: { stdDeviation: '0 0' } }, 20.96).set('#s10', { filter: 'none' }, 20.96);

// ---------- S12  Stocks, then dnyxstudios (the creator's card) ----------
show('s11', 20.95, 23.1);
tl.fromTo('#stk', { opacity: 0, scale: 1.04, filter: 'blur(8px)' }, { opacity: 1, scale: 1.14, filter: 'blur(0px)', duration: .3, ease: 'power2.out' }, 20.98)
  .to('#stk', { scale: 1.42, duration: .5, ease: 'none' }, 21.28)
  .to('#stk', { opacity: 0, scale: 1.5, filter: 'blur(14px)', duration: .14, ease: 'power2.in' }, 21.74)
  .fromTo('#dnyx', { opacity: 0, scale: .92, filter: 'blur(12px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: .25, ease: 'power2.out' }, 21.82)
  .fromTo('#halo', { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .5, ease: 'power2.out' }, 21.82)
  .to('#dnyx', { scale: 1.38, duration: 1.0, ease: 'none' }, 22.07)
  .to('#halo', { scale: 1.3, duration: 1.0, ease: 'none' }, 22.07)
  .to('#fade', { opacity: 1, duration: .12, ease: 'none' }, 22.88);

// ---------- per frame: the typed balance, typing, rings, counters, static, 3D shot ----------
const gl = $('#gl');
X.onFrame(t => {
  const k = (a, b) => X.clamp((t - a) / (b - a));
  const eo = x => 1 - Math.pow(1 - x, 3);
  const cash = '$1,025.67'; $('#cash').textContent = cash.slice(0, Math.ceil(cash.length * k(1.48, 2.06)));
  const q = 'Apple Inc.', n = Math.floor(q.length * k(8.3, 8.9));
  $('#q').innerHTML = n ? q.slice(0, n) + (t < 9 && Math.floor(t * 4) % 2 ? '|' : '') : '<span class="ph">Search</span>';
  $('#rc1').setAttribute('stroke-dashoffset', 276.5 * (1 - .78 * eo(k(11.45, 12.1)))); $('#rv1').textContent = Math.round(12 * eo(k(11.45, 12.0))) + '%';
  $('#rc2').setAttribute('stroke-dashoffset', 276.5 * (1 - .78 * eo(k(11.5, 12.15)))); $('#rv2').textContent = Math.round(55 * eo(k(11.5, 12.05))) + '%';
  $('#gv').textContent = Math.round(100 * eo(k(11.45, 11.95))) + 'k';
  if (t >= 3.58 && t < 3.76) noiseFrame(Math.floor(t * 30));
  // 3D phone in ribbons
  const on = t >= 5.76 && t < 7.74;
  gl.style.opacity = on ? 1 : 0;
  if (!on) return;
  phoneRoot.position.set(0, -2.6 * (1 - R5.rise) + .04 * Math.sin(t * 1.6), 0);
  phoneRoot.rotation.set(-.2 + .15 * R5.flat, -.35 + .5 * R5.spin, -.6 + 1.02 * R5.rise + 1.15 * R5.flat);
  ribbons.rotation.y = .3 * (t - 5.8); ribbons.rotation.z = .1 * R5.rise - .25 * R5.flat;
  ribbons.position.y = phoneRoot.position.y * .9;
  RIB.forEach((m, i) => { const cnt = m.geometry.index.count, d = Math.floor(cnt * X.clamp(R5.rib * 1.25 - i * .07)); m.geometry.setDrawRange(0, d - (d % 6)); });
  ctx.cam.position.set(Math.sin(-.25 + .5 * R5.spin) * (5.4 - 2.6 * R5.push), .25 - .3 * R5.flat, Math.cos(-.25 + .5 * R5.spin) * (5.4 - 2.6 * R5.push));
  ctx.cam.lookAt(0, 0, 0); ctx.cam.updateMatrixWorld();
  ctx.render(t);
});
// the canvas screen needs the real font before it is drawn
X.start(document.fonts.ready.then(() => Promise.all(['700 86px Inter', '600 58px Inter'].map(f => document.fonts.load(f)))).then(() => {
  const P = X.makePhone({ finish: 'black', tex: X.canvasTex(1170, 2460, drawScreen) }); phoneRoot.add(P.g);
}));
</script>
