<style>
/* CrewUp version of the owner's reference concept ad (light keynote UI, chaos wall, 3D phone + ribbons,
   search, crew list, stats, widget, detail + filters, kinetic text), vertical, then the favourite ending */
#bg{position:absolute;inset:0;background-color:#fff}
#bgdom{opacity:0}
#gl{opacity:0}
#stage{position:absolute;inset:0;z-index:10;perspective:2200px}
.shot{position:absolute;inset:0;visibility:hidden;transform-style:preserve-3d}
.ink{color:#0f1115}
.tx{position:absolute;left:0;right:0;top:880px;text-align:center;font:600 76px/1.1 Inter;letter-spacing:-.035em}
.tx .w{display:inline-block;margin:0 .12em}
/* light glass widget */
.wid{position:absolute;background:rgba(255,255,255,.86);border-radius:44px;box-shadow:0 30px 80px rgba(40,60,110,.18),0 2px 0 rgba(255,255,255,.9) inset;padding:40px 44px;color:#0f1115}
.pill{display:inline-flex;align-items:center;justify-content:center;height:62px;padding:0 34px;border-radius:31px;background:#eef1f6;font:600 26px Inter;color:#0f1115}
/* dark cards */
.dk{position:absolute;background:#17181c;border-radius:40px;color:#fff;box-shadow:0 40px 90px rgba(0,0,0,.35)}
.mut{color:#8d93a1}
.up{color:#30D158}.dn{color:#FF453A}
/* chaos wall */
#wall{position:absolute;left:-260px;top:-180px;width:1600px;height:2300px;display:grid;grid-template-columns:repeat(4,1fr);gap:34px;transform-style:preserve-3d}
.cc{background:#121317;border-radius:34px;padding:28px;color:#e8eaf0;font:500 24px/1.35 Inter;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.cc h4{font:700 26px Inter;margin-bottom:14px}
.bub{display:inline-block;background:#2a2c33;border-radius:22px;padding:10px 18px;margin:6px 0;font:500 24px Inter}
.bub.me{background:#1F6BFF;float:right;clear:both}
/* search + list */
#sbar{position:absolute;left:110px;right:110px;top:820px;height:104px;border-radius:52px;background:#2a2b30;display:flex;align-items:center;padding:0 40px;gap:22px;font:500 38px Inter;color:#fff}
#sbar .ph{color:#8d93a1}
.row{position:absolute;left:80px;right:80px;height:150px;display:flex;align-items:center;gap:26px;border-bottom:1px solid rgba(255,255,255,.08)}
.row .nm{font:700 40px Inter}.row .sb{font:500 26px Inter;color:#8d93a1;margin-top:6px}
.row .val{font:700 42px Inter;text-align:right}.row .dl{font:600 28px Inter;text-align:right;margin-top:4px}
/* stats */
.ring{position:absolute;width:300px;height:300px;background:#17181c;border-radius:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.ring b{font:800 54px Inter;letter-spacing:-.02em}.ring span{font:700 22px Inter;letter-spacing:.08em;color:#8d93a1;margin-top:8px}
#grad{position:absolute;left:470px;top:470px;width:530px;height:640px;border-radius:52px;overflow:hidden;background:linear-gradient(160deg,#ff9a3c 0%,#ff4d6d 55%,#d83fd8 100%);box-shadow:0 40px 90px rgba(255,77,109,.35);color:#fff;padding:46px}
#grad b{display:block;font:800 220px/1 Sora;letter-spacing:-.06em}
#recap{position:absolute;left:80px;top:1150px;width:920px;height:420px;border-radius:52px;overflow:hidden;color:#fff;padding:50px;
  background:radial-gradient(60% 90% at 15% 85%,#ff4fd8 0%,rgba(255,79,216,0) 60%),radial-gradient(70% 80% at 85% 15%,#1F6BFF 0%,rgba(31,107,255,0) 60%),radial-gradient(50% 70% at 70% 90%,#ff7a2f 0%,rgba(255,122,47,0) 60%),linear-gradient(120deg,#3b1d8f,#1b2f9e 50%,#7b2fd6)}
#recap svg{position:absolute;inset:0;opacity:.55;mix-blend-mode:screen}
/* widget + detail + filters */
#w9{position:absolute;left:250px;top:620px;width:580px;height:580px;border-radius:84px;background:#141519;color:#fff;padding:54px 56px;box-shadow:0 50px 110px rgba(0,0,0,.35);backface-visibility:hidden}
#w9 .r{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:46px}
#w9 .r b{font:700 40px Inter}#w9 .r small{display:block;font:500 24px Inter;color:#8d93a1;margin-top:4px}
#det{position:absolute;left:60px;top:640px;width:960px;height:600px;border-radius:64px;background:#141519;color:#fff;padding:52px;box-shadow:0 50px 110px rgba(0,0,0,.35);backface-visibility:hidden}
#flt{position:absolute;left:600px;top:500px;width:430px;height:720px;border-radius:52px;background:rgba(92,94,102,.82);backdrop-filter:blur(20px);color:#fff;padding:44px 40px;box-shadow:0 40px 100px rgba(0,0,0,.4)}
#flt .it{display:flex;gap:20px;align-items:center;font:500 30px Inter;margin:30px 0}
#flt .it i{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.75)}
/* ending tweaks for this cut */
#handle.pillh{left:270px;right:270px;top:1580px;height:84px;border-radius:42px;background:#fff;color:#0d0f14;display:flex;align-items:center;gap:16px;padding:0 30px;font:700 34px Inter;box-shadow:0 0 0 4px #1F6BFF,0 0 50px rgba(31,107,255,.6)}
#soon{position:absolute;left:0;right:0;top:1700px;text-align:center;font:600 30px Inter;color:#8d97ad;z-index:31}
#noise{position:absolute;left:0;top:0;width:1080px;height:1920px;z-index:60;opacity:0;pointer-events:none;image-rendering:pixelated}
#tag{z-index:65}
#tag span{color:#e9edf5;background:rgba(10,12,18,.55);border-color:rgba(255,255,255,.18)}
</style>
</head>
<body>

<div id="stage">

      <div style="display:flex;justify-content:space-between;font:600 30px Inter"><span>Gym membership</span><span class="mut" style="font-weight:500">renews monthly</span></div>

  <div class="shot" id="s6">
    <div id="sbar"><svg width="40" height="40" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="#8d93a1" stroke-width="2.4"/><path d="M15.5 15.5 21 21" stroke="#8d93a1" stroke-width="2.4" stroke-linecap="round"/></svg><span id="q"></span><span style="flex:1"></span><svg width="34" height="40" viewBox="0 0 20 24"><rect x="6" y="2" width="8" height="13" rx="4" fill="#8d93a1"/><path d="M3 11a7 7 0 0 0 14 0M10 18v4" stroke="#8d93a1" stroke-width="2" fill="none" stroke-linecap="round"/></svg></div>
    <div id="list"></div>

  <div class="shot" id="s8">
    <div class="ring" id="rg1" style="left:80px;top:470px"><svg width="170" height="170" viewBox="0 0 100 100" style="position:absolute;top:30px"><circle cx="50" cy="50" r="42" fill="none" stroke="#2a2c33" stroke-width="7"/><circle id="rc1" cx="50" cy="50" r="42" fill="none" stroke="#30D158" stroke-width="7" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 50 50)"/></svg><b id="rv1" style="margin-top:-14px">0%</b><span style="position:absolute;bottom:34px">SHOW-UP</span></div>
    <div class="ring" id="rg2" style="left:80px;top:810px"><svg width="170" height="170" viewBox="0 0 100 100" style="position:absolute;top:30px"><circle cx="50" cy="50" r="42" fill="none" stroke="#2a2c33" stroke-width="7"/><circle id="rc2" cx="50" cy="50" r="42" fill="none" stroke="#1F6BFF" stroke-width="7" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 50 50)"/></svg><b id="rv2" style="margin-top:-14px">0/4</b><span style="position:absolute;bottom:34px">THIS WEEK</span></div>

      <div style="position:relative;font:600 28px Inter;opacity:.85">By CrewUp</div><div style="position:relative;font:800 64px/1.05 Inter;letter-spacing:-.03em;margin-top:12px">View your<br>monthly recap</div><div style="position:relative;font:600 26px Inter;opacity:.8;margin-top:16px">Tap here</div></div>
  </div>
  <div class="shot" id="s9">
    <div id="w9"><div style="font:700 30px Inter;color:#8d93a1;margin-bottom:40px">THE CREW</div></div>
    <div id="det" style="visibility:hidden"></div>
    <div id="flt" style="visibility:hidden"><div style="display:flex;justify-content:space-between;align-items:center"><b style="font:700 40px Inter">Filters</b><span style="width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font:600 26px Inter">–</span></div><div style="font:500 26px Inter;color:rgba(255,255,255,.7);margin-top:6px">All crews</div></div>
  </div>

</div>

<script src="lib/CopyShader.js"></script><script src="lib/LuminosityHighPassShader.js"></script><script src="lib/FXAAShader.js"></script>
<script src="lib/EffectComposer.js"></script><script src="lib/RenderPass.js"></script><script src="lib/ShaderPass.js"></script><script src="lib/MaskPass.js"></script>
<script src="lib/UnrealBloomPass.js"></script><script src="lib/Reflector.js"></script>

<script>
const { tl, $ } = X;
X.DUR = 27.1;
X.glowAt = [[0, '#1F6BFF']];
const show = (id, a, b) => tl.set('#' + id, { visibility: 'visible' }, a).set('#' + id, { visibility: 'hidden' }, b);
const words = (el, list) => { $(el).innerHTML = list.map(([w, c], i) => `<span class="w" id="${el.slice(1)}w${i}" style="${c || ''}">${w}</span>`).join(' '); };
const wIn = (id, i, t, d = .3) => tl.fromTo(`#${id}w${i}`, { opacity: 0, y: 26, filter: 'blur(16px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: d, ease: 'power3.out' }, t);
const mb = (f, t, amt, d = .16) => tl.fromTo('#' + f, { attr: { stdDeviation: '0 0' } }, { attr: { stdDeviation: amt }, duration: d, ease: 'power2.in', immediateRender: false }, t);
const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));

// ---------- backgrounds ----------
const BG = { light: 'radial-gradient(120% 80% at 50% 45%,#ffffff 0%,#eef4ff 55%,#dfeaff 100%)' };
const solid = c => ({ backgroundImage: 'none', backgroundColor: c });
tl.set('#bg', { backgroundImage: BG.light, backgroundColor: '#ffffff' }, 0)
  .set('#bg', solid('#0b0c0f'), 3.58)
  .set('#bg', solid('#ffffff'), 5.76)
  .set('#bg', solid('#1c1d21'), 7.72)
  .set('#bg', solid('#8d9096'), 12.97).to('#bg', { backgroundColor: '#e7e8ec', duration: .6, ease: 'power2.out' }, 13.05)
  .set('#bg', { backgroundImage: 'radial-gradient(100% 70% at 50% 45%,#f1f2f5,#dcdee3)', backgroundColor: '#e9eaee' }, 17.72)
  .set('#bg', solid('#06070b'), 20.92);

// ---------- S1 "We've all been there..." ----------
words('#t1', [['We’ve'], ['all'], ['been'], ['there...']]);
show('s1', 0, 1.33);
[.08, .2, .32, .44].forEach((t, i) => wIn('t1', i, t));
tl.set('#s1', { filter: 'url(#mbA)' }, 1.1).to('#t1', { x: -220, opacity: 0, duration: .22, ease: 'power2.in' }, 1.11);
mb('mbAb', 1.1, '60 0', .2);
tl.set('#mbAb', { attr: { stdDeviation: '0 0' } }, 1.34).set('#s1', { filter: 'none' }, 1.34);

// ---------- S2 widget: paying for the gym, not going ----------
show('s2', 1.34, 2.88);
tl.fromTo('#w2', { scale: .78, opacity: 0, filter: 'blur(22px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: .38, ease: 'power3.out' }, 1.36)
  .fromTo('#lastv', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: .3 }, 2.02)
  .to('#w2', { scale: 1.32, opacity: 0, filter: 'blur(26px)', duration: .3, ease: 'power2.in' }, 2.56);

// ---------- S3 "but instead..." ----------
words('#t3', [['but'], ['instead...']]);
show('s3', 2.88, 3.58);
wIn('t3', 0, 2.9, .22); wIn('t3', 1, 3.03, .26);
tl.to('#t3', { opacity: 0, filter: 'blur(14px)', scale: 1.06, duration: .16, ease: 'power2.in' }, 3.4);

// ---------- S4 the chaos: excuses, snoozes, group chats ----------
const CHAOS = [
  `<h4>The Gym Crew 💪</h4><div class="bub">gym tmrw?</div><div class="bub">maybe</div><div class="bub">can’t, busy 😩</div><div class="bub me">who’s actually going??</div><div class="mut" style="clear:both;font-size:20px;margin-top:10px">Seen by 5</div>`,
  `<h4>Alarm</h4><div style="font:700 92px Inter;letter-spacing:-.04em">6:00</div><div class="mut">Gym</div><div style="margin-top:22px;display:flex;gap:12px"><span class="bub" style="background:#FF9F0A;color:#111">Snooze</span><span class="bub">x4</span></div>`,
  `<h4>🔔 Reminder</h4><div>You haven’t worked out in <b style="color:#FF453A">9 days</b>.</div><div class="mut" style="margin-top:12px">Tap to see your plan</div>`,
  `<h4>Workout plan v7 (final)</h4>${['Mon · Chest 4x12', 'Tue · Rest', 'Wed · Legs 5x5', 'Thu · Rest', 'Fri · Back 4x10', 'Sat · ???'].map(r => `<div style="display:flex;justify-content:space-between;border-bottom:1px solid #26282e;padding:7px 0"><span>${r}</span><span class="dn">✗</span></div>`).join('')}`,
  `<h4>Calories</h4><div style="font:800 64px Inter">2,431</div><div class="mut">kcal · goal 1,900</div><svg width="100%" height="90" viewBox="0 0 200 60"><polyline points="0,40 20,30 40,44 60,20 80,36 100,12 120,30 140,16 160,40 180,22 200,34" fill="none" stroke="#FF453A" stroke-width="3"/></svg>`,
  `<h4>Steps</h4><div style="font:800 64px Inter">3,204</div><div class="mut">32% of goal</div><div style="height:16px;border-radius:8px;background:#26282e;margin-top:18px"><div style="width:32%;height:100%;border-radius:8px;background:#FF9F0A"></div></div>`,
  `<h4>Omar</h4><div class="bub">bro you coming?</div><div class="bub">we’re here</div><div class="bub me">next week fr</div><div class="bub">🙃</div>`,
  `<h4>Leg day</h4><div style="font:800 80px Inter" class="dn">✗ ✗ ✗</div><div class="mut">skipped 3 weeks in a row</div>`,
  `<h4>Voice note</h4><div style="display:flex;align-items:center;gap:14px;margin-top:14px"><span style="width:56px;height:56px;border-radius:50%;background:#1F6BFF;display:flex;align-items:center;justify-content:center">▶</span><svg width="220" height="50" viewBox="0 0 220 50">${Array.from({ length: 30 }, (_, i) => `<rect x="${i * 7}" y="${25 - (5 + 18 * Math.abs(Math.sin(i * 1.7)))}" width="4" height="${10 + 36 * Math.abs(Math.sin(i * 1.7))}" rx="2" fill="#8d93a1"/>`).join('')}</svg></div><div class="mut" style="margin-top:12px">0:47 · “why I can’t go today”</div>`,
  `<h4>Khalid</h4><div class="bub">monday for sure</div><div class="bub">i swear</div><div class="mut" style="font-size:20px">Monday · Seen</div>`,
  `<h4>Gym app</h4><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${['Sets', 'Reps', 'Rest', 'RPE', 'Macros', 'BMI'].map(x => `<div style="background:#1e2026;border-radius:14px;padding:12px">${x}<div class="mut" style="font-size:20px">--</div></div>`).join('')}</div>`,
  `<h4>Calendar</h4>${['6:00 Gym', '6:00 Gym', '6:00 Gym'].map(r => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #26282e"><span style="text-decoration:line-through;opacity:.6">${r}</span><span class="dn">missed</span></div>`).join('')}`,
];
$('#wall').innerHTML = Array.from({ length: 24 }, (_, i) => `<div class="cc" style="height:${[520, 380, 300, 560, 420, 340][i % 6]}px">${CHAOS[(i * 7) % CHAOS.length]}</div>`).join('');
show('s4', 3.6, 5.8);
tl.fromTo('#wall', { rotateY: -16, rotateX: 10, z: 260, x: 60, y: 80 }, { rotateY: -6, rotateX: 4, z: 120, x: -40, y: -60, duration: 2.0, ease: 'sine.inOut' }, 3.6)
  .fromTo('#wall', { filter: 'blur(10px)' }, { filter: 'blur(0px)', duration: .35, ease: 'power2.out' }, 3.64)
  .to('#wall', { filter: 'blur(4px)', duration: .3, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 4.55)
  .to('#wall', { z: 900, opacity: 0, filter: 'blur(18px)', duration: .26, ease: 'power2.in' }, 5.54);
// TV static into the chaos
const nz = $('#noise').getContext('2d');
const noiseFrame = s => { const id = nz.createImageData(270, 480); let v = s * 99991; for (let i = 0; i < id.data.length; i += 4) { v = (v * 1103515245 + 12345) % 2147483648; const c = v % 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = c; id.data[i + 3] = 255; } nz.putImageData(id, 0, 0); };
tl.set('#noise', { opacity: .9 }, 3.58).to('#noise', { opacity: 0, duration: .14, ease: 'none' }, 3.62);

// ---------- S5 3D phone in ribbons (three.js) ----------
const ctx = X.three({ fov: 30, bloom: .35, radius: .5, threshold: 1.4 });
X.ctx = null;  // rendered by hand only while this shot is on screen
const G = ctx.grade.uniforms; G.vignette.value = .1; G.grain.value = .012; G.lift.value.set(0, 0, 0); G.knee.value = .9; G.fringe.value = .001;
const S5 = { grey: 0 };
ctx.drawBg = t => { const g = ctx.bg.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 192); const k = S5.grey;
  const mix = (a, b) => { const A = hex(a), Bc = hex(b); return `rgb(${A.map((v, i) => Math.round(v + (Bc[i] - v) * k)).join(',')})`; };
  gr.addColorStop(0, mix('#ffffff', '#9a9da3')); gr.addColorStop(1, mix('#e7ecf4', '#7f8288')); g.fillStyle = gr; g.fillRect(0, 0, 108, 192); ctx.bgTex.needsUpdate = true; };
X.studioEnv(ctx, [[0xffffff, [-5, 4, 6], [8, 5], 1.6], [0xffffff, [6, 2, 4], [3, 9], 1.8], [0xffffff, [0, 9, 0], [14, 4], 1.4], [0xdfe8ff, [-6, -3, -4], [6, 6], 1.2], [0xffffff, [5, -4, -5], [6, 5], 1.0]]);
X.lights(ctx);
X.glassMat.envMapIntensity = .3;  // bright white studio: keep the screen glare soft
const ribbons = new THREE.Group(); ctx.scene.add(ribbons);
const phoneRoot = new THREE.Group(); ctx.scene.add(phoneRoot);
const ribbonGeo = (fn, w, n = 220, twist = 3.2) => {
  const pos = new Float32Array((n + 1) * 2 * 3), nor = new Float32Array((n + 1) * 2 * 3), uv = new Float32Array((n + 1) * 2 * 2), idx = [];
  const up = new THREE.Vector3(0, 1, 0);
  for (let i = 0; i <= n; i++) {
    const s = i / n, p = fn(s), p2 = fn(Math.min(1, s + .002)), p1 = fn(Math.max(0, s - .002));
    const T = p2.clone().sub(p1).normalize();
    const Bn = new THREE.Vector3().crossVectors(T, up).normalize().applyAxisAngle(T, Math.sin(s * twist) * 1.1 + s * twist * .5);
    const N = new THREE.Vector3().crossVectors(Bn, T).normalize();
    const a = p.clone().addScaledVector(Bn, w / 2), b = p.clone().addScaledVector(Bn, -w / 2);
    pos.set([a.x, a.y, a.z, b.x, b.y, b.z], i * 6); nor.set([N.x, N.y, N.z, N.x, N.y, N.z], i * 6); uv.set([s, 0, s, 1], i * 4);
    if (i < n) idx.push(i * 2, i * 2 + 1, i * 2 + 2, i * 2 + 1, i * 2 + 3, i * 2 + 2);
  }
