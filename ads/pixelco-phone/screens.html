  <path d="M346 102l22 3" stroke="#e9f7ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M34 104l14-2" stroke="#ff3b3b" stroke-width="5" stroke-linecap="round"/>
  ${[100,300].map(x=>`<g transform="translate(${x} 134)"><circle r="26" fill="#05080b"/><circle r="17" fill="#2a3540"/><circle r="17" fill="none" stroke="#9fb3c2" stroke-width="2"/>${[0,72,144,216,288].map(a=>`<path d="M0 0L${(15*Math.cos(a*Math.PI/180)).toFixed(1)} ${(15*Math.sin(a*Math.PI/180)).toFixed(1)}" stroke="#9fb3c2" stroke-width="3"/>`).join('')}<circle r="4" fill="#9fb3c2"/></g>`).join('')}
</svg>`;}

/* ======================= BUILD ======================= */
const S=SITES[SITE];
app.style.background=S.bg;
app.innerHTML=`${statusBar(S.status)}<div class="page" id="page">${S.page()}</div>
<div class="splash" id="splash" style="background:${S.splashBg}">${S.splash}</div>
<div id="topband" style="position:absolute;left:0;right:0;top:0;height:64px;z-index:49;background:linear-gradient(${S.bg} 70%,${S.bg}00)"></div>
<div class="sheet" id="sheet" style="background:${S.sheetBg};box-shadow:0 -10px 40px rgba(0,0,0,.25)">${S.sheet}</div>
<div class="tap" id="tap"></div><div class="home" style="background:${S.home}"></div>`;
const page=document.getElementById('page'),splash=document.getElementById('splash'),sheet=document.getElementById('sheet'),tap=document.getElementById('tap');
const ins=[...document.querySelectorAll('[data-in]')];
const lg=document.getElementById('lg');
let ctaY=0;
function measure(){const c=document.getElementById('cta');ctaY=c.offsetTop+c.offsetHeight/2;}
window.DURATION=6.5;
window.setTime=function(t){
  // splash: logo pops then wipes up
  const sp=seg(t,.55,1.05);
  splash.style.transform=`translateY(${-ease(sp)*100}%)`;const tb=document.getElementById('topband');if(tb)tb.style.opacity=sp>=1?1:0;splash.style.display=sp>=1?'none':'grid';
  lg.style.transform=`scale(${.85+.15*back(seg(t,0,.45))})`;lg.style.opacity=out(seg(t,0,.3));
  // hero entrances
  ins.forEach(el=>{const i=+el.dataset.in;const k=out(seg(t,.85+i*.1,1.35+i*.1));el.style.opacity=k;el.style.transform=`translateY(${(1-k)*26}px)`;});
  // scroll
  const [a,b,dist]=S.scroll;const sc=ease(seg(t,a,b))*dist;
  page.style.transform=`translateY(${-sc}px)`;
  // tap on CTA
  measure();const ty=ctaY-sc;const tp=seg(t,4.95,5.35);
  tap.style.left='195px';tap.style.top=ty+'px';tap.style.opacity=tp>0&&tp<1?(1-tp)*.9:0;tap.style.transform=`scale(${.6+tp*1.4})`;
  const c=document.getElementById('cta');c.style.transform=`scale(${1-.04*Math.sin(Math.PI*tp)})`;
  // confirmation sheet
  const sh=back(seg(t,5.35,5.85));sheet.style.transform=`translateY(${(1-sh)*110}%)`;
  // site extras
  const cup=document.getElementById('cup');if(cup)cup.style.transform=`translateY(${Math.sin(t*2.2)*4}px) rotate(${Math.sin(t*1.3)*2}deg)`;
  const sw=document.getElementById('sweep');if(sw)sw.style.left=(-120+((t*180)%560))+'px';
  const car=document.getElementById('car');if(car)car.style.transform=`translateX(${(1-out(seg(t,.7,1.6)))*-260}px)`;
  const hero=document.getElementById('hero');if(hero)hero.style.transform=`scale(${1.08-.08*out(seg(t,.6,2.2))})`;
};
document.fonts.ready.then(()=>{measure();setTime(+(Q.get('t')||2));window.READY=true;});
</script>
