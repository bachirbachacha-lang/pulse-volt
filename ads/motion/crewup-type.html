<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Crew Up Type</title>
<style>
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-400-normal.woff2);font-weight:400}
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-700-normal.woff2);font-weight:700}
@font-face{font-family:Taj;src:url(fonts/tajawal-arabic-800-normal.woff2);font-weight:800}
@font-face{font-family:Taj;src:url(fonts/tajawal-latin-400-normal.woff2);font-weight:400;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Taj;src:url(fonts/tajawal-latin-700-normal.woff2);font-weight:700;unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:Taj;src:url(fonts/tajawal-latin-700-normal.woff2);font-weight:800;unicode-range:U+0000-00FF,U+2000-206F}
*{box-sizing:border-box;margin:0;padding:0}
:root{--o:#ff6a3d;--y:#ffd23f;--ink:#fff6ef;--mut:#b9a9a0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#07050a;font-family:Taj,sans-serif;color:var(--ink)}
.abs{position:absolute}
#grid{inset:-120px;background-image:linear-gradient(rgba(255,106,61,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(255,106,61,.09) 1px,transparent 1px);background-size:120px 120px}
#glow{left:40px;top:560px;width:1000px;height:1000px;border-radius:50%;background:radial-gradient(circle,rgba(255,106,61,.32),rgba(255,106,61,0) 65%)}
.ov{left:0;right:0;text-align:center}
.big{font:800 150px/1.08 Taj;direction:rtl}
.big b{color:var(--o);text-shadow:0 0 50px rgba(255,106,61,.6)}
.en{font:400 44px/1.3 Taj;color:var(--mut);margin-top:22px}
.bub{position:absolute;background:#241b22;border-radius:34px;padding:22px 34px 16px;font:700 46px/1 Taj;direction:rtl;box-shadow:0 20px 50px rgba(0,0,0,.5);white-space:nowrap}
.bub.me{background:#3a2420}
#web{left:0;top:0;width:1080px;height:1920px}
.node{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 64px/1 Taj;color:#1a0d08;padding-top:8px;box-shadow:0 0 0 8px rgba(255,255,255,.05),0 20px 60px rgba(0,0,0,.5)}
#verbs{top:1460px;display:flex;justify-content:center;gap:56px;direction:rtl}
.v{font:800 84px/1 Taj;position:relative;color:#5a4a50}
.v small{display:block;font:400 30px/1.4 Taj;color:var(--mut);margin-top:30px;direction:ltr}
.v i{position:absolute;left:0;right:0;top:90px;height:8px;border-radius:4px;background:var(--o);box-shadow:0 0 20px var(--o);transform:scaleX(0)}
#crewlbl{top:240px}
#end{top:520px}
#end .ic{width:220px;height:220px;margin:0 auto;border-radius:60px;background:linear-gradient(135deg,#ffb15a,var(--o) 55%,#d93a1c);box-shadow:0 0 100px rgba(255,106,61,.8);position:relative}
#end .ic svg{position:absolute;inset:38px}
#end .wm{font:800 170px/1 Taj;letter-spacing:-.02em;margin-top:50px;direction:ltr}
#end .wm span{color:var(--o)}
#end .a{font:700 54px/1.3 Taj;margin-top:26px;direction:rtl}
#end .e2{font:400 34px/1.3 Taj;color:var(--mut)}
#end .pill{display:inline-block;margin-top:50px;padding:24px 50px;border-radius:999px;background:var(--o);color:#1a0d08;font:800 46px/1 Taj;direction:rtl}
#label{left:56px;top:84px;font:700 24px/1 Taj;letter-spacing:.06em;color:#ffd9c9;border:2px solid rgba(255,217,201,.35);padding:12px 18px;border-radius:10px;background:rgba(0,0,0,.35);direction:rtl;z-index:9}
#flash{inset:0;background:#ffb08a;mix-blend-mode:screen;opacity:0}
#fade{inset:0;background:#000}
</style>
</head>
<body>
<div id="grid" class="abs"></div>
<div id="glow" class="abs"></div>

<div id="hook" class="abs ov" style="top:620px"><div class="big">مين فاضي<br><b>الخميس؟</b></div><div class="en">Who's free Thursday?</div></div>
<div id="chat" class="abs" style="inset:0"></div>
<div id="easy" class="abs ov" style="top:700px"><div class="big" style="font-size:140px">خلّها<br><b>أسهل.</b></div><div class="en">Make it easy.</div></div>

<svg id="web" class="abs" viewBox="0 0 1080 1920"></svg>
<div id="nodes"></div>
<div id="crewlbl" class="abs ov"><div class="big" style="font-size:110px">هذي <b>شلّتك</b></div><div class="en">This is your crew.</div></div>
<div id="verbs" class="abs ov"></div>

<div id="end" class="abs ov">
  <div class="ic"><svg viewBox="0 0 100 100" fill="#fff6ef"><circle cx="30" cy="62" r="11"/><circle cx="70" cy="62" r="11"/><circle cx="50" cy="46" r="13"/><path d="M50 8l14 16H55v8H45v-8h-9z"/><path d="M14 92c2-10 9-16 16-16s14 6 16 16zM54 92c2-10 9-16 16-16s14 6 16 16z" opacity=".85"/></svg></div>
  <div class="wm">Crew <span>Up</span></div>
  <div class="a">خططوا طلعاتكم سوا</div><div class="e2">Plan hangouts together</div>
  <div class="pill">قريبًا · Coming soon</div>
</div>
<div id="label" class="abs">فكرة تطبيق · APP CONCEPT</div>
<div id="flash" class="abs"></div>
<div id="fade" class="abs"></div>

<script src="lib/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
// group-chat pile-up: the problem
const msgs = [['وين نروح؟', 120, 300], ['متى؟', 640, 420], ['مين جاي؟', 200, 560], ['أي ساعة؟', 560, 700], ['أنا ما أدري', 90, 860], ['😅', 760, 940], ['كوفي؟', 300, 1040], ['لا بولينج', 600, 1180], ['طيب متى؟', 150, 1320], ['؟؟', 720, 1420], ['مين أكّد؟', 260, 1540], ['خلاص بكرة', 560, 1660]];
$('#chat').innerHTML = msgs.map(([m, x, y], i) => `<div class="bub${i % 3 == 1 ? ' me' : ''}" id="m${i}" style="left:${x}px;top:${y}px">${m}</div>`).join('');
// crew constellation
const C = ['#ffb15a', '#ffd23f', '#ff8a6a', '#f6c6a8', '#ffa07a', '#ffe08a'];
const L = ['ف', 'س', 'ع', 'ن', 'م', 'ر'];
const N = [[540, 640], [820, 820], [820, 1160], [540, 1320], [260, 1160], [260, 820]];
$('#nodes').innerHTML = N.map(([x, y], i) => `<div class="node abs" id="n${i}" style="left:${x}px;top:${y}px;background:${C[i]}">${L[i]}</div>`).join('');
const edges = [];
for (let i = 0; i < 6; i++) { edges.push([i, (i + 1) % 6]); if (i < 3) edges.push([i, i + 3]); }
$('#web').innerHTML = edges.map(([a, b], k) => { const [x1, y1] = N[a], [x2, y2] = N[b], len = Math.hypot(x2 - x1, y2 - y1);
  return `<line id="e${k}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ff6a3d" stroke-width="4" stroke-linecap="round" stroke-dasharray="${len}" stroke-dashoffset="${len}" opacity=".8" style="filter:drop-shadow(0 0 8px #ff6a3d)"/>`; }).join('') +
  `<circle id="core" cx="540" cy="980" r="0" fill="rgba(255,106,61,.25)"/>`;
$('#verbs').innerHTML = [['اقترح', 'Suggest'], ['صوّت', 'Vote'], ['اطلع', 'Go']].map(([a, e], i) => `<div class="v" id="v${i}">${a}<small>${e}</small><i></i></div>`).join('');

const DUR = 13;
const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });
tl.set('#fade', { opacity: 1 }).to('#fade', { opacity: 0, duration: .3, ease: 'none' }, 0)
  .fromTo('#hook', { opacity: 0, scale: 1.35, filter: 'blur(16px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: .35 }, 0)
  .to('#hook', { scale: .9, opacity: .25, duration: .4, ease: 'power2.in' }, 1.7);
msgs.forEach((_, i) => tl.fromTo(`#m${i}`, { opacity: 0, scale: .4, y: 40 }, { opacity: 1, scale: 1, y: 0, duration: .22, ease: 'back.out(2.4)' }, 1.85 + i * .1));
tl.to('#hook', { opacity: 0, duration: .2 }, 2.6)
  .to('#chat .bub', { x: () => gsap.utils.random(-1400, 1400, 1), y: () => gsap.utils.random(-600, 600, 1), rotate: () => gsap.utils.random(-50, 50, 1), opacity: 0, duration: .55, ease: 'power3.in', stagger: .015 }, 3.35)
  .to('#flash', { opacity: .6, duration: .08, yoyo: true, repeat: 1 }, 3.8)
  .fromTo('#easy', { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: .35 }, 3.9)
  .to('#easy', { opacity: 0, y: -60, duration: .3, ease: 'power2.in' }, 5.0)
  .fromTo('#crewlbl', { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .4 }, 5.3);
N.forEach((_, i) => tl.fromTo(`#n${i}`, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: .4, ease: 'back.out(2.2)' }, 5.3 + i * .12));
edges.forEach((_, k) => tl.to(`#e${k}`, { attr: { 'stroke-dashoffset': 0 }, duration: .45, ease: 'power2.inOut' }, 5.9 + k * .07));
tl.to('#core', { attr: { r: 170 }, duration: .8, ease: 'power2.out' }, 6.6);
[0, 1, 2].forEach(i => tl.to(`#v${i}`, { color: '#fff6ef', duration: .2 }, 7.4 + i * .55).to(`#v${i} i`, { scaleX: 1, duration: .35, ease: 'power3.out' }, 7.4 + i * .55));
tl.fromTo('#verbs', { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .35 }, 7.2)
  // everything collapses into the logo
  .to(['#crewlbl', '#verbs'], { opacity: 0, duration: .3 }, 9.1)
  .to('.node', { left: 540, top: 980, scale: .2, opacity: 0, duration: .5, ease: 'power3.in' }, 9.2)
  .to('#web', { opacity: 0, duration: .4 }, 9.2)
  .to('#flash', { opacity: .7, duration: .08, yoyo: true, repeat: 1 }, 9.7)
  .fromTo('#end', { opacity: 0 }, { opacity: 1, duration: .2 }, 9.75)
  .fromTo('#end .ic', { scale: .2, rotate: -30 }, { scale: 1, rotate: 0, duration: .6, ease: 'back.out(2)' }, 9.75)
  .fromTo('#end .wm', { opacity: 0, letterSpacing: '.4em' }, { opacity: 1, letterSpacing: '-.02em', duration: .7 }, 10.0)
  .fromTo(['#end .a', '#end .e2', '#end .pill'], { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: .45, stagger: .12 }, 10.4)
  .to('#fade', { opacity: 1, duration: .45, ease: 'none' }, DUR - .45);
tl.set('#easy, #crewlbl, #verbs, #end', { opacity: 0 }, 0);

window.DUR = DUR;
window.renderAt = t => {
  tl.seek(t, false);
  $('#grid').style.transform = `perspective(900px) rotateX(${12 + Math.sin(t * .5) * 3}deg) translateY(${-(t * 40) % 120}px)`;
  $('#glow').style.transform = `scale(${1 + .08 * Math.sin(t * 1.8)})`;
};
document.fonts.ready.then(() => { renderAt(0); window.ready = true; });
if (!/record/.test(location.search)) { const s = performance.now(); (function loop() { renderAt(((performance.now() - s) / 1000) % DUR); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
